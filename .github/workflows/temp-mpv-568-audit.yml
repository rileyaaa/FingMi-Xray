name: Temporary MPV 5.6.8 ABI audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/.trigger-mpv-568-audit"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Verify marker-only trigger
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse "$GITHUB_SHA^")"
          changed="$(git diff --name-only "$parent" "$GITHUB_SHA")"
          test "$changed" = ".github/.trigger-mpv-568-audit"

      - name: Audit published and public MPV native ABI
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mpv568"
          mkdir -p "$work/apk-v7" "$work/apk-v8" "$work/media"
          curl -fL --retry 3 -o "$work/v7.apk"             "https://github.com/FongMi/Release/releases/download/5.6.8/leanback-armeabi_v7a.apk"
          curl -fL --retry 3 -o "$work/v8.apk"             "https://github.com/FongMi/Release/releases/download/5.6.8/leanback-arm64_v8a.apk"
          echo "2859ebef12bf0fa0dfec023d410df478ac5e5a82a72ef2be48f6e4fa09a24761  $work/v7.apk" | sha256sum -c -
          echo "948df594843e304c332476a380163dc1cc74f964be5ea1539ff0465a9dd936eb  $work/v8.apk" | sha256sum -c -

          unzip -q "$work/v7.apk" "lib/armeabi-v7a/libplayer.so" "lib/armeabi-v7a/libmpv.so" "lib/armeabi-v7a/libisoJNI.so" -d "$work/apk-v7"
          unzip -q "$work/v8.apk" "lib/arm64-v8a/libplayer.so" "lib/arm64-v8a/libmpv.so" "lib/arm64-v8a/libisoJNI.so" -d "$work/apk-v8"

          git -C "$work/media" init -q
          git -C "$work/media" remote add origin https://github.com/FongMi/media.git
          git -C "$work/media" fetch --depth=1 origin 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
          git -C "$work/media" checkout -q --detach FETCH_HEAD

          for abi in armeabi-v7a arm64-v8a; do
            if [ "$abi" = armeabi-v7a ]; then
              release_dir="$work/apk-v7/lib/$abi"
            else
              release_dir="$work/apk-v8/lib/$abi"
            fi
            public_dir="$work/media/libraries/mpvplayer/src/main/jniLibs/$abi"

            echo "===== ABI $abi ====="
            for so in libplayer.so libmpv.so; do
              echo "--- $so sha/size ---"
              sha256sum "$public_dir/$so" "$release_dir/$so"
              stat -c '%n %s' "$public_dir/$so" "$release_dir/$so"
            done

            echo "--- release libplayer NEEDED ---"
            readelf -d "$release_dir/libplayer.so" | grep NEEDED || true

            echo "--- release libplayer Java/JNI strings ---"
            strings -a "$release_dir/libplayer.so" | grep -E               'is/xyz/mpv/MPVLib|MPVLib[$./]|openStream|enqueueCommandLongResult|eventCommandReply|Stream|read|seek|size|cancel|close' | sort -u || true

            echo "--- public libplayer Java/JNI strings ---"
            strings -a "$public_dir/libplayer.so" | grep -E               'is/xyz/mpv/MPVLib|MPVLib[$./]|openStream|enqueueCommandLongResult|eventCommandReply|Stream|read|seek|size|cancel|close' | sort -u || true

            echo "--- release libplayer undefined mpv symbols ---"
            nm -D --undefined-only "$release_dir/libplayer.so" | awk '{print $2}' | grep '^mpv_' | sort -u || true

            echo "--- release libmpv defined symbols needed by libplayer ---"
            nm -D --defined-only "$release_dir/libmpv.so" | awk '{print $3}' | grep '^mpv_' | sort -u > "$work/release-$abi-mpv-defined.txt" || true
            nm -D --undefined-only "$release_dir/libplayer.so" | awk '{print $2}' | grep '^mpv_' | sort -u > "$work/release-$abi-player-undef.txt" || true
            comm -23 "$work/release-$abi-player-undef.txt" "$work/release-$abi-mpv-defined.txt" | sed 's/^/MISSING /' || true

            echo "--- release libisoJNI strings ---"
            strings -a "$release_dir/libisoJNI.so" | grep -E               'androidx/media3|Iso|Udf|Navigation|RegisterNatives|JNI_OnLoad' | sort -u | head -300 || true
            echo "--- release libisoJNI NEEDED ---"
            readelf -d "$release_dir/libisoJNI.so" | grep NEEDED || true
          done
