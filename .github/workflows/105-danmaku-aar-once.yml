name: F3 - one-time standalone Danmaku AAR audit

on:
  push:
    branches: [dev/fongmi-upstream-adaptation]
    paths: [.github/workflows/105-danmaku-aar-once.yml]

permissions:
  contents: read

concurrency:
  group: f3-danmaku-aar-once
  cancel-in-progress: false

jobs:
  danmaku:
    if: >-
      github.repository == 'rileyaaa/FingMi-Xray' &&
      github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' &&
      github.event_name == 'push' &&
      !github.event.deleted &&
      !github.event.forced &&
      github.run_attempt == '1' &&
      github.event.head_commit.message == 'ci: verify pinned danmaku AAR once'

    runs-on: ubuntu-26.04
    timeout-minutes: 12

    env:
      MEDIA_COMMIT: 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
      MEDIA_TREE: b7a4d78a2168bd5065034d37a242b7e51785ea4e
      MODULE_TREE: 29836ee83fd4eaed28170e547141e71127284ea2
      GRADLE_SHA256: b84e04fa845fecba48551f425957641074fcc00a88a84d2aae5808743b35fc85

    steps:
      - name: Verify exact trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = rileyaaa/FingMi-Xray
          test "$GITHUB_REF" = refs/heads/dev/fongmi-upstream-adaptation
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 -c 'import json,os; e=json.load(open(os.environ["GITHUB_EVENT_PATH"])); assert e["head_commit"]["message"] == "ci: verify pinned danmaku AAR once" and not e["forced"] and not e["deleted"]'

      - name: JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: jetbrains
          java-version: '21.0.11'
          check-latest: false
          overwrite-settings: false
          token: ''

      - name: Isolated build and artifact audit
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1

          work=$(mktemp -d "$RUNNER_TEMP/f3-danmaku-XXXXXX")
          src="$work/media"
          export GRADLE_USER_HOME="$work/gradle-home"
          export F3_WORK="$work" F3_SRC="$src"

          summary="$GITHUB_STEP_SUMMARY"
          phase=preflight

          finish() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              printf 'FAILED_PHASE=%s\n' "$phase" >> "$summary"
              if [ "$phase" = build ] && [ -f "$work/build.log" ]; then
                awk '/^FAILURE:|^\* What went wrong:|^Execution failed|^> Could not/{print substr($0,1,300); if (++n==6) exit}' \
                  "$work/build.log" >> "$summary"
              fi
            fi

            if ! rm -rf -- "$work"; then rc=1; fi

            if [ "$rc" -eq 0 ] && [ "$phase" = complete ]; then
              echo 'RESULT=PASS_DANMAKU_STANDALONE_AAR' >> "$summary"
            else
              echo 'RESULT=FAIL_OR_INCOMPLETE' >> "$summary"
              rc=1
            fi

            printf '```\n' >> "$summary"
            exit "$rc"
          }

          trap finish EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          printf '```text\n' >> "$summary"
          printf 'PIN_COMMIT=%s\nPIN_TREE=%s\nPIN_MODULE_TREE=%s\n' \
            "$MEDIA_COMMIT" "$MEDIA_TREE" "$MODULE_TREE" >> "$summary"

          printf 'FULL_14_AAR_HOST_CLOSURE=NOT_RUN\nHOST_DEX_UI_RUNTIME=NOT_RUN\n' \
            >> "$summary"

          # Require the historical JBR version/build.
          test "$(javac -version 2>&1)" = 'javac 21.0.11'
          java -version > "$work/java.version" 2>&1
          grep -F '1163.125' "$work/java.version" >/dev/null
          sed -n '1,3p' "$work/java.version" >> "$summary"

          # Public source only. No fork checkout or persisted token.
          phase=source
          git init -q "$src"
          git -C "$src" -c credential.helper= fetch \
            --quiet --depth=1 --no-tags \
            https://github.com/FongMi/media.git "$MEDIA_COMMIT"
          git -C "$src" checkout --quiet --detach FETCH_HEAD
          cd "$src"

          test "$(git rev-parse HEAD)" = "$MEDIA_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$MEDIA_TREE"
          test "$(git rev-parse HEAD:libraries/ui_danmaku)" = "$MODULE_TREE"

          test "$(git hash-object LICENSE)" = \
            d645695673349e3947e8e5ae42332d0ac3164cd7

          test "$(git hash-object gradle/wrapper/gradle-wrapper.properties)" = \
            7b0b78c686dd7e9d549c696b6a3ce38a8d43779e

          test "$(git hash-object gradle/libs.versions.toml)" = \
            7d0a7a49d49bce8f46c5a3007b24251c288b232b

          test -z "$(git status --porcelain)"
          echo 'SOURCE_PINS_VERIFIED=PASS' >> "$summary"
          echo "LICENSE_SHA256=$(sha256sum LICENSE | cut -d' ' -f1)" >> "$summary"

          # Verify Gradle distribution using a temporary wrapper copy.
          wrapper="$work/wrapper"
          mkdir -p "$wrapper/gradle/wrapper"
          cp gradlew "$wrapper/"
          cp gradle/wrapper/gradle-wrapper.{jar,properties} \
            "$wrapper/gradle/wrapper/"

          printf '\ndistributionSha256Sum=%s\n' "$GRADLE_SHA256" \
            >> "$wrapper/gradle/wrapper/gradle-wrapper.properties"

          phase=sdk
          # Only the runner's preinstalled SDK is permitted.
          # Do not accept SDK licenses or install missing SDK packages.
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo 'SDK_PREFLIGHT=ANDROID_HOME_MISSING' >> "$summary"
            exit 1
          fi
          sdk="$ANDROID_HOME"

          if [ ! -s "$sdk/platforms/android-36/android.jar" ]; then
            echo 'SDK_PREFLIGHT=ANDROID_36_MISSING' >> "$summary"
            exit 1
          fi
          if [ ! -x "$sdk/build-tools/36.0.0/aapt2" ]; then
            echo 'SDK_PREFLIGHT=BUILD_TOOLS_36_0_0_MISSING' >> "$summary"
            exit 1
          fi

          if ! grep -Eq '^AndroidVersion.ApiLevel[[:space:]]*=[[:space:]]*36$' \
            "$sdk/platforms/android-36/source.properties"; then
            echo 'SDK_PREFLIGHT=ANDROID_36_METADATA_MISMATCH' >> "$summary"
            exit 1
          fi
          if ! grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*36\.0\.0$' \
            "$sdk/build-tools/36.0.0/source.properties"; then
            echo 'SDK_PREFLIGHT=BUILD_TOOLS_36_0_0_METADATA_MISMATCH' >> "$summary"
            exit 1
          fi

          echo 'SDK_PREFLIGHT=PREINSTALLED_ONLY_PASS' >> "$summary"
          echo "ANDROID_JAR_SHA256=$(sha256sum "$sdk/platforms/android-36/android.jar" | cut -d' ' -f1)" \
            >> "$summary"

          # Resolve actual runtime artifacts, without changing the catalog.
          cat > "$work/audit.init.gradle" <<'GROOVY'
          import groovy.json.JsonOutput
          import org.gradle.api.artifacts.component.ProjectComponentIdentifier
          import org.gradle.api.artifacts.component.ModuleComponentIdentifier

          gradle.projectsEvaluated {
              if (gradle.gradleVersion != '9.1.0')
                  throw new GradleException('Gradle version drift')

              def p = gradle.rootProject.project(':lib-ui-danmaku')
              def android = p.extensions.getByName('android')

              if (android.compileSdk != 36 || android.defaultConfig.minSdk != 23)
                  throw new GradleException('Android SDK contract drift')

              def runtime = p.configurations.getByName('releaseRuntimeClasspath')

              def component = { id ->
                  if (id instanceof ProjectComponentIdentifier)
                      return id.projectPath
                  if (id instanceof ModuleComponentIdentifier)
                      return "${id.group}:${id.module}:${id.version}".toString()
                  throw new GradleException(
                      'Unexpected component: ' + id.displayName)
              }

              p.tasks.register('auditDanmakuRuntime') {
                  dependsOn p.tasks.named('assembleRelease')
                  dependsOn runtime.buildDependencies

                  doLast {
                      def rows = runtime.incoming.artifacts.artifacts.collect { a ->
                          [
                              component: component(a.id.componentIdentifier),
                              id: a.id.displayName,
                              file: a.file.absolutePath
                          ]
                      }

                      def graph = runtime.incoming.resolutionResult
                          .allComponents.collect { component(it.id) }.sort()

                      new File(
                          System.getenv('F3_WORK'), 'runtime.json'
                      ).text = JsonOutput.toJson([
                          components: graph,
                          artifacts: rows
                      ])
                  }
              }
          }
          GROOVY

          phase=build

          timeout --kill-after=10s 8m \
            bash "$wrapper/gradlew" -p "$src" \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --console=plain \
            --max-workers=2 \
            -Porg.gradle.java.installations.auto-download=false \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m' \
            --init-script "$work/audit.init.gradle" \
            :lib-ui-danmaku:assembleRelease \
            :lib-ui-danmaku:auditDanmakuRuntime \
            > "$work/build.log" 2>&1

          test -s "$work/runtime.json"
          test -z "$(git status --porcelain --untracked-files=no)"

          printf 'GRADLE=9.1.0\nGRADLE_DIST_SHA256=%s\nAGP_CATALOG=9.0.1\nCOMPILE_SDK=36\nMIN_SDK=23\n' \
            "$GRADLE_SHA256" >> "$summary"

          phase=artifact-audit

          python3 - <<'PY' >> "$summary"
          import hashlib, io, json, os, re, subprocess, sys
          import xml.etree.ElementTree as ET
          from collections import defaultdict, Counter
          from pathlib import Path
          from zipfile import ZipFile

          def require(ok, why):
              if not ok:
                  raise RuntimeError(why)

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def emit(k, v):
              print(f'{k}={v}', flush=True)

          def names(z):
              entries = [x.filename for x in z.infolist() if not x.is_dir()]
              require(len(entries) == len(set(entries)), 'duplicate ZIP entry')
              require(z.testzip() is None, 'bad ZIP CRC')
              return entries

          def native(n):
              return n.startswith(('jni/', 'prefab/')) or n.lower().endswith(
                  ('.so', '.a', '.dll', '.dylib', '.jnilib'))

          work = Path(os.environ['F3_WORK'])
          src = Path(os.environ['F3_SRC'])
          owners = defaultdict(set)
          stats = Counter()

          def scan_jar(data, owner, target=False):
              with ZipFile(io.BytesIO(data)) as z:
                  entries = names(z)

                  if target:
                      require(not any(map(native, entries)),
                              'native payload in target JAR')
                      require(not any(n.endswith('.jar') for n in entries),
                              'unexpected nested JAR')

                  for n in entries:
                      if not n.endswith('.class'):
                          continue

                      logical = re.sub(r'^META-INF/versions/[0-9]+/', '', n)

                      if logical == 'module-info.class':
                          stats['module_descriptors'] += 1
                          continue

                      if logical != n:
                          stats['multi_release_classes'] += 1

                      owners[logical].add(owner)

                  stats['jars'] += 1
                  return set(entries)

          def scan_aar(data, owner, target=False):
              with ZipFile(io.BytesIO(data)) as z:
                  entries = names(z)

                  if target:
                      require(not any(map(native, entries)),
                              'native payload in target AAR')

                  jars = [
                      n for n in entries
                      if n == 'classes.jar'
                      or (n.startswith('libs/') and n.endswith('.jar'))
                  ]

                  if target:
                      require('classes.jar' in jars, 'missing classes.jar')
                      require(
                          not any(n.endswith('.jar') and n not in jars
                                  for n in entries),
                          'unexpected non-runtime JAR in target')

                  base = set()
                  for n in jars:
                      found = scan_jar(
                          z.read(n), owner + '!' + n, target)
                      if n == 'classes.jar':
                          base = found

                  stats['aars'] += 1
                  return base

          def duplicates():
              return sorted(
                  n for n, who in owners.items() if len(who) > 1)

          def require_api(jar, cls, expected):
              s = subprocess.check_output(
                  ['javap', '-public', '-s', '-classpath', str(jar), cls],
                  text=True, timeout=20)

              lines = s.splitlines()
              actual = set()

              for i, line in enumerate(lines[:-1]):
                  t = line.strip()
                  if (t.startswith('public ') and '(' in t
                      and lines[i+1].strip().startswith('descriptor:')):
                      method = t.split('(', 1)[0].split()[-1]
                      descriptor = lines[i+1].strip().split(':', 1)[1].strip()
                      actual.add((
                          '<init>' if method == cls else method,
                          descriptor
                      ))

              missing = set(expected) - actual
              require(not missing,
                      f'API missing {cls}: {sorted(missing)}')

              return [cls + ' ' + m + ' ' + d for m, d in expected]

          def main():
              out = src/'libraries/ui_danmaku/build/outputs/aar'
              aars = list(out.glob('*.aar'))

              require(
                  len(aars) == 1
                  and aars[0].name == 'lib-ui-danmaku-release.aar',
                  'missing/ambiguous release AAR')

              data = aars[0].read_bytes()
              emit('AAR_BYTES', len(data))
              emit('AAR_SHA256', digest(data))

              base = scan_aar(data, 'target', True)
              emit('TARGET_DUPLICATE_CLASSES', len(duplicates()))
              require(not duplicates(), 'duplicate classes inside target')

              with ZipFile(io.BytesIO(data)) as z:
                  root = ET.fromstring(z.read('AndroidManifest.xml'))
                  require(
                      root.get('package') == 'androidx.media3.ui.danmaku',
                      'manifest package drift')

                  sdk = root.find('uses-sdk')
                  require(
                      sdk is not None
                      and sdk.get(
                          '{http://schemas.android.com/apk/res/android}minSdkVersion'
                      ) == '23',
                      'manifest minSdk drift')

                  props = dict(
                      line.split('=', 1)
                      for line in z.read(
                          'META-INF/com/android/build/gradle/aar-metadata.properties'
                      ).decode().splitlines()
                      if '=' in line and not line.startswith('#')
                  )

                  require(props.get('minCompileSdk') == '36',
                          'AAR minCompileSdk drift')

                  jar = work/'target-classes.jar'
                  jar.write_bytes(z.read('classes.jar'))

              # All 32 tracked Java source classes must really exist.
              prefix = 'libraries/ui_danmaku/src/main/java/'
              tracked = subprocess.check_output(
                  ['git', '-C', str(src), 'ls-tree', '-r',
                   '--name-only', 'HEAD', '--', prefix],
                  text=True).splitlines()

              expected = {
                  p[len(prefix):-5] + '.class'
                  for p in tracked if p.endswith('.java')
              }

              require(len(expected) == 32 and expected <= base,
                      'tracked Java classes missing')

              require(
                  'androidx/media3/ui/danmaku/DanmakuPlayerViewController.class'
                  not in owners,
                  'unexpected new controller')

              emit('TRACKED_TOP_LEVEL_CLASSES', len(expected))
              emit('TARGET_LOGICAL_CLASSES', len(owners))
              emit('TARGET_CLASS_SET_SHA256',
                   digest('\n'.join(sorted(owners)).encode()))
              emit('TARGET_NATIVE_PAYLOAD', 0)

              p = 'androidx.media3.ui.danmaku.'
              d = 'Landroidx/media3/ui/danmaku/'

              api = {
                  'DanmakuController': [
                      ('<init>', '()V'),
                      ('setPlayer', '(Landroidx/media3/common/Player;)V'),
                      ('setView', f'({d}DanmakuView;)V'),
                      ('setOkHttpClient', '(Lokhttp3/OkHttpClient;)V'),
                      ('setDataSource', '(Landroid/net/Uri;)V'),
                      ('setDataSource',
                       '(Landroid/net/Uri;Landroidx/media3/datasource/DataSource$Factory;)V'),
                      ('setConfig', f'({d}DanmakuConfig;)V'),
                      ('getConfig', f'(){d}DanmakuConfig;'),
                      ('setEnabled', '(Z)V'),
                      ('setItems', '(Ljava/util/List;)V'),
                      ('clearItems', '()V'),
                      ('sendNow', '(Ljava/lang/String;)V'),
                      ('sendNow', f'({d}Danmaku;)V'),
                      ('release', '()V'),
                  ],
                  'DanmakuView': [
                      ('<init>', '(Landroid/content/Context;)V'),
                      ('<init>', '(Landroid/content/Context;Landroid/util/AttributeSet;)V'),
                      ('<init>', '(Landroid/content/Context;Landroid/util/AttributeSet;I)V'),
                      ('setConfig', f'({d}DanmakuConfig;)V'),
                      ('start', '(J)V'),
                      ('pause', '()V'),
                      ('resume', '()V'),
                      ('seekTo', '(J)V'),
                      ('release', '()V'),
                  ],
                  'Danmaku': [
                      ('<init>', '(Ljava/lang/String;J)V'),
                  ],
                  'DanmakuConfig': [
                      ('buildUpon', f'(){d}DanmakuConfig$Builder;'),
                  ],
                  'DanmakuConfig$Builder': [
                      ('<init>', '()V'),
                      ('build', f'(){d}DanmakuConfig;'),
                  ],
              }

              # Verify all 36 existing Builder setter descriptors.
              types = {
                  'J': 'DurationMs FixedDurationMs TimeOffsetMs',
                  'F': (
                      'TextSizeSp TextScale Transparency ShadowTransparency '
                      'ShadowRadiusMultiplier StrokeWidthMultiplier '
                      'ProjectionOffsetXMultiplier ProjectionOffsetYMultiplier '
                      'ProjectionTransparency ScrollAreaRatio LineSpacing '
                      'ScrollSpeedFactor ScrollGapRatio'
                  ),
                  'I': (
                      'StyleMode MaxOnScreen MaxScrollLines MaxTopLines '
                      'MaxBottomLines ColorMode'
                  ),
                  'Z': (
                      'TextBold ShowScroll ShowTop ShowBottom ShowReverse '
                      'AllowOverlapping AllowScrollOverlap AllowTopOverlap '
                      'AllowBottomOverlap AllowReverseOverlap '
                      'ShowPositioned ShowSubtitle ShowSpecial'
                  ),
                  'Landroid/graphics/Typeface;': 'Typeface',
              }

              for t, setters in types.items():
                  api['DanmakuConfig$Builder'] += [
                      ('set' + n, f'({t}){d}DanmakuConfig$Builder;')
                      for n in setters.split()
                  ]

              receipts = []
              for cls, methods in api.items():
                  receipts.extend(require_api(jar, p + cls, methods))

              emit('API_DESCRIPTOR_CHECKS', len(receipts))
              emit('API_SHA256',
                   digest('\n'.join(sorted(receipts)).encode()))

              emit('STANDALONE_AAR_CONTENT', 'PASS')
              emit('NEW_DANMAKU_PLAYER_VIEW_CONTROLLER', 'NOT_PRESENT')

              # Real resolved runtime artifacts, not source-path comparison.
              graph = json.loads((work/'runtime.json').read_text())
              rows = graph['artifacts']
              require(bool(rows), 'empty runtime artifacts')

              components = {r['component'] for r in rows}
              required = {
                  ':lib-common',
                  ':lib-database',
                  ':lib-datasource',
                  ':lib-datasource-okhttp',
                  'com.squareup.okhttp3:okhttp:4.12.0',
                  'org.brotli:dec:0.1.2',
              }

              require(required <= components,
                      'required runtime dependencies absent/drifted')

              # Compare actual AARs against existing receipts when available.
              prior = {
                  ':lib-common':
                      'f835fd9dca0dd562e56430dc0861b468888dbb85301cff314753f1dcdd1fc186',
                  ':lib-database':
                      '520e6f814e42a7d428db187ac073b453c0fcba0f4f5f4edd1cf33fafd2cfb740',
                  ':lib-datasource':
                      '01ca3ee28ec995eb143c740f3672413b5b3ec429be71565388bf7e265420c15b',
                  ':lib-datasource-okhttp':
                      '67875d86e6339b75baf39c359b22da12ce1fce24f9d15b2144583c568bef742c',
              }

              matched = set()
              drift = set()
              manifest = []
              seen = set()

              for r in rows:
                  f = Path(r['file'])
                  c = r['component']
                  key = c + '|' + r['id']

                  require(key not in seen,
                          'ambiguous runtime artifact identity')
                  seen.add(key)

                  require(
                      f.is_file() and f.suffix in ('.aar', '.jar'),
                      'unsupported runtime artifact: ' + key)

                  b = f.read_bytes()
                  h = digest(b)
                  manifest.append(key + '|' + f.name + '|' + h)

                  if f.suffix == '.aar':
                      scan_aar(b, key)
                      if c in prior:
                          (matched if h == prior[c] else drift).add(c)
                  else:
                      scan_jar(b, key)

                  stats[
                      ('project' if c.startswith(':') else 'external')
                      + '_' + f.suffix[1:]
                  ] += 1

              dup = duplicates()

              emit('RUNTIME_ARTIFACT_COUNT', len(rows))
              emit('RUNTIME_COMPONENT_SET_SHA256',
                   digest('\n'.join(sorted(graph['components'])).encode()))
              emit('RUNTIME_ARTIFACT_SET_SHA256',
                   digest('\n'.join(sorted(manifest)).encode()))
              emit('ARCHIVE_SCAN_COUNTS', json.dumps(stats, sort_keys=True))
              emit('RUNTIME_DUPLICATE_CLASSES', len(dup))
              emit('MATCHED_PRIOR_AARS',
                   ','.join(sorted(matched)) or 'NONE')
              emit('PRIOR_AARS_NOT_COMPARABLE',
                   ','.join(sorted(set(prior)-matched-drift)) or 'NONE')
              emit('PRIOR_AAR_SHA_DRIFT',
                   ','.join(sorted(drift)) or 'NONE')

              emit('DUPLICATE_SCOPE',
                   'target + actual public releaseRuntimeClasspath; not full TV host')

              require(not dup,
                      'duplicate classes: ' + ', '.join(dup[:8]))
              require(not drift, 'prior AAR digest drift')

          try:
              main()
          except Exception as e:
              emit('AUDIT_ERROR', str(e).replace('\n', ' ')[:500])
              sys.exit(1)
          PY

          phase=complete
