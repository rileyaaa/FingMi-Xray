name: Temporary native 5.6.8 ABI audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/.trigger-native-568-audit'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Verify marker-only trigger
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          parent="$(git rev-parse "$GITHUB_SHA^")"
          changed="$(git diff --name-only "$parent" "$GITHUB_SHA")"
          test "$changed" = ".github/.trigger-native-568-audit"

      - uses: actions/checkout@v7
        with:
          repository: FongMi/media
          ref: 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
          path: media

      - name: Download pinned APK evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit/apk audit/so
          curl -fL --retry 3             'https://github.com/FongMi/Release/releases/download/5.6.8/leanback-armeabi_v7a.apk'             -o audit/apk/568-v7.apk
          curl -fL --retry 3             'https://github.com/FongMi/Release/releases/download/5.6.8/leanback-arm64_v8a.apk'             -o audit/apk/568-v8.apk
          echo '2859ebef12bf0fa0dfec023d410df478ac5e5a82a72ef2be48f6e4fa09a24761  audit/apk/568-v7.apk' | sha256sum -c -
          echo '948df594843e304c332476a380163dc1cc74f964be5ea1539ff0465a9dd936eb  audit/apk/568-v8.apk' | sha256sum -c -

          gh release download v5.6.0-xray.5             --repo rileyaaa/FingMi-Xray             --pattern 'FongMi-Xray-TV-v5.6.0-xray.5-armeabi-v7a.apk'             --pattern 'FongMi-Xray-TV-v5.6.0-xray.5-arm64-v8a.apk'             --dir audit/apk
          mv audit/apk/FongMi-Xray-TV-v5.6.0-xray.5-armeabi-v7a.apk audit/apk/560-v7.apk
          mv audit/apk/FongMi-Xray-TV-v5.6.0-xray.5-arm64-v8a.apk audit/apk/560-v8.apk
          echo 'cacc7a90ce082adf955fc80a444b54f8cc86d5b5c3ac7acb13d1392b59928bda  audit/apk/560-v7.apk' | sha256sum -c -
          echo 'b5ac05193c1e19809fc7ffb3048f7d75aaa2124eace9953d669f4a81a477c21d  audit/apk/560-v8.apk' | sha256sum -c -

      - name: Extract native libraries
        shell: bash
        run: |
          set -euo pipefail
          for tuple in 'v7 armeabi-v7a' 'v8 arm64-v8a'; do
            set -- $tuple
            short="$1"; abi="$2"
            mkdir -p "audit/so/568-$short" "audit/so/560-$short" "audit/so/source-$short"
            for lib in libmpv.so libavcodec.so libnodebridge.so libisoJNI.so libffmpegDoviJNI.so libffmpegJNI.so; do
              unzip -p "audit/apk/568-$short.apk" "lib/$abi/$lib" > "audit/so/568-$short/$lib" 2>/dev/null || rm -f "audit/so/568-$short/$lib"
              unzip -p "audit/apk/560-$short.apk" "lib/$abi/$lib" > "audit/so/560-$short/$lib" 2>/dev/null || rm -f "audit/so/560-$short/$lib"
            done
            cp "media/libraries/mpvplayer/src/main/jniLibs/$abi/libmpv.so" "audit/so/source-$short/libmpv.so"
            cp "media/libraries/decoder_ffmpeg/src/main/jniLibs/$abi/libavcodec.so" "audit/so/source-$short/libavcodec.so"
            if [ -f "media/libraries/decoder_ffmpeg/src/main/jniLibs/$abi/libffmpegJNI.so" ]; then
              cp "media/libraries/decoder_ffmpeg/src/main/jniLibs/$abi/libffmpegJNI.so" "audit/so/source-$short/libffmpegJNI.so"
            fi
          done
          rm -rf audit/apk media

      - name: Compare ELF ABI surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess

          root = Path("audit/so")
          libs = ["libmpv.so","libavcodec.so","libnodebridge.so","libisoJNI.so","libffmpegDoviJNI.so","libffmpegJNI.so"]

          def out(*args):
              return subprocess.run(args, check=True, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT).stdout

          def info(path):
              data=path.read_bytes()
              dyn=out("readelf","-dW",str(path))
              soname=""
              needed=[]
              for line in dyn.splitlines():
                  if "(SONAME)" in line:
                      m=re.search(r"\[([^]]+)\]",line); soname=m.group(1) if m else ""
                  if "(NEEDED)" in line:
                      m=re.search(r"\[([^]]+)\]",line)
                      if m: needed.append(m.group(1))
              syms=set()
              for line in out("readelf","-Ws",str(path)).splitlines():
                  parts=line.split()
                  if len(parts) < 8 or parts[-1] == "UND": continue
                  # Num Value Size Type Bind Vis Ndx Name
                  if parts[4] not in ("GLOBAL","WEAK") or parts[6] == "UND": continue
                  name=parts[7].split("@",1)[0]
                  if name and name not in ("0",): syms.add(name)
              return {
                  "sha": hashlib.sha256(data).hexdigest(),
                  "size": len(data), "soname": soname,
                  "needed": tuple(sorted(needed)), "syms": syms,
              }

          for short in ("v7","v8"):
              print(f"===== ABI {short} =====")
              groups={}
              for origin in ("source","560","568"):
                  groups[origin]={}
                  for lib in libs:
                      p=root/f"{origin}-{short}"/lib
                      if p.is_file() and p.stat().st_size:
                          groups[origin][lib]=info(p)
              for lib in libs:
                  present=[o for o in ("source","560","568") if lib in groups[o]]
                  if not present: continue
                  print(f"--- {lib} present={','.join(present)}")
                  for o in present:
                      x=groups[o][lib]
                      print(f"{o}: sha256={x['sha']} size={x['size']} soname={x['soname'] or '-'}")
                      print(f"{o}: needed={','.join(x['needed'])}")
                      print(f"{o}: exports={len(x['syms'])}")
                  new=groups.get("568",{}).get(lib)
                  if new:
                      for oldname in ("source","560"):
                          old=groups.get(oldname,{}).get(lib)
                          if not old: continue
                          lost=sorted(old["syms"]-new["syms"])
                          gained=sorted(new["syms"]-old["syms"])
                          print(f"{oldname}->568: lost_exports={len(lost)} gained_exports={len(gained)}")
                          if lost:
                              print("lost_sample="+",".join(lost[:30]))
                          if gained:
                              print("gained_sample="+",".join(gained[:30]))
                          print(f"{oldname}->568: soname_same={old['soname']==new['soname']} needed_same={old['needed']==new['needed']}")
                  jni=sorted(s for s in groups.get("568",{}).get(lib,{}).get("syms",set()) if s.startswith("Java_") or s=="JNI_OnLoad")
                  if jni:
                      print("568_jni="+",".join(jni))
          PY
