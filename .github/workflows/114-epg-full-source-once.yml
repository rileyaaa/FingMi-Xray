name: EPG full source replay (one time)

on:
  push:
    branches: [dev/fongmi-upstream-adaptation]
    paths: [.github/workflows/114-epg-full-source-once.yml]

permissions:
  contents: read

concurrency:
  group: fingmi-epg-full-source-114
  cancel-in-progress: false

jobs:
  full-source:
    if: >-
      github.repository == 'rileyaaa/FingMi-Xray' &&
      github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' &&
      github.event_name == 'push' &&
      github.event.before == 'a02429c0e06f07a667fcee5e698bd22adb241a48' &&
      github.run_attempt == '1' &&
      !github.event.deleted && !github.event.forced &&
      github.event.head_commit.message == 'test: replay frozen EPG source boundary once'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          fetch-tags: false
          lfs: false
          submodules: false
          path: event
      - name: Verify exact event and frozen review inputs
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          base=a02429c0e06f07a667fcee5e698bd22adb241a48
          dir=scripts/upstream-adaptation/tests/114-epg
          workflow=.github/workflows/114-epg-full-source-once.yml
          test "$(git -C event rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C event rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $base"
          test "$(git -C event rev-parse "$base^{tree}")" = 46ce297ec3504d175cfe5bdec0a7c2fb8bae8f8f
          files=(apply_review_plan.py epg-review-edits.json prepare_browse_review.py browse-reviewed-source.diff replay_source.py)
          actual=$(git -C event diff-tree --no-commit-id --name-status --no-renames -r "$base" HEAD | LC_ALL=C sort)
          expected=$({ printf 'A\t%s\n' "$workflow"; for f in "${files[@]}"; do printf 'A\t%s/%s\n' "$dir" "$f"; done; } | LC_ALL=C sort)
          test "$actual" = "$expected"
          printf '%s\n' "$actual"
          for f in "$workflow" "${files[@]/#/$dir/}"; do
            test "$(git -C event ls-tree HEAD -- "$f" | cut -d' ' -f1)" = 100644
          done
          test "$(git -C event rev-parse HEAD:scripts/upstream-adaptation/prepare_candidate.py)" = 3d5b90296ef1fe40aa2e93f7418a4553cc8610a0
          test "$(git -C event rev-parse HEAD:scripts/upstream-adaptation/lock.json)" = d33ade8301812e7964edf16b07fe9437ff83e791
          test ! -e event/signing
          test ! -e event/.github/workflows/112-arm64-libxml2-ttml-once.yml
          test ! -e event/.github/workflows/113-candidate-source-boundary-once.yml
          cd "event/$dir"
          sha256sum -c <<'EOF'
          85104d2cc08e21c9d91887cccfdef666b7c5e890bd31746482b887266834ddbe  apply_review_plan.py
          e8c29192039f40d13dae290a590f9df8ffad8565f3f27bc2b81fd38e938ab7ce  epg-review-edits.json
          c998838e2b2b804de26a5ed1563c91f0c5bb3be1ee91035acc6f3437cd444f80  prepare_browse_review.py
          32b5548504075bd8060172a01df4910781e6a15d65e4e6e820549792c14d29a6  browse-reviewed-source.diff
          5f160d1ec196fa2feb4a6430539c3bc8e1acf1ff46e93046b8bc3aec9e751949  replay_source.py
          EOF
          wc -c "${files[@]}"
          cd "$GITHUB_WORKSPACE"
          git -C event worktree add --detach "$RUNNER_TEMP/epg-base" "$base"
          git -C event worktree add --detach "$RUNNER_TEMP/epg-review" "$base"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FongMi/TV
          ref: c616c0aa3613e87529791587a9f71b78c278c991
          path: inputs/old-tv
          fetch-depth: 1
          persist-credentials: false
          fetch-tags: false
          lfs: false
          submodules: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FongMi/TV
          ref: d3a0b84b24cf6628d72a4dbc2be453875b005536
          path: inputs/tv
          fetch-depth: 1
          persist-credentials: false
          fetch-tags: false
          lfs: false
          submodules: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FongMi/media
          ref: 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
          path: inputs/media
          fetch-depth: 1
          persist-credentials: false
          fetch-tags: false
          lfs: false
          submodules: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FongMi/media
          ref: 2bc207851df311340767e913931ca7b28cab1794
          path: inputs/media-default
          fetch-depth: 1
          persist-credentials: false
          fetch-tags: false
          lfs: false
          submodules: false
      - name: Reproduce rules and actual source gates and existing regressions
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 runner prerequisite}"
          export PATH="$JAVA_HOME/bin:$PATH"
          unset PYTHONOPTIMIZE
          export PYTHONDONTWRITEBYTECODE=1
          git --version
          python3 --version
          java -version
          javac -version
          python3 -I -B event/scripts/upstream-adaptation/tests/114-epg/replay_source.py \
            --dev "$RUNNER_TEMP/epg-base" --review "$RUNNER_TEMP/epg-review" \
            --old-tv inputs/old-tv --tv inputs/tv \
            --media inputs/media --media-default inputs/media-default
