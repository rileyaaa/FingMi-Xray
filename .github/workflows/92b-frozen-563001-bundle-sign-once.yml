        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/fingmi-563001-sign-$GITHUB_RUN_ID"
          mkdir "$work"
          curl --fail --silent --show-error --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/rileyaaa/FingMi-Xray/actions/artifacts/15014380363/zip' -o "$work/unsigned.zip"
          printf '%s  %s\n' '323b2c9b11e36f14ed4e3fb7703d3d0022a0d7c9fee1d2fcbd4e760fadede1b9' "$work/unsigned.zip" | sha256sum -c -
          test "$(stat -c %s "$work/unsigned.zip")" = 126797959
      - name: "Download exact signed candidate by artifact identity"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ needs.sign.outputs.artifact_id }}
          CANDIDATE_DIGEST: ${{ needs.sign.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$CANDIDATE_ID" =~ ^[0-9]+$ ]]
          digest="${CANDIDATE_DIGEST#sha256:}"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          work="$RUNNER_TEMP/fingmi-563001-sign-$GITHUB_RUN_ID"
          curl --fail --silent --show-error --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/rileyaaa/FingMi-Xray/actions/artifacts/$CANDIDATE_ID/zip" -o "$work/signed.zip"
