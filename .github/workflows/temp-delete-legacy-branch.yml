name: Temporary delete merged legacy branch

on:
  push:
    branches:
      - main
    paths:
      - ".github/.trigger-delete-legacy-branch"

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify marker-only trigger
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse "$GITHUB_SHA^")"
          changed="$(git diff --name-only "$parent" "$GITHUB_SHA")"
          test "$changed" = ".github/.trigger-delete-legacy-branch"

      - name: Delete fully merged legacy branch
        shell: bash
        run: |
          set -euo pipefail
          branch="sync-upstream-c616c0aa"
          git fetch origin main "$branch"
          git merge-base --is-ancestor "origin/$branch" "origin/main"
          git push origin --delete "$branch"
