name: "01｜独立开发验证（手动，不发布）"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "明确选择单独验证任务；默认不构建"
        type: choice
        required: true
        default: none
        options:
          - none
          - frozen-signing-handoff
          - upstream-adaptation

permissions:
  contents: read
jobs:
  frozen-signing-handoff:
    if: github.repository == 'rileyaaa/FingMi-Xray' && github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' && inputs.task == 'frozen-signing-handoff'
    permissions:
      contents: read
    uses: ./.github/workflows/04-frozen-signing-handoff.yml
  source-stage:
    if: github.repository == 'rileyaaa/FingMi-Xray' && github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' && inputs.task == 'upstream-adaptation'
    name: "Actual upstream candidate overlay and dependency gate"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: fork
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/checkout@v7
        with:
          repository: FongMi/TV
          ref: c616c0aa3613e87529791587a9f71b78c278c991
          path: inputs/old-tv
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/TV
          ref: d3a0b84b24cf6628d72a4dbc2be453875b005536
          path: inputs/tv
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/media
          ref: 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
          path: inputs/media
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/media
          ref: 2bc207851df311340767e913931ca7b28cab1794
          path: inputs/media-default
          fetch-depth: 1
          persist-credentials: false
      - name: Materialize pinned 5.9.0 and apply explicit fork deltas
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev/fongmi-upstream-adaptation
          test ! -e fork/signing
          python3 fork/scripts/upstream-adaptation/prepare_candidate.py --old-tv inputs/old-tv --tv inputs/tv --media inputs/media --media-default inputs/media-default
  independent-libraries:
    if: github.repository == 'rileyaaa/FingMi-Xray' && github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' && inputs.task == 'upstream-adaptation'
    name: "Rebuild official Java wrappers and recovery library"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: fork
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/TV
          ref: d3a0b84b24cf6628d72a4dbc2be453875b005536
          path: inputs/tv
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Prepare official Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev/fongmi-upstream-adaptation
          test ! -e fork/signing
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Compile independent public libraries and verify wrapper API
        shell: bash
        run: |
          set -euo pipefail
          python3 fork/scripts/upstream-adaptation/rebuild_public_wrappers.py inputs/tv
