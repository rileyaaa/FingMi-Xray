name: "Xray stable candidate audit (no signing or publishing)"

on:
  push:
    branches: [dev/xray-core-stable]
    paths:
      - '.github/workflows/01-当前源码编译与APK验证.yml'
      - 'tests/test-xray-stable-candidate.py'
      - 'tests/test-xray-*.py'
      - 'tests/test-tv-*.py'
      - 'tests/xray-current-chain/**'
      - 'xray/**'
      - 'libxray/**'
      - 'tv-recovery/**'
      - 'app/src/**'
      - 'catvod/src/**'
      - 'recovery/native-tests/**'
      - 'scripts/recovery/prepare-native-converter-harness.py'

permissions:
  contents: read

jobs:
  baseline:
    name: "Existing Xray and TV recovery regression (JVM/stubs)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: "21"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Verify isolated checkout before tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev/xray-core-stable
          test ! -e signing
          test "$(git rev-parse --is-shallow-repository)" = true
          test "$(find .github/workflows -type f | wc -l)" -eq 1
          git rev-parse HEAD
      - name: Existing targeted regression (no Android Gradle or signing)
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test-xray-core-parity.py
          python3 tests/test-xray-normalizer-parity.py
          python3 tests/test-xray-transport-security-parity.py
          python3 tests/test-xray-tls-fragment.py --workdir "$RUNNER_TEMP/xray-fragment"
          python3 tests/test-xray-session-races.py
          python3 tests/test-xray-service-client-lifecycle.py
          python3 tests/test-xray-playback-parity.py
          python3 tests/test-xray-playback-address-parity.py
          python3 tests/test-xray-playback-session-reentry.py
          python3 tests/test-xray-rtsp-socket-guard.py
          python3 tests/test-tv-network-recovery.py
          python3 tests/test-tv-network-recovery-reentry.py
  native:
    name: "Official stable AAR and native compatibility (${{ matrix.abi }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: "21"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Verify isolated checkout before candidate inspection
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev/xray-core-stable
          test ! -e signing
          test "$(git rev-parse --is-shallow-repository)" = true
          test "$(find .github/workflows -type f | wc -l)" -eq 1
          git rev-parse HEAD
      - name: Verify official complete AAR and run synthetic native contract
        shell: bash
        env:
          TEST_ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          python3 tests/test-xray-stable-candidate.py --abi "$TEST_ABI"
