name: Temporary ISO navigation v4 Libass pin computation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/.trigger-iso-nav-v4-libass-pins"

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify marker-only push source
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          parent="$(git rev-parse "$GITHUB_SHA^")"
          changed="$(git diff --name-only "$parent" "$GITHUB_SHA")"
          test "$changed" = ".github/.trigger-iso-nav-v4-libass-pins"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Verify repository build hygiene
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test-build-hygiene.py

      - name: Rebuild v4 player candidate
        shell: bash
        run: |
          set -euo pipefail
          work="build/work/iso-nav-v4-pins"
          mkdir -p "$work/input"
          bash scripts/build/build-player-aar-candidate.sh \
            --workdir "$work/player-source" \
            --output "$work/input/player-candidate.zip"

      - name: Fetch pinned Libass inputs
        shell: bash
        run: |
          set -euo pipefail
          work="build/work/iso-nav-v4-pins"
          curl -fL --retry 3 \
            'https://github.com/FongMi/Release/releases/download/5.6.8/leanback-armeabi_v7a.apk' \
            -o "$work/input/published-v568-v7.apk"
          curl -fL --retry 3 \
            'https://github.com/FongMi/Release/releases/download/5.6.8/leanback-arm64_v8a.apk' \
            -o "$work/input/published-v568-v8.apk"
          curl -fL --retry 3 \
            'https://dl.google.com/dl/android/maven2/androidx/media3/media3-container/1.11.0/media3-container-1.11.0.aar' \
            -o "$work/input/media3-container-1.11.0.aar"
          printf '%s  %s\n%s  %s\n%s  %s\n' \
            '2859ebef12bf0fa0dfec023d410df478ac5e5a82a72ef2be48f6e4fa09a24761' "$work/input/published-v568-v7.apk" \
            '948df594843e304c332476a380163dc1cc74f964be5ea1539ff0465a9dd936eb' "$work/input/published-v568-v8.apk" \
            '930fca2f018f06f1d08c12599f8c97f31eddbd728edee5de06eb53a882f8fc54' "$work/input/media3-container-1.11.0.aar" \
            | sha256sum -c -

      - name: Fetch pinned Java test/compiler dependencies
        shell: bash
        run: |
          set -euo pipefail
          mvn -B dependency:get -Dartifact=org.robolectric:android-all:15-robolectric-12650502
          mvn -B dependency:get -Dartifact=com.google.guava:guava:33.3.1-android
          mvn -B dependency:get \
            -Dartifact=androidx.annotation:annotation-jvm:1.9.1 \
            -DremoteRepositories=google::default::https://dl.google.com/dl/android/maven2

      - name: Compute deterministic v4 Libass pins
        shell: bash
        run: |
          set -euo pipefail
          work="build/work/iso-nav-v4-pins"
          python3 - <<'PY'
          from pathlib import Path

          extractor = Path("scripts/build/build-libass-extractor.py")
          text = extractor.read_text()
          old = "observed_output=sha(out_data);assert observed_output==LIBASS_EXTRACTOR_AAR_SHA256,'Unexpected reconstructed extractor AAR SHA: '+observed_output;out.write_bytes(out_data)"
          new = "observed_output=sha(out_data);print('OBSERVED_LIBASS_EXTRACTOR_SHA256='+observed_output);out.write_bytes(out_data)"
          if text.count(old) != 1:
              raise SystemExit("extractor output-pin assertion anchor changed")
          extractor.write_text(text.replace(old, new, 1))

          candidate = Path("scripts/build/build-libass-candidate.py")
          text = candidate.read_text()
          old = "aar_inputs=read_verified_candidate(a.candidate);extractor=checked(a.extractor,EXTRACTOR);container=checked(a.container,CONTAINER);checked(a.android_jar,ANDROID)"
          new = "aar_inputs=read_verified_candidate(a.candidate);extractor=a.extractor.read_bytes();print('INPUT_EXTRACTOR_SHA256='+sha(extractor));container=checked(a.container,CONTAINER);checked(a.android_jar,ANDROID)"
          if text.count(old) != 1:
              raise SystemExit("candidate extractor-pin assertion anchor changed")
          text = text.replace(old, new, 1)
          old = "a.output.parent.mkdir(parents=True,exist_ok=True);output_data=zipped(aar);observed_output=sha(output_data);assert observed_output==LIBASS_CANDIDATE_AAR_SHA256,'Unexpected reconstructed Libass candidate SHA: '+observed_output;a.output.write_bytes(output_data)"
          new = "a.output.parent.mkdir(parents=True,exist_ok=True);output_data=zipped(aar);observed_output=sha(output_data);print('OBSERVED_LIBASS_CANDIDATE_SHA256='+observed_output);a.output.write_bytes(output_data)"
          if text.count(old) != 1:
              raise SystemExit("candidate output-pin assertion anchor changed")
          candidate.write_text(text.replace(old, new, 1))
          PY

          python3 scripts/build/build-libass-extractor.py \
            --candidate "$work/input/player-candidate.zip" \
            --workdir "$work/extractor" \
            --container "$work/input/media3-container-1.11.0.aar" \
            --maven "$(command -v mvn)"

          android_all="$HOME/.m2/repository/org/robolectric/android-all/15-robolectric-12650502/android-all-15-robolectric-12650502.jar"
          test -s "$android_all"
          python3 scripts/build/build-libass-candidate.py \
            --candidate "$work/input/player-candidate.zip" \
            --extractor "$work/extractor/lib-extractor-libass-release.aar" \
            --container "$work/input/media3-container-1.11.0.aar" \
            --v7-apk "$work/input/published-v568-v7.apk" \
            --v8-apk "$work/input/published-v568-v8.apk" \
            --android-jar "$android_all" \
            --output "$work/lib-exoplayer-libass-reconstructed.aar"

          echo "FINAL_EXTRACTOR_SHA256=$(sha256sum "$work/extractor/lib-extractor-libass-release.aar" | cut -d' ' -f1)"
          echo "FINAL_CANDIDATE_SHA256=$(sha256sum "$work/lib-exoplayer-libass-reconstructed.aar" | cut -d' ' -f1)"
