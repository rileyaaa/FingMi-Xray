name: "5.9.0 public MPEG-H AAR gate (no APK)"
on:
  push:
    branches: [dev/fongmi-upstream-adaptation]
    paths: ['.github/workflows/97-upstream-590-mpegh-aar.yml']
permissions:
  contents: read
jobs:
  mpegh-aar:
    if: >-
      github.repository == 'rileyaaa/FingMi-Xray' && github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' && github.event.head_commit.message == 'ci: verify 5.9 public MPEG-H AAR packaging once'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          path: fork
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/media
          ref: 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
          path: inputs/media
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Fraunhofer-IIS/mpeghdec
          ref: 335a2587fed4d769f8a21ae8816afd0aaa226b4f
          path: inputs/mpegh
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Prepare fixed public module toolchain
        shell: bash
        run: |
          set -euo pipefail
          test ! -e fork/signing
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install 'platforms;android-36' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Build and audit real public MPEG-H AAR without redistribution
        run: python3 fork/scripts/upstream-adaptation/rebuild_public_mpegh_aar.py --media inputs/media --mpegh inputs/mpegh
