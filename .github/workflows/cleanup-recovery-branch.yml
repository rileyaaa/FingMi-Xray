name: One-time branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-recovery-branch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete obsolete recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete recovery/xray-modularization
