name: "5.9.0 MPEG-H alignment retry (no APK)"
on:
  push:
    branches: [dev/fongmi-upstream-adaptation]
    paths: ['.github/workflows/94-upstream-590-host-native-batch.yml']
permissions:
  contents: read
concurrency:
  group: fingmi-upstream-590-host-native
  cancel-in-progress: false
jobs:
  mpegh-native:
    if: >-
      github.repository == 'rileyaaa/FingMi-Xray' && github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' && github.event.head_commit.message == 'ci: verify MPEG-H explicit 16KB alignment once'
    name: Compile pinned public MPEG-H JNI for ARMv7 and ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          path: fork
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/media
          ref: 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
          path: inputs/media
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Fraunhofer-IIS/mpeghdec
          ref: 335a2587fed4d769f8a21ae8816afd0aaa226b4f
          path: inputs/mpegh
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Prepare fixed native toolchain
        shell: bash
        run: |
          set -euo pipefail
          test ! -e fork/signing
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Compile and audit both JNI libraries (no redistribution)
        run: python3 fork/scripts/upstream-adaptation/verify_public_mpegh_native.py --media inputs/media --mpegh inputs/mpegh
