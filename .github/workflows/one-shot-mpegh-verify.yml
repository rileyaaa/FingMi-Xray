name: One-shot MPEG-H player verification

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify source guards
        run: python3 tests/test-build-hygiene.py
      - name: Rebuild pinned player candidate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build/build-player-aar-candidate.sh \
            --workdir build/work/mpegh-audit \
            --output build/player-candidate.zip
          python3 scripts/build/player_candidate.py build/player-candidate.zip
          unzip -p build/player-candidate.zip lib-decoder-mpegh-release.aar > build/mpegh.aar
          unzip -p build/mpegh.aar classes.jar > build/mpegh-classes.jar
          jar tf build/mpegh-classes.jar | grep -Fx 'androidx/media3/decoder/mpegh/MpeghAudioRenderer.class'
          for abi in armeabi-v7a arm64-v8a; do
            echo "MPEG-H $abi"
            unzip -p build/mpegh.aar "jni/$abi/libmpeghJNI.so" | sha256sum
            unzip -p build/mpegh.aar "jni/$abi/libmpeghJNI.so" | wc -c
          done
