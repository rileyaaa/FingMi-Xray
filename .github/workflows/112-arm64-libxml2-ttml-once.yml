name: F2 - pinned ARM64 libxml2 TTML contract only

on:
  push:
    branches: [dev/fongmi-upstream-adaptation]
    paths: [.github/workflows/112-arm64-libxml2-ttml-once.yml]

permissions:
  contents: read

concurrency:
  group: f2-arm64-libxml2-ttml-112
  cancel-in-progress: false

jobs:
  ttml-base:
    if: >-
      github.repository == 'rileyaaa/FingMi-Xray' &&
      github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' &&
      github.event_name == 'push' &&
      github.event.before == '48c2e60a100bf21dda7e5db30f57bdae80fa6df8' &&
      github.run_attempt == '1' &&
      !github.event.deleted &&
      !github.event.forced &&
      github.event.head_commit.message == 'ci: verify pinned arm64 libxml2 ttml contract once'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Read exact event commit and direct parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          fetch-tags: false
          lfs: false
          submodules: false
          path: f2-event
          sparse-checkout: |
            /.github/workflows/112-arm64-libxml2-ttml-once.yml
          sparse-checkout-cone-mode: false
      - name: Build ARM64 libxml2 and audit TTML APIs
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          unset GH_TOKEN GITHUB_TOKEN
          work=$(mktemp -d "$RUNNER_TEMP/f2-112-XXXXXX")
          summary="$GITHUB_STEP_SUMMARY"
          emit() { printf '%s\n' "$@" | tee -a "$summary"; }
          phase=trigger
          finish() {
            rc=$?
            trap - EXIT
            if [ "$rc" != 0 ] && [ -f "$work/build.log" ] && [[ "$phase" == build-* ]]; then
              tail -n 12 "$work/build.log" | cut -c1-240 | tee -a "$summary"
            fi
            rm -rf -- "$work" || rc=1
            if [ "$rc" = 0 ] && [ "$phase" = complete ]; then
              echo 'RESULT=PASS_ARM64_LIBXML2_LINK_HOST_TTML_SMOKE' | tee -a "$summary"
            else
              printf 'FAILED_PHASE=%s\nRESULT=FAIL_OR_INCOMPLETE\n' "$phase" | tee -a "$summary"
              rc=1
            fi
            exit "$rc"
          }
          trap finish EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf 'SCOPE=ARM64_LIBXML2_ONLY_PLUS_SAME_SOURCE_HOST_SMOKE\nSHADERC_LIBPLACEBO_109=NOT_REBUILT\nDAV1D_UAVS3D_111=NOT_REBUILT\nARM64_TTML_RUNTIME=NOT_RUN\nFFMPEG_TTML_DEMUXER=NOT_BUILT\nAV3A=NOT_FETCHED\nUNIFIED_FFMPEG=NOT_BUILT\nMOTION_RECEIPT=NOT_BUILT\nFULL_RENDERER_SDK=NOT_BUILT\nARMV7=NOT_RUN\nMEDIA3_JNI=NOT_RUN\nPRODUCT_INTEGRATION=NOT_RUN\n' | tee -a "$summary"

          export F2_EXPECTED_PARENT=48c2e60a100bf21dda7e5db30f57bdae80fa6df8
          export F2_WORKFLOW_PATH=.github/workflows/112-arm64-libxml2-ttml-once.yml
          export F2_COMMIT_MESSAGE='ci: verify pinned arm64 libxml2 ttml contract once'
          export F2_EVENT_REPO="$GITHUB_WORKSPACE/f2-event"
          GIT_NO_LAZY_FETCH=1 python3 -I - <<'PY' | tee -a "$summary"
          import json, os, re, subprocess
          from pathlib import Path

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def git(repo, *args):
              return subprocess.check_output(
                  ["git", "-C", str(repo), *args], timeout=20)

          def verify(e, env, repo, parent, path, message):
              require(env["GITHUB_EVENT_NAME"] == "push", "event")
              require(env["GITHUB_REPOSITORY"] ==
                      "rileyaaa/FingMi-Xray", "repository")
              require(env["GITHUB_REF"] == e["ref"] ==
                      "refs/heads/dev/fongmi-upstream-adaptation", "ref")
              require(env["GITHUB_RUN_ATTEMPT"] == "1", "attempt")
              require(e["forced"] is False and e["deleted"] is False,
                      "force/delete")

              before, after = e["before"], e["after"]
              require(
                  before == parent
                  and bool(re.fullmatch(r"[0-9a-f]{40}", after))
                  and after == env["GITHUB_SHA"],
                  "event SHAs")

              h = e["head_commit"]
              require(h["id"] == after and h["message"] == message,
                      "head event")
              require(len(e["commits"]) == 1
                      and e["commits"][0]["id"] == after,
                      "event commit count")
              require(git(repo, "rev-parse", "HEAD").decode().strip() == after,
                      "checked-out commit")

              raw = git(repo, "cat-file", "commit", after)
              header, body = raw.split(b"\n\n", 1)
              require(
                  [l[7:].decode() for l in header.splitlines()
                   if l.startswith(b"parent ")] == [before],
                  "actual direct parent")
              require(body.rstrip(b"\n") == message.encode(),
                      "actual commit message")
              require(git(repo, "cat-file", "-t", before) == b"commit\n",
                      "parent available")

              diff = git(
                  repo, "diff-tree", "--no-commit-id",
                  "--name-status", "-z", "-r", "--no-renames",
                  "--ignore-submodules=none", before, after)
              require(diff == b"A\0" + path.encode() + b"\0",
                      "actual diff")

              tree = git(repo, "ls-tree", "-z", after, "--", path)
              require(bool(re.fullmatch(
                  rb"100644 blob [0-9a-f]{40}\t"
                  + re.escape(path.encode()) + rb"\0", tree)),
                  "ordinary workflow blob")

          verify(
              json.load(open(os.environ["GITHUB_EVENT_PATH"])),
              os.environ,
              Path(os.environ["F2_EVENT_REPO"]),
              os.environ["F2_EXPECTED_PARENT"],
              os.environ["F2_WORKFLOW_PATH"],
              os.environ["F2_COMMIT_MESSAGE"])

          print("TRIGGER_GIT_DIFF=PASS")
          PY

          # Reuse only the already verified runner NDK; do not install SDK packages.
          phase=tools
          sdk="${ANDROID_HOME:?ANDROID_HOME missing}"
          ndk="$sdk/ndk/30.0.16248370"
          llvm="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for tool in git python3 curl sha256sum ninja pkg-config sed install find sort timeout cmp grep awk tee cc; do
            command -v "$tool" >/dev/null
          done
          for tool in aarch64-linux-android24-clang aarch64-linux-android24-clang++ llvm-ar llvm-ranlib llvm-readelf llvm-nm llvm-strip; do
            test -x "$llvm/$tool"
          done
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*30\.0\.16248370$' "$ndk/source.properties"
          test -s "$ndk/NOTICE"
          test -s "$ndk/NOTICE.toolchain"
          notice_before=$(sha256sum "$ndk/NOTICE" "$ndk/NOTICE.toolchain")
          host_cc=$(command -v cc)
          test "${host_cc:0:1}" = /
          export GIT_LFS_SKIP_SMUDGE=1
          emit 'NDK=30.0.16248370' 'ANDROID_API=24' \
            "NDK_NOTICE_SHA256=$(sha256sum "$ndk/NOTICE" | cut -d' ' -f1)" \
            "NDK_TOOLCHAIN_NOTICE_SHA256=$(sha256sum "$ndk/NOTICE.toolchain" | cut -d' ' -f1)"

          phase=sources
          producer="$work/producer"
          xml="$producer/buildscripts/deps/libxml2"
          : > "$work/pins.tsv"
          : > "$work/licenses.tsv"
          fetch_exact() {
            local label=$1 url=$2 commit=$3 tree=$4 dest=$5 rc status
            git init -q "$dest"
            git -C "$dest" remote add origin "$url"
            timeout 60s git -C "$dest" -c credential.helper= fetch --quiet \
              --depth=1 --no-tags --no-recurse-submodules origin "$commit"
            git -C "$dest" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dest" rev-parse HEAD)" = "$commit"
            test "$(git -C "$dest" rev-parse HEAD^{tree})" = "$tree"
            status=$(git -C "$dest" status --porcelain --untracked-files=all)
            test -z "$status"
            # Inspect tracked Git blobs, including actual pointer headers, without fetching LFS.
            if git -C "$dest" grep -I -l -E -e '^version https://git-lfs[.]github[.]com/spec/v1$' HEAD -- > "$work/lfs-check"; then
              echo "Unexpected LFS pointer in $label" >&2
              return 1
            else
              rc=$?
              test "$rc" = 1
            fi
            printf '%s\t%s\t%s\n' "$label" "$commit" "$tree" >> "$work/pins.tsv"
          }
          require_blob() {
            local label=$1 repo=$2 rel=$3 expected=$4
            test -s "$repo/$rel"
            test "$(git -C "$repo" rev-parse "HEAD:$rel")" = "$expected"
            test "$(git hash-object "$repo/$rel")" = "$expected"
            printf '%s/%s\t%s\n' "$label" "$rel" "$(sha256sum "$repo/$rel" | cut -d' ' -f1)" >> "$work/licenses.tsv"
          }
          no_gitlinks() {
            local rows
            rows=$(git -C "$1" ls-tree -r HEAD)
            if grep -q '^160000 ' <<< "$rows"; then
              echo "Unexpected nested gitlink" >&2
              return 1
            fi
          }
          fetch_exact producer https://github.com/FongMi/mpv-android.git \
            1bf892e3271e73d8649f2d209027f1fb17515d15 2c1dba848427d098ba9bf8ab7e86d5308a85e1e7 "$producer"
          no_gitlinks "$producer"
          require_blob producer "$producer" LICENSE 81d2ff31ab3e434d6f67fa5ac1e15e345f175db6
          # The real producer's libxml2 target has no dependencies. Never call download-deps.sh.
          while read -r path blob; do
            test "$(git -C "$producer" rev-parse "HEAD:$path")" = "$blob"
            test "$(git hash-object "$producer/$path")" = "$blob"
            bash -n "$producer/$path"
          done <<'RECIPE'
          buildscripts/buildall.sh d86e302235e1f1ad8e8e965905bc93b2776d78a1
          buildscripts/include/depinfo.sh 2b9b3e40ccbcc8934f751d596959414306db67c2
          buildscripts/include/path.sh 9420e0aa4b4d1451aa61f4eb758399a269b4e316
          buildscripts/scripts/libxml2.sh 598ac3031f45b4d8fbd5dd1e18833adcfcdb28cd
          RECIPE
          (
            . "$producer/buildscripts/include/depinfo.sh"
            test "${#dep_libxml2[@]}" = 0
            test "$v_libxml2" = 2.15.4
            test "$v_ndk" = r30
            test "$v_ndk_n" = 30.0.16248370
          )
          mkdir -p "$producer/buildscripts/deps"
          # Producer downloads GNOME GitLab v2.15.4 tar; use the exact GNOME mirror commit
          # resolved from annotated tag object 9fac185ccc0b719eb647db902d5c13c3aaa96263.
          # This establishes source identity, not byte equality with the historical tarball.
          fetch_exact libxml2 https://github.com/GNOME/libxml2.git \
            96498992efa48d52b0e8b83058bd88dbdaf153c1 015caab0d02c2033cbf9e800efc2263e00acd1fd "$xml"
          no_gitlinks "$xml"
          require_blob libxml2 "$xml" Copyright 8c0b7c15dd9b66501511f5971ec9cae971997a0d
          # dict/list contain distinct permissive copyright notices; hash their whole source blobs.
          require_blob libxml2 "$xml" dict.c b872214811244c99e85c25c685f5c04d2422162e
          require_blob libxml2 "$xml" list.c c112ab9c3c616865733c19174974c7a33edc67d6
          while read -r path blob; do
            test "$(git -C "$xml" rev-parse "HEAD:$path")" = "$blob"
            test "$(git hash-object "$xml/$path")" = "$blob"
          done <<'XML_RECIPE'
          VERSION 86fbeafcc20d44b1311ea458bb37341a3da438ae
          meson.build f8337ead5f3bb63a002396f72b3aaa0f794df026
          meson_options.txt 9bc02b3c4f3a90d9ad21d34f9cdbfdfa5e5e3dff
          include/libxml/meson.build c3b9a602692ea563478f8fef5497c0e9edf51607
          include/libxml/xmlversion.h.in 107707bb83e9b58ed50b87f07e9b1386da6b788a
          XML_RECIPE
          test "$(cat "$xml/VERSION")" = 2.15.4
          emit 'SOURCE_PINS_VERIFIED=PASS' 'SOURCE_REPOSITORIES=2' 'GITLINKS=0' 'LFS_POINTERS=0' \
            'PRODUCER_COMMIT=1bf892e3271e73d8649f2d209027f1fb17515d15' \
            'LIBXML2_COMMIT=96498992efa48d52b0e8b83058bd88dbdaf153c1' \
            "SOURCE_SET_SHA256=$(LC_ALL=C sort "$work/pins.tsv" | sha256sum | cut -d' ' -f1)" \
            "SOURCE_LICENSE_RECEIPTS_SHA256=$(LC_ALL=C sort "$work/licenses.tsv" | sha256sum | cut -d' ' -f1)"
          while IFS=$'\t' read -r label digest; do emit "LICENSE_SOURCE_SHA256 $label $digest"; done < "$work/licenses.tsv"

          # The producer's successful run used Meson 1.12.1. Runner inventory does not
          # establish Meson availability. Use only this official, hash-pinned wheel.
          phase=meson
          wheel="$work/meson-1.12.1-py3-none-any.whl"
          url=https://files.pythonhosted.org/packages/57/99/36cd25f9598eef70db97577440a70a360af505f6f01c2338a18d1556079c/meson-1.12.1-py3-none-any.whl
          wheelsha=930bc7542cbd9f57009e182fd014eba48cf1a0180a7b9006d2d32d8f168d8b02
          curl -q -fsS --retry 0 --connect-timeout 10 --max-time 60 --proto '=https' "$url" -o "$wheel"
          printf '%s  %s\n' "$wheelsha" "$wheel" | sha256sum -c -
          python3 -I - "$wheel" <<'PY' | tee -a "$summary"
          import email, hashlib, sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as z:
              names=z.namelist()
              assert len(names)==len(set(names)) and z.testzip() is None
              d='meson-1.12.1.dist-info/'
              m=email.message_from_bytes(z.read(d+'METADATA'))
              assert m['Name'].lower()=='meson' and m['Version']=='1.12.1'
              notices=[n for n in names if n.startswith(d) and n.endswith('/COPYING')]
              assert len(notices)==1
              notice=z.read(notices[0])
              assert b'Apache License' in notice
              print('MESON_LICENSE_SHA256='+hashlib.sha256(notice).hexdigest())
          PY
          python3 -m venv "$work/meson-venv"
          "$work/meson-venv/bin/python" -m pip --isolated install --no-index --no-deps \
            --disable-pip-version-check --no-cache-dir "$wheel" > "$work/meson-install.log" 2>&1
          export PATH="$work/meson-venv/bin:$PATH"
          test "$(meson --version)" = 1.12.1
          printf 'MESON=1.12.1\nMESON_WHEEL_SHA256=%s\n' "$wheelsha" | tee -a "$summary"

          # Actual producer entry, with the same six enabled features and output serialization.
          cd "$producer/buildscripts"
          mkdir -p sdk
          ln -s "$ndk" sdk/android-ndk-r30
          export cores=2
          unset CC CXX CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH LIBRARY_PATH
          unset PKG_CONFIG_PATH PKG_CONFIG_LIBDIR PKG_CONFIG_SYSROOT_DIR PKG_CONFIG_SYSTEM_INCLUDE_PATH PKG_CONFIG_SYSTEM_LIBRARY_PATH
          phase=build-arm64
          : > "$work/build.log"
          timeout --kill-after=10s 5m ./buildall.sh --arch arm64 libxml2 > "$work/build.log" 2>&1
          emit 'LIBXML2_ARM64_PRODUCER_BUILD=PASS'
          prefix="$PWD/prefix/arm64"
          test "$(find "$PWD/deps" -mindepth 1 -maxdepth 1 -printf '%f\n')" = libxml2
          test "$(find "$PWD/prefix" -mindepth 1 -maxdepth 1 -printf '%f\n')" = arm64

          # Real source/feature/API receipts. FFmpeg is not fetched: the required names are
          # derived from fixed 963c8cbb's configure, ttmldec.c, ttml_timing.c and codec ttmldec.c.
          phase=audit-arm64
          cat > "$work/smoke.c" <<'SMOKE_C'
          /* Original synthetic fixture for the TTML libxml2 API contract; not FFmpeg source. */
          #include <libxml/parser.h>
          #include <libxml/tree.h>
          #include <libxml/valid.h>
          #include <libxml/xmlmemory.h>
          #include <libxml/xmlsave.h>
          #include <libxml/xmlstring.h>
          #include <libxml/xmlversion.h>
          /* The producer supplies -I<prefix>/include for this configure header path. */
          #include <libxml2/libxml/xmlversion.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          #ifndef LIBXML_OUTPUT_ENABLED
          #error TTML requires libxml2 output
          #endif
          #ifndef LIBXML_PUSH_ENABLED
          #error TTML requires push parser
          #endif
          #define NEED(x) do { if (!(x)) { fprintf(stderr, "TTML_SMOKE_FAIL line=%d\n", __LINE__); exit(1); } } while (0)
          #define X(s) ((const xmlChar *)(s))
          #define FLAGS (XML_PARSE_NONET | XML_PARSE_NOERROR | XML_PARSE_NOWARNING | XML_PARSE_COMPACT)
          static const char ns[]="http://www.w3.org/ns/ttml";
          static const char style_ns[]="http://www.w3.org/ns/ttml#styling";
          static const char param_ns[]="http://www.w3.org/ns/ttml#parameter";
          static const char fixture[]=
           "<tt xmlns='http://www.w3.org/ns/ttml' xmlns:tts='http://www.w3.org/ns/ttml#styling' "
           "xmlns:ttp='http://www.w3.org/ns/ttml#parameter' ttp:timeBase='media' xml:space='preserve'>"
           "<head><styling><style xml:id='s1' tts:color='red'/></styling></head>"
           "<body style='s1' begin='1s'><div timeContainer='seq' tts:fontStyle='italic'>"
           "<p begin='2s' end='3s'>A &amp; <span tts:fontWeight='bold'>\345\255\227</span></p>"
           "<p begin='4s'>OMIT-SECOND-CUE</p></div></body></tt>";
          struct probe { xmlParserCtxtPtr ctx; int seen,match; };
          static void start(void *opaque,const xmlChar *name,const xmlChar *prefix,const xmlChar *uri,
                            int nns,const xmlChar **namespaces,int na,int nd,const xmlChar **attrs) {
              struct probe *p=opaque;
              (void)prefix;(void)nns;(void)namespaces;(void)na;(void)nd;(void)attrs;
              p->seen++;
              p->match=name && uri && !xmlStrcmp(name,X("tt")) && !xmlStrcmp(uri,X(ns));
              xmlStopParser(p->ctx);
          }
          static int root_probe(const char *s) {
              xmlSAXHandler h={0};struct probe p={0};h.initialized=XML_SAX2_MAGIC;h.startElementNs=start;
              p.ctx=xmlCreatePushParserCtxt(&h,&p,NULL,0,NULL);NEED(p.ctx);
              NEED(xmlCtxtUseOptions(p.ctx,XML_PARSE_NONET|XML_PARSE_NOERROR|XML_PARSE_NOWARNING)==0);
              NEED(xmlParseChunk(p.ctx,s,3,0)==0 && p.seen==0);
              (void)xmlParseChunk(p.ctx,s+3,(int)strlen(s)-3,0);
              NEED(p.seen==1);xmlFreeParserCtxt(p.ctx);return p.match;
          }
          static xmlNodePtr child(xmlNodePtr parent,const char *name) {
              for(xmlNodePtr n=parent->children;n;n=n->next)
                  if(n->type==XML_ELEMENT_NODE && n->ns && !xmlStrcmp(n->ns->href,X(ns)) && !xmlStrcmp(n->name,X(name)))return n;
              return NULL;
          }
          static int prop(xmlNodePtr n,const char *key,const char *uri,const char *value) {
              xmlChar *v=uri?xmlGetNsProp(n,X(key),X(uri)):xmlGetProp(n,X(key));
              int ok=value?(v && !xmlStrcmp(v,X(value))):!v;xmlFree(v);return ok;
          }
          static void untimed(xmlNodePtr n) {
              static const char *keys[]={"begin","end","dur","timeContainer"};
              for(size_t i=0;i<sizeof(keys)/sizeof(keys[0]);++i)(void)xmlUnsetProp(n,X(keys[i]));
          }
          int main(void) {
              xmlCheckVersion(LIBXML_VERSION);
              NEED(root_probe(fixture));NEED(!root_probe("<tt xmlns='urn:not-ttml'/>"));
              xmlDocPtr in=xmlReadMemory(fixture,(int)strlen(fixture),NULL,NULL,FLAGS);NEED(in);
              NEED(xmlReadMemory("<tt>",4,NULL,NULL,FLAGS)==NULL);
              xmlNodePtr rt=xmlDocGetRootElement(in);NEED(rt && rt->ns && !xmlStrcmp(rt->ns->href,X(ns)));
              xmlChar *base=xmlGetNsProp(rt,X("timeBase"),X(param_ns));NEED(base && !xmlStrcasecmp(base,X("MEDIA")));xmlFree(base);
              xmlNodePtr h=child(rt,"head"), b=child(rt,"body");NEED(h && b);
              xmlNodePtr d=child(b,"div");NEED(d);xmlNodePtr p=child(d,"p");NEED(p);
              NEED(xmlGetID(in,X("s1")) && xmlNodeGetSpacePreserve(p)==1);
              xmlDocPtr out=xmlNewDoc(X("1.0"));NEED(out);
              xmlNodePtr root=xmlDocCopyNode(rt,out,2);NEED(root);xmlDocSetRootElement(out,root);
              // Exercise free-node as well as copy/add; the discarded copy must never enter the document.
              xmlNodePtr unused=xmlDocCopyNode(p,out,1);NEED(unused);xmlFreeNode(unused);
              xmlNodePtr hc=xmlDocCopyNode(h,out,1);NEED(hc && xmlAddChild(root,hc));
              xmlNodePtr bc=xmlDocCopyNode(b,out,2);NEED(bc && xmlAddChild(root,bc));untimed(bc);
              xmlNodePtr dc=xmlDocCopyNode(d,out,2);NEED(dc && xmlAddChild(bc,dc));untimed(dc);
              xmlNodePtr pc=xmlDocCopyNode(p,out,1);NEED(pc && xmlAddChild(dc,pc));untimed(pc);
              NEED(xmlSetProp(pc,X("dur"),X("1000ms")));
              NEED(xmlReconciliateNs(out,xmlDocGetRootElement(out))>=0);
              xmlChar *packet=NULL;int size=0;xmlDocDumpMemoryEnc(out,&packet,&size,"UTF-8");
              NEED(packet && size>0 && size<4096 && strstr((const char *)packet,"UTF-8"));
              NEED(!strstr((const char *)packet,"OMIT-SECOND-CUE") && root_probe((const char *)packet));
              xmlDocPtr round=xmlReadMemory((const char *)packet,size,NULL,NULL,FLAGS);NEED(round);
              xmlNodePtr rr=xmlDocGetRootElement(round);NEED(rr && rr->ns && !xmlStrcmp(rr->ns->href,X(ns)));
              xmlNodePtr rb=child(rr,"body");NEED(rb);xmlNodePtr rd=child(rb,"div");NEED(rd);
              xmlNodePtr rp=child(rd,"p");NEED(rp);xmlNodePtr sp=child(rp,"span");NEED(sp);
              NEED(child(rr,"head") && xmlGetID(round,X("s1")) && xmlNodeGetSpacePreserve(rp)==1);
              NEED(prop(rb,"style",NULL,"s1") && prop(rd,"fontStyle",style_ns,"italic") && prop(sp,"fontWeight",style_ns,"bold"));
              NEED(prop(rb,"begin",NULL,NULL) && prop(rd,"timeContainer",NULL,NULL) && prop(rp,"begin",NULL,NULL) && prop(rp,"end",NULL,NULL) && prop(rp,"dur",NULL,"1000ms"));
              xmlChar *content=xmlNodeGetContent(rp);NEED(content && !xmlStrcmp(content,X("A & \345\255\227")));xmlFree(content);
              printf("TTML_SYNTHETIC_SERIALIZE_REPARSE=PASS packet_bytes=%d header_version=%s\n",size,LIBXML_DOTTED_VERSION);
              xmlFreeDoc(round);xmlFree(packet);xmlFreeDoc(out);xmlFreeDoc(in);return 0;
          }
          SMOKE_C
          cat > "$work/audit.py" <<'AUDIT_PY'
          import hashlib, json, os, re, shlex, struct, subprocess, sys
          from pathlib import Path

          def need(ok, why):
              if not ok: raise ValueError(why)

          def sha(data): return hashlib.sha256(data).hexdigest()

          def read_ar(data):
              need(data.startswith(b'!<arch>\n'),'not a normal ar archive')
              pos=8; names=None; out=[]
              while pos<len(data):
                  need(pos+60<=len(data),'short ar header')
                  h=data[pos:pos+60]; pos+=60
                  need(h[58:60]==b'`\n','bad ar header trailer')
                  name=h[:16].decode('ascii').rstrip(' ')
                  size=h[48:58].strip()
                  need(size.isdigit(),'bad ar member size')
                  n=int(size); need(pos+n<=len(data),'truncated ar member')
                  payload=data[pos:pos+n]; pos+=n
                  if n%2:
                      need(data[pos:pos+1]==b'\n','bad ar padding'); pos+=1
                  if name in ('/','/SYM64/'):
                      continue
                  if name=='//':
                      need(names is None,'duplicate ar string table'); names=payload; continue
                  if name.startswith('#1/'):
                      nlen=int(name[3:]); need(0<nlen<=len(payload),'bad BSD ar name')
                      name=payload[:nlen].rstrip(b'\0').decode('utf-8'); payload=payload[nlen:]
                      if name in ('__.SYMDEF','__.SYMDEF SORTED','__.SYMDEF_64','__.SYMDEF_64 SORTED'): continue
                  elif name.startswith('/'):
                      need(names is not None and name[1:].isdigit(),'bad GNU ar name reference')
                      start=int(name[1:]); end=names.find(b'/\n',start)
                      need(0<=start<end,'bad GNU ar name')
                      name=names[start:end].decode('utf-8')
                  else:
                      name=name.removesuffix('/')
                  need(bool(name) and b'\0' not in name.encode() and '\n' not in name,'bad member name')
                  out.append((name,payload))
              need(pos==len(data) and out,'empty or malformed archive')
              return out

          def check_elf(data,typ=1):
              need(len(data)>=64 and data[:7]==b'\x7fELF\x02\x01\x01','not little-endian ELF64')
              v=struct.unpack_from('<16sHHIQQQIHHHHHH',data)
              need(v[1:4]==(typ,183,1),'wrong ELF type/machine/version')
              need(v[8]==64 and v[11]==64 and v[12]>0 and v[6]>=64 and v[6]+v[11]*v[12]<=len(data),'invalid ELF section table')
              if typ==3:
                  phoff,phentsize,phnum=v[5],v[9],v[10]
                  need(phentsize==56 and phnum>0 and phoff+phentsize*phnum<=len(data),'bad program table')
                  loads=[struct.unpack_from('<IIQQQQQQ',data,phoff+i*phentsize) for i in range(phnum)]
                  loads=[x for x in loads if x[0]==1]
                  need(loads and all(x[7]>=16384 and x[2]%16384==x[3]%16384 for x in loads),'PT_LOAD not 16KiB-compatible')

          def run(args,env=None,timeout=30):
              return subprocess.check_output([str(a) for a in args],text=True,env=env,timeout=timeout)


          # Fixed FFmpeg source-derived union: demux, timing, decoder and configure.
          # libavformat/ttmldec.c 77b83724c723d4e53f81652ae860fb1af17c1bbd
          # libavcodec/ttml_timing.c 1d35537d7be69e1bea8307c54f6a672a4256b57a
          # libavcodec/ttmldec.c ce970c36fdc4c227d928aaff3add76dd5255d968
          # configure ec3bc586e623ac2c4a0bcf05ecfbef374b7e45dc
          REQUIRED=set(('xmlAddChild xmlCreatePushParserCtxt xmlCtxtUseOptions xmlDocCopyNode '
              'xmlDocDumpMemoryEnc xmlDocGetRootElement xmlDocSetRootElement xmlFree xmlFreeDoc '
              'xmlFreeNode xmlFreeParserCtxt xmlNewDoc xmlParseChunk xmlReadMemory xmlReconciliateNs '
              'xmlSetProp xmlStopParser xmlStrcmp xmlUnsetProp xmlGetNsProp xmlGetProp xmlGetID '
              'xmlNodeGetSpacePreserve xmlStrcasecmp xmlCheckVersion').split())
          FEATURES=('OUTPUT','PUSH','READER','SAX1','ISO8859X','PATTERN')
          HEADERS=set(('HTMLparser.h HTMLtree.h SAX.h SAX2.h c14n.h catalog.h chvalid.h debugXML.h '
              'dict.h encoding.h entities.h globals.h hash.h list.h nanoftp.h nanohttp.h parser.h '
              'parserInternals.h pattern.h relaxng.h schemasInternals.h schematron.h threads.h tree.h '
              'uri.h valid.h xinclude.h xlink.h xmlIO.h xmlautomata.h xmlerror.h xmlexports.h '
              'xmlmemory.h xmlmodule.h xmlreader.h xmlregexp.h xmlsave.h xmlschemas.h '
              'xmlschemastypes.h xmlstring.h xmlunicode.h xmlwriter.h xpath.h xpathInternals.h '
              'xpointer.h xmlversion.h').split())

          def pc_flags(prefix,sysroot):
              env={k:v for k,v in os.environ.items() if not k.startswith('PKG_CONFIG_')}
              env.update(PKG_CONFIG_LIBDIR=str(prefix/'lib/pkgconfig'),PKG_CONFIG_SYSROOT_DIR=str(sysroot),
                         PKG_CONFIG_ALLOW_SYSTEM_CFLAGS='1',PKG_CONFIG_ALLOW_SYSTEM_LIBS='1')
              def pc(*args): return run(['pkg-config',*args,'libxml-2.0'],env=env).strip()
              need(pc('--modversion')=='2.15.4','wrong pc version')
              need(Path(pc('--variable=pcfiledir')).resolve()==(prefix/'lib/pkgconfig').resolve(),'foreign pc')
              cflags=shlex.split(pc('--cflags')); libs=shlex.split(pc('--static','--libs'))
              need(bool(cflags) and all(x.startswith('-I') and Path(x[2:]).resolve()==(prefix/'include/libxml2').resolve()
                   for x in cflags),'foreign include flag: '+repr(cflags))
              need('-lxml2' in libs and any(x.startswith('-L') for x in libs),'missing target library')
              for x in libs:
                  if x.startswith('-L'): need(Path(x[2:]).resolve()==(prefix/'lib').resolve(),'foreign library path')
                  else: need(x in ('-lxml2','-lm'),'foreign link flag: '+x)
              return cflags,libs

          def contract(build,src,prefix,sysroot,compiler,mode):
              opts={x['name']:x['value'] for x in json.loads(run(['meson','introspect','--buildoptions',build]))}
              expected={'minimum':True,'default_library':'static','wrap_mode':'nodownload','buildtype':'release',
                        'prefix':'/usr/local','b_lto':False}
              expected.update({x.lower():'enabled' for x in FEATURES})
              for k,v in expected.items(): need(opts.get(k)==v,'wrong build option: '+k+'='+repr(opts.get(k)))
              machines=json.loads(run(['meson','introspect','--machines',build]))
              machine=machines['host']
              if mode=='arm64': need(machine['system']=='android' and machine['cpu_family']=='aarch64' and machine['endian']=='little','wrong ARM64 machine')
              else: need(machine['system']=='linux' and machine['cpu_family']==machines['build']['cpu_family'],'not a native Linux host build')
              archive=prefix/'lib/libxml2.a'; pc=prefix/'lib/pkgconfig/libxml-2.0.pc'
              need(archive.is_file() and not archive.is_symlink() and pc.is_file() and not pc.is_symlink(),'missing archive or pc')
              need({x.name for x in (prefix/'lib').glob('*.a')}=={'libxml2.a'} and not list((prefix/'lib').glob('*.so*')),'unexpected library')
              headers=prefix/'include/libxml2/libxml'
              need({p.name for p in headers.iterdir()}==HEADERS,'installed header set differs')
              rows=[]
              for name in sorted(HEADERS):
                  f=headers/name
                  need(f.is_file() and not f.is_symlink(),'nonordinary installed header')
                  original=build/'include/libxml/xmlversion.h' if name=='xmlversion.h' else src/'include/libxml'/name
                  need(f.read_bytes()==original.read_bytes(),'header mismatch: '+name)
                  rows.append(name+'\t'+sha(f.read_bytes()))
              cflags,libs=pc_flags(prefix,sysroot)
              macros=run([compiler,*cflags,'-dM','-E','-include','libxml/xmlversion.h','-x','c',os.devnull])
              need(re.search(r'^#define LIBXML_VERSION 21504\s*$',macros,re.M),'wrong compiled header version')
              for f in FEATURES: need(re.search(r'^#define LIBXML_'+f+r'_ENABLED\s*$',macros,re.M),'feature missing: '+f)
              # Original minimum profile must not silently acquire extra external dependency families.
              for f in ('THREAD','ZLIB','ICONV','ICU','MODULES'):
                  need(not re.search(r'^#define LIBXML_'+f+r'_ENABLED\b',macros,re.M),'unexpected feature: '+f)
              label=mode.upper()
              print(label+'_LIBXML2_BUILD_CONTRACT=MINIMUM_OUTPUT_PUSH_READER_SAX1_ISO8859X_PATTERN_STATIC',flush=True)
              print(label+'_LIBXML2_HEADERS_SHA256='+sha('\n'.join(rows).encode()),flush=True)
              print(label+'_LIBXML2_PC_SHA256='+sha(pc.read_bytes()),flush=True)
              return archive,cflags,libs

          def symbols(nm,archive):
              rows=run([nm,'--defined-only','--extern-only','--format=posix',archive]).splitlines()
              actual={}
              for row in rows:
                  x=row.split()
                  if len(x)>=3: actual.setdefault(x[0],set()).add(x[1])
              for name in sorted(REQUIRED):
                  # xmlFree is a public allocator function-pointer data symbol, not necessarily T.
                  allowed={'D','B','R','V','T','W'} if name=='xmlFree' else {'T','W'}
                  need(actual.get(name,set()) & allowed,'missing TTML API: '+name)

          def archive_members(archive,llvm,work):
              raw=archive.read_bytes(); entries=read_ar(raw)
              need([name for name,_ in entries]==run([llvm/'llvm-ar','t',archive]).splitlines(),'ar listing mismatch')
              records=[]
              for i,(name,b) in enumerate(entries):
                  check_elf(b) # native ELF REL only; producer has no LTO for this target.
                  f=work/'member.elf'; f.write_bytes(b)
                  h=run([llvm/'llvm-readelf','-h',f])
                  need(re.search(r'^\s*Machine:\s*AArch64\s*$',h,re.M) and re.search(r'^\s*Type:\s*REL\b',h,re.M),'readelf disagrees')
                  records.append(f'{i}\t{name}\t{sha(b)}')
              need(sha(archive.read_bytes())==sha(raw),'archive modified')
              return len(entries),sha('\n'.join(records).encode())

          def main(mode,build,src,prefix,sysroot,llvm,work,host_cc):
              compiler=llvm/'aarch64-linux-android24-clang' if mode=='arm64' else host_cc
              archive,cflags,libs=contract(build,src,prefix,sysroot,compiler,mode)
              digest=sha(archive.read_bytes())
              symbols(llvm/'llvm-nm',archive)
              # Compile/link precisely the same C fixture in both branches; host is a separate native library.
              if mode=='arm64':
                  count,manifest=archive_members(archive,llvm,work)
                  output=work/'ttml-arm64-audit.so'
                  run([compiler,'-std=c11','-Wall','-Wextra','-Werror','-shared','-fPIC',
                       '-Wl,--no-undefined','-Wl,-z,max-page-size=16384','-I'+str(prefix/'include'),*cflags,work/'smoke.c',
                       '-Wl,--whole-archive',archive,'-Wl,--no-whole-archive',*libs,'-o',output],timeout=90)
                  check_elf(output.read_bytes(),3)
                  dynamic=run([llvm/'llvm-readelf','-d',output]); needed_rows=[l for l in dynamic.splitlines() if '(NEEDED)' in l]
                  needed=set(re.findall(r'Shared library: \[([^\]]+)\]',dynamic))
                  need(len(needed_rows)==len(needed) and needed<={'libc.so','libm.so','libdl.so'},'unexpected NEEDED')
                  need(not re.search(r'\((?:RPATH|RUNPATH)\)',dynamic),'unexpected runtime search path')
                  for k,v in {'ARCHIVE_BYTES':archive.stat().st_size,'ARCHIVE_SHA256':digest,
                              'ELF64_AARCH64_REL_MEMBERS':count,'MEMBER_MANIFEST_SHA256':manifest,
                              'TTML_REQUIRED_APIS':len(REQUIRED),'TTML_FIXTURE_LINK':'PASS','WHOLE_ARCHIVE_LINK_ELF_16K':'PASS',
                              'AUDIT_LINK_SHA256':sha(output.read_bytes())}.items(): print('ARM64_LIBXML2_'+k+'='+str(v),flush=True)
              else:
                  output=work/'ttml-host-smoke'
                  run([compiler,'-std=c11','-Wall','-Wextra','-Werror','-I'+str(prefix/'include'),*cflags,work/'smoke.c',
                       '-Wl,--no-undefined','-Wl,--whole-archive',archive,'-Wl,--no-whole-archive',*libs,'-o',output],timeout=90)
                  dynamic=run([llvm/'llvm-readelf','-d',output]); needed_rows=[l for l in dynamic.splitlines() if '(NEEDED)' in l]
                  needed=set(re.findall(r'Shared library: \[([^\]]+)\]',dynamic))
                  need(len(needed_rows)==len(needed) and needed<={'libc.so.6','libm.so.6','libdl.so.2'},'unexpected host NEEDED: '+repr(needed))
                  need(not re.search(r'\((?:RPATH|RUNPATH)\)',dynamic),'unexpected host runtime search path')
                  result=run([output],timeout=15).strip()
                  need(re.fullmatch(r'TTML_SYNTHETIC_SERIALIZE_REPARSE=PASS packet_bytes=[1-9][0-9]* header_version=2\.15\.4',result),'unexpected smoke output')
                  print('HOST_'+result,flush=True)
                  print('HOST_LIBXML2_ARCHIVE_SHA256='+digest,flush=True)
                  print('HOST_LIBXML2_TTML_SMOKE=PASS',flush=True)
              need(sha(archive.read_bytes())==digest,'archive modified by audit')

          if __name__=='__main__':
              main(sys.argv[1],*map(Path,sys.argv[2:]))
          AUDIT_PY
          timeout --kill-after=10s 3m python3 -I "$work/audit.py" arm64 "$xml/_build_arm64" "$xml" "$prefix" "$prefix" "$llvm" "$work" "$host_cc" | tee -a "$summary"

          # Native host reference only: same fixed libxml2 and exact feature profile, never
          # execute Android ARM64 on x86 nor substitute the host archive into ARM64.
          phase=build-host-reference
          : > "$work/build.log"
          hostroot="$work/hostroot"
          hostbuild="$work/host-build"
          (
            unset CC CXX CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH LIBRARY_PATH
            unset PKG_CONFIG_PATH PKG_CONFIG_LIBDIR PKG_CONFIG_SYSROOT_DIR PKG_CONFIG_SYSTEM_INCLUDE_PATH PKG_CONFIG_SYSTEM_LIBRARY_PATH
            export CC="$host_cc"
            timeout --kill-after=10s 2m meson setup "$hostbuild" "$xml" --buildtype=release --default-library=static \
              --wrap-mode=nodownload --prefix=/usr/local --libdir=lib -Dminimum=true -D{push,reader,sax1,iso8859x,pattern,output}=enabled
            timeout --kill-after=10s 3m meson compile -C "$hostbuild" -j 2 xml2 xmllint
            DESTDIR="$hostroot" timeout --kill-after=10s 1m meson install -C "$hostbuild" --no-rebuild
          ) > "$work/build.log" 2>&1
          emit 'HOST_REFERENCE_BUILD=PASS'
          phase=host-smoke
          timeout --kill-after=10s 3m python3 -I "$work/audit.py" host "$hostbuild" "$xml" "$hostroot/usr/local" "$hostroot" "$llvm" "$work" "$host_cc" | tee -a "$summary"

          phase=final-integrity
          # Preserve exact license and distinct dict/list notices in temporary audit prefix.
          install -Dm644 "$xml/Copyright" "$prefix/share/licenses/libxml2/Copyright"
          cmp -s "$xml/Copyright" "$prefix/share/licenses/libxml2/Copyright"
          python3 -I - "$xml" "$prefix/share/licenses/libxml2" <<'NOTICE_PY' | tee -a "$summary"
          from pathlib import Path
          import hashlib,sys
          src,dest=map(Path,sys.argv[1:])
          for name in ('dict.c','list.c'):
              b=(src/name).read_bytes(); assert b.startswith(b'/*') and b'*/' in b
              note=b.split(b'*/',1)[0]+b'*/\n'
              assert b'Copyright' in note and b'Permission' in note
              (dest/(name+'.NOTICE')).write_bytes(note)
              print(name.upper()+'_NOTICE_SHA256='+hashlib.sha256(note).hexdigest())
          NOTICE_PY
          test "$(sha256sum "$ndk/NOTICE" "$ndk/NOTICE.toolchain")" = "$notice_before"
          git -C "$producer" diff --quiet HEAD --
          git -C "$xml" diff --quiet HEAD --
          test "$(git -C "$producer" rev-parse HEAD)" = 1bf892e3271e73d8649f2d209027f1fb17515d15
          test "$(git -C "$xml" rev-parse HEAD)" = 96498992efa48d52b0e8b83058bd88dbdaf153c1
          test "$(find "$producer/buildscripts/deps" -mindepth 1 -maxdepth 1 -printf '%f\n')" = libxml2
          test "$(find "$producer/buildscripts/prefix" -mindepth 1 -maxdepth 1 -printf '%f\n')" = arm64
          emit 'SOURCE_TRACKED_UNCHANGED=PASS' 'INSTALLED_LICENSES=PASS' 'NDK_NOTICES_UNCHANGED=PASS'
          phase=complete
