name: Temporary Libass 5.6.8 validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      LIBASS_V7_APK_SHA256: "2859ebef12bf0fa0dfec023d410df478ac5e5a82a72ef2be48f6e4fa09a24761"
      LIBASS_V8_APK_SHA256: "948df594843e304c332476a380163dc1cc74f964be5ea1539ff0465a9dd936eb"
      MEDIA3_CONTAINER_SHA256: "930fca2f018f06f1d08c12599f8c97f31eddbd728edee5de06eb53a882f8fc54"
      OLD_V7_SHA256: "cacc7a90ce082adf955fc80a444b54f8cc86d5b5c3ac7acb13d1392b59928bda"
      OLD_V8_SHA256: "b5ac05193c1e19809fc7ffb3048f7d75aaa2124eace9953d669f4a81a477c21d"

    steps:
      - uses: actions/checkout@v7

      - name: Verify marker-only source
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          parent="$(git rev-parse "$GITHUB_SHA^")"
          changed="$(git diff --name-only "$parent" "$GITHUB_SHA")"
          test "$changed" = ".github/.trigger-libass-568-validation"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Run source guards
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test-build-hygiene.py
          python3 tests/test-xray-core-parity.py
          python3 tests/test-xray-playback-parity.py
          python3 tests/test-tv-network-recovery.py

      - name: Prepare candidate inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="build/work/libass-568"
          mkdir -p "$work/input" "$work/qemu"

          bash scripts/build/build-player-aar-candidate.sh             --workdir "$work/player-source"             --output "$work/input/player-candidate.zip"

          curl -fL --retry 3             'https://github.com/FongMi/Release/releases/download/5.6.8/leanback-armeabi_v7a.apk'             -o "$work/input/published-v568-v7.apk"
          curl -fL --retry 3             'https://github.com/FongMi/Release/releases/download/5.6.8/leanback-arm64_v8a.apk'             -o "$work/input/published-v568-v8.apk"
          curl -fL --retry 3             'https://dl.google.com/dl/android/maven2/androidx/media3/media3-container/1.11.0/media3-container-1.11.0.aar'             -o "$work/input/media3-container-1.11.0.aar"

          gh release download v5.6.0-xray.5             --repo rileyaaa/FingMi-Xray             --pattern 'FongMi-Xray-TV-v5.6.0-xray.5-armeabi-v7a.apk'             --pattern 'FongMi-Xray-TV-v5.6.0-xray.5-arm64-v8a.apk'             --dir "$work/input"
          mv "$work/input/FongMi-Xray-TV-v5.6.0-xray.5-armeabi-v7a.apk" "$work/input/published-v560-v7.apk"
          mv "$work/input/FongMi-Xray-TV-v5.6.0-xray.5-arm64-v8a.apk" "$work/input/published-v560-v8.apk"

          printf '%s  %s\n%s  %s\n%s  %s\n%s  %s\n%s  %s\n'             "$LIBASS_V7_APK_SHA256" "$work/input/published-v568-v7.apk"             "$LIBASS_V8_APK_SHA256" "$work/input/published-v568-v8.apk"             "$MEDIA3_CONTAINER_SHA256" "$work/input/media3-container-1.11.0.aar"             "$OLD_V7_SHA256" "$work/input/published-v560-v7.apk"             "$OLD_V8_SHA256" "$work/input/published-v560-v8.apk"             | sha256sum -c -

          unzip -p "$work/input/published-v560-v7.apk" lib/armeabi-v7a/libgojni.so > "$work/qemu/golden-v7-libgojni.so"
          unzip -p "$work/input/published-v560-v8.apk" lib/arm64-v8a/libgojni.so > "$work/qemu/golden-v8-libgojni.so"

      - name: Build 5.6.8 Libass compatibility candidate
        shell: bash
        run: |
          set -euo pipefail
          work="build/work/libass-568"
          mvn -B dependency:get -Dartifact=org.robolectric:android-all:15-robolectric-12650502
          mvn -B dependency:get -Dartifact=com.google.guava:guava:33.3.1-android
          mvn -B dependency:get -Dartifact=androidx.annotation:annotation-jvm:1.9.1             -DremoteRepositories=google::default::https://dl.google.com/dl/android/maven2
          mvn -B dependency:get -Dartifact=com.google.android:android:4.1.1.4

          python3 scripts/build/build-libass-extractor.py             --candidate "$work/input/player-candidate.zip"             --workdir "$work/extractor"             --container "$work/input/media3-container-1.11.0.aar"             --maven "$(command -v mvn)"

          android_all="$HOME/.m2/repository/org/robolectric/android-all/15-robolectric-12650502/android-all-15-robolectric-12650502.jar"
          test -s "$android_all"

          python3 scripts/build/build-libass-candidate.py             --candidate "$work/input/player-candidate.zip"             --extractor "$work/extractor/lib-extractor-libass-release.aar"             --container "$work/input/media3-container-1.11.0.aar"             --v7-apk "$work/input/published-v568-v7.apk"             --v8-apk "$work/input/published-v568-v8.apk"             --android-jar "$android_all"             --output "$work/lib-exoplayer-libass-reconstructed.aar"

          sha256sum "$work/lib-exoplayer-libass-reconstructed.aar" | tee "$work/candidate-sha256.txt"
          python3 scripts/build/check-libass-contract.py --aar "$work/lib-exoplayer-libass-reconstructed.aar"

          unzip -p "$work/lib-exoplayer-libass-reconstructed.aar"             jni/armeabi-v7a/libmedia3ass.so > "$work/qemu/libmedia3ass-v7.so"
          unzip -p "$work/lib-exoplayer-libass-reconstructed.aar"             jni/arm64-v8a/libmedia3ass.so > "$work/qemu/libmedia3ass-v8.so"

      - name: Run Java ownership, Media3 and GL contracts
        shell: bash
        run: |
          set -euo pipefail
          work="build/work/libass-568"
          python3 tests/test-libass-native-ownership.py
          python3 tests/test-libass-media.py             --extractor "$work/extractor/lib-extractor-libass-release.aar"             --container "$work/input/media3-container-1.11.0.aar"             --candidate "$work/input/player-candidate.zip"             --workdir "$work/media-tests"             --maven "$(command -v mvn)"
          android_legacy="$HOME/.m2/repository/com/google/android/android/4.1.1.4/android-4.1.1.4.jar"
          test -s "$android_legacy"
          python3 tests/test-libass-gl.py --android-jar "$android_legacy"

      - name: Prepare QEMU Android ABI harnesses
        shell: bash
        run: |
          set -euo pipefail
          work="build/work/libass-568/qemu"
          python3 scripts/recovery/prepare-native-converter-harness.py             --workdir "$work/v7"             --jni "$work/golden-v7-libgojni.so"
          python3 scripts/recovery/prepare-native-converter-harness.py             --abi arm64-v8a             --workdir "$work/v8"             --jni "$work/golden-v8-libgojni.so"

      - name: Run 5.6.8 Libass JNI lifecycle and render parity on both ABIs
        shell: bash
        run: |
          set -euo pipefail
          root="build/work/libass-568"
          font="$(find /usr/share/fonts -type f -name 'DejaVuSans.ttf' -print -quit)"
          test -n "$font"
          echo "ae7b7855e115a5966d8b1b3f80f254ccc117ec86f9965e202ee2940453837280  $font" | sha256sum -c -

          python3 tests/test-published-libass-jni.py             --workdir "$root/qemu/v7"             --jni "$root/qemu/libmedia3ass-v7.so"             --abi armeabi-v7a
          python3 tests/test-published-libass-render.py             --workdir "$root/qemu/v7"             --jni "$root/qemu/libmedia3ass-v7.so"             --abi armeabi-v7a             --font "$font"

          python3 tests/test-published-libass-jni.py             --workdir "$root/qemu/v8"             --jni "$root/qemu/libmedia3ass-v8.so"             --abi arm64-v8a
          python3 tests/test-published-libass-render.py             --workdir "$root/qemu/v8"             --jni "$root/qemu/libmedia3ass-v8.so"             --abi arm64-v8a             --font "$font"

      - name: Upload short-lived validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: libass-5.6.8-validation
          path: |
            build/work/libass-568/candidate-sha256.txt
            build/work/libass-568/lib-exoplayer-libass-reconstructed.json
          if-no-files-found: warn
          retention-days: 2
          compression-level: 6
