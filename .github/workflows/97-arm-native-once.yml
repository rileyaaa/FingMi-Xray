name: ARM reduced native build feasibility
on:
  push:
    branches: [dev/fongmi-upstream-adaptation]
    paths: [.github/workflows/97-arm-native-once.yml]
permissions:
  contents: read
jobs:
  probe:
    if: >-
      github.repository == 'rileyaaa/FingMi-Xray' && github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' && github.event.head_commit.message == 'ci: cross-build reduced native ARM profiles'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v7
        with:
          path: fork
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/media
          ref: 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
          path: inputs/media
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/mpv-android
          ref: 1bf892e3271e73d8649f2d209027f1fb17515d15
          path: inputs/producer
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/FFmpeg
          ref: 963c8cbbebb0250f747f0019516bda55bc638da9
          path: inputs/ffmpeg
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.gitignore
            /COPYING.*
            /LICENSE.md
            /RELEASE
            /Makefile
            /configure
            /compat/
            /ffbuild/
            /fftools/
            /doc/
            /tools/
            /tests/
            /libavcodec/
            /libavformat/
            /libavutil/
            /libswscale/
            /libswresample/
            /libavdevice/
            /libavfilter/
            !/dependency/
            !**/*avs3*
            !**/*arcdav3a*
            !**/*av3a*
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/mpv
          ref: f964d1495355d5c6626df3de1d3eeb90ddee2aba
          path: inputs/mpv
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/libplacebo
          ref: dc98e2fceb82233b3bb75e9c6249e581c57f3f2d
          path: inputs/placebo
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: fastfloat/fast_float
          ref: 97b54ca9e75f5303507699d27c6b4f4efe4641a1
          path: inputs/placebo/3rdparty/fast_float
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: 74d8a6cb930c68ef617b202c3ff3c59d919e086b
          path: inputs/placebo/3rdparty/Vulkan-Headers
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: pallets/jinja
          ref: 15206881c006c79667fe5154fe80c01c65410679
          path: inputs/placebo/3rdparty/jinja
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: pallets/markupsafe
          ref: 297fc8e356e6836a62087949245d09a28e9f1b13
          path: inputs/placebo/3rdparty/markupsafe
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: freetype/freetype
          ref: 37515cf56ba3349656049edbed89ffc6f6466f2d
          path: inputs/freetype
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: fribidi/fribidi
          ref: b93119f5fdc7ea47672cc304c1455ffa6dfe7536
          path: inputs/fribidi
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: harfbuzz/harfbuzz
          ref: 35f656a1a2bab548ea7f54a6dd3fba2b09680d14
          path: inputs/harfbuzz
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: libass/libass
          ref: a6613d2554daff9e1b5ddf2dbfb3fc31b61b9448
          path: inputs/ass
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Stage fixed sources and install official compile SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev/fongmi-upstream-adaptation
          sdk="$(realpath -e "${ANDROID_HOME:-/usr/local/lib/android/sdk}")"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          printf 'ANDROID_SDK=%s\n' "$sdk"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
          yes | "$sdkmanager" --sdk_root="$sdk" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --sdk_root="$sdk" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'
          python3 fork/scripts/upstream-adaptation/mpv-stream/android/stage_android_probe.py inputs/media inputs/producer
      - name: Build and verify independent ARM ABI (no runtime)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build cmake autoconf automake libtool pkg-config
          meson --version
          cmake --version
          python3 fork/scripts/upstream-adaptation/mpv-stream/android/native/headless_native_diagnostic.py inputs "$ANDROID_HOME/ndk/30.0.16248370" "$RUNNER_TEMP/headless-native" inputs/media "${{ matrix.abi }}"
