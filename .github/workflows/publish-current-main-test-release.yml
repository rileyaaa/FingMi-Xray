name: Upload locally verified v5.6.3-xray.1 release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/.trigger-publish-current-main-test]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_SOURCE_SHA: "357402dc77c008ec2d0def9345c97d2e5608e1c6"
      PAYLOAD_SHA: "4afc7e4f4c72a48de82d142dc39ed7b20b338ac0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify temporary marker-only source
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/.trigger-publish-current-main-test"
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PAYLOAD_SHA }}
          path: upload-payload
      - name: Restore locally verified signed APKs and tracked-tree backup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          payload=Path('upload-payload')
          manifest=json.loads((payload/'manifest.json').read_text())
          assert manifest['source']==os.environ['BUILD_SOURCE_SHA']
          assert manifest['release_tag']=='v5.6.3-xray.1'
          out=Path('release-upload'); out.mkdir()
          for row in manifest['files']:
              assert Path(row['name']).name==row['name']
              digest=hashlib.sha256(); size=0
              with (out/row['name']).open('wb') as target:
                  for name in row['parts']:
                      assert Path(name).name==name
                      with (payload/name).open('rb') as source:
                          while block:=source.read(1024*1024):
                              target.write(block); digest.update(block); size+=len(block)
              assert size==row['size'] and digest.hexdigest()==row['sha256']
              print('PASS restored verified asset',row['name'],size,digest.hexdigest())
          PY
      - name: Upload and publish formal APKs plus latest source backup
        shell: bash
        run: |
          set -euo pipefail
          manifest=upload-payload/manifest.json
          tag="$(jq -r .release_tag "$manifest")"
          backup="$(jq -r .backup_tag "$manifest")"
          zip="$(jq -r '.files[] | select(.name | endswith(".zip")) | .name' "$manifest")"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --target "$BUILD_SOURCE_SHA" --notes-file upload-payload/release-notes.md
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber release-upload/*.apk
          if gh release view "$backup" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$backup" --repo "$GITHUB_REPOSITORY" --clobber "release-upload/$zip"
          else
            gh release create "$backup" --repo "$GITHUB_REPOSITORY" --target "$BUILD_SOURCE_SHA" --title "$backup" --prerelease --notes-file upload-payload/backup-notes.md "release-upload/$zip"
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
      - name: Verify remote tags and asset digests before pruning older releases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          manifest=json.loads(Path('upload-payload/manifest.json').read_text())
          repo='rileyaaa/FingMi-Xray'
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}']))
          def check(tag,files,prerelease):
              release=api('releases/tags/'+tag)
              assert not release['draft'] and release['prerelease']==prerelease
              assert api('git/ref/tags/'+tag)['object']['sha']==manifest['source']
              assert len(release['assets'])==len(files)
              assets={x['name']:x for x in release['assets']}
              for row in files:
                  asset=assets[row['name']]
                  assert asset['state']=='uploaded' and asset['size']==row['size']
                  assert asset['digest']=='sha256:'+row['sha256']
              print('PASS remote release',tag)
          check(manifest['release_tag'],[x for x in manifest['files'] if x['name'].endswith('.apk')],False)
          check(manifest['backup_tag'],[x for x in manifest['files'] if x['name'].endswith('.zip')],True)
          assert api('releases/latest')['tag_name']==manifest['release_tag']
          PY
          gh release delete v5.6.3-xray.test.7 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          gh release delete source-backup-2026-10-03-main-41896214 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/temp-release-upload-20261005-xray1"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | {tag_name,prerelease,draft,assets:[.assets[]|{name,size,digest}]}'
