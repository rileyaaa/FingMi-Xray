name: F2 - pinned ARM64 dav1d and uavs3d only

on:
  push:
    branches: [dev/fongmi-upstream-adaptation]
    paths: [.github/workflows/110-arm64-dav1d-uavs3d-once.yml]

permissions:
  contents: read

concurrency:
  group: f2-arm64-dav1d-uavs3d-110
  cancel-in-progress: false

jobs:
  decoder-base:
    if: >-
      github.repository == 'rileyaaa/FingMi-Xray' &&
      github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' &&
      github.event_name == 'push' &&
      github.event.before == '60d48e4734535da021b209e003c6180beec2026d' &&
      github.run_attempt == '1' &&
      !github.event.deleted &&
      !github.event.forced &&
      github.event.head_commit.message == 'ci: verify pinned arm64 dav1d and uavs3d once'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Read exact event commit and direct parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          fetch-tags: false
          lfs: false
          submodules: false
          path: f2-event
          sparse-checkout: |
            /.github/workflows/110-arm64-dav1d-uavs3d-once.yml
          sparse-checkout-cone-mode: false
      - name: Build and audit ARM64 dav1d and uavs3d only
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          unset GH_TOKEN GITHUB_TOKEN
          work=$(mktemp -d "$RUNNER_TEMP/f2-110-XXXXXX")
          summary="$GITHUB_STEP_SUMMARY"
          emit() { printf '%s\n' "$@" | tee -a "$summary"; }
          phase=trigger
          finish() {
            rc=$?
            trap - EXIT
            if [ "$rc" != 0 ] && [ -f "$work/build.log" ] && [[ "$phase" == build-* ]]; then
              tail -n 12 "$work/build.log" | cut -c1-240 | tee -a "$summary"
            fi
            rm -rf -- "$work" || rc=1
            if [ "$rc" = 0 ] && [ "$phase" = complete ]; then
              echo 'RESULT=PASS_ARM64_DAV1D_UAVS3D' | tee -a "$summary"
            else
              printf 'FAILED_PHASE=%s\nRESULT=FAIL_OR_INCOMPLETE\n' "$phase" | tee -a "$summary"
              rc=1
            fi
            exit "$rc"
          }
          trap finish EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf 'SCOPE=ARM64_DAV1D_UAVS3D_ONLY\nSHADERC_LIBPLACEBO_109=NOT_REBUILT\nAV3A=NOT_FETCHED\nUNIFIED_FFMPEG=NOT_BUILT\nMOTION_RECEIPT=NOT_BUILT\nFULL_RENDERER_SDK=NOT_BUILT\nARMV7=NOT_RUN\nMEDIA3_JNI=NOT_RUN\nPRODUCT_INTEGRATION=NOT_RUN\n' | tee -a "$summary"

          export F2_EXPECTED_PARENT=60d48e4734535da021b209e003c6180beec2026d
          export F2_WORKFLOW_PATH=.github/workflows/110-arm64-dav1d-uavs3d-once.yml
          export F2_COMMIT_MESSAGE='ci: verify pinned arm64 dav1d and uavs3d once'
          export F2_EVENT_REPO="$GITHUB_WORKSPACE/f2-event"
          GIT_NO_LAZY_FETCH=1 python3 -I - <<'PY' | tee -a "$summary"
          import json, os, re, subprocess
          from pathlib import Path

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def git(repo, *args):
              return subprocess.check_output(
                  ["git", "-C", str(repo), *args], timeout=20)

          def verify(e, env, repo, parent, path, message):
              require(env["GITHUB_EVENT_NAME"] == "push", "event")
              require(env["GITHUB_REPOSITORY"] ==
                      "rileyaaa/FingMi-Xray", "repository")
              require(env["GITHUB_REF"] == e["ref"] ==
                      "refs/heads/dev/fongmi-upstream-adaptation", "ref")
              require(env["GITHUB_RUN_ATTEMPT"] == "1", "attempt")
              require(e["forced"] is False and e["deleted"] is False,
                      "force/delete")

              before, after = e["before"], e["after"]
              require(
                  before == parent
                  and bool(re.fullmatch(r"[0-9a-f]{40}", after))
                  and after == env["GITHUB_SHA"],
                  "event SHAs")

              h = e["head_commit"]
              require(h["id"] == after and h["message"] == message,
                      "head event")
              require(len(e["commits"]) == 1
                      and e["commits"][0]["id"] == after,
                      "event commit count")
              require(git(repo, "rev-parse", "HEAD").decode().strip() == after,
                      "checked-out commit")

              raw = git(repo, "cat-file", "commit", after)
              header, body = raw.split(b"\n\n", 1)
              require(
                  [l[7:].decode() for l in header.splitlines()
                   if l.startswith(b"parent ")] == [before],
                  "actual direct parent")
              require(body.rstrip(b"\n") == message.encode(),
                      "actual commit message")
              require(git(repo, "cat-file", "-t", before) == b"commit\n",
                      "parent available")

              diff = git(
                  repo, "diff-tree", "--no-commit-id",
                  "--name-status", "-z", "-r", "--no-renames",
                  "--ignore-submodules=none", before, after)
              require(diff == b"A\0" + path.encode() + b"\0",
                      "actual diff")

              tree = git(repo, "ls-tree", "-z", after, "--", path)
              require(bool(re.fullmatch(
                  rb"100644 blob [0-9a-f]{40}\t"
                  + re.escape(path.encode()) + rb"\0", tree)),
                  "ordinary workflow blob")

          verify(
              json.load(open(os.environ["GITHUB_EVENT_PATH"])),
              os.environ,
              Path(os.environ["F2_EVENT_REPO"]),
              os.environ["F2_EXPECTED_PARENT"],
              os.environ["F2_WORKFLOW_PATH"],
              os.environ["F2_COMMIT_MESSAGE"])

          print("TRIGGER_GIT_DIFF=PASS")
          PY

          # Preinstalled pinned NDK and CMake 3.x; no SDK installation or license acceptance.
          phase=tools
          sdk="${ANDROID_HOME:?ANDROID_HOME missing}"
          ndk="$sdk/ndk/30.0.16248370"
          llvm="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cmake_bin="$sdk/cmake/3.31.5/bin"
          for tool in git python3 curl sha256sum ninja pkg-config make sed install find sort xargs timeout cmp grep awk tee; do
            command -v "$tool" >/dev/null
          done
          for tool in aarch64-linux-android24-clang aarch64-linux-android24-clang++ llvm-ar llvm-ranlib llvm-readelf llvm-nm llvm-strip; do
            test -x "$llvm/$tool"
          done
          test -s "$ndk/build/cmake/android.toolchain.cmake"
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*30\.0\.16248370$' "$ndk/source.properties"
          test -s "$ndk/NOTICE"
          test -s "$ndk/NOTICE.toolchain"
          notice_before=$(sha256sum "$ndk/NOTICE" "$ndk/NOTICE.toolchain")
          test -x "$cmake_bin/cmake"
          test "$("$cmake_bin/cmake" --version | sed -n '1p')" = 'cmake version 3.31.5'
          # Original producer used CMake 3.28.3. Pin the available 3.x Android SDK tool;
          # uavs3d declares cmake_minimum_required(VERSION 3.1), incompatible with default CMake 4.x.
          export PATH="$cmake_bin:$PATH"
          unset CMAKE_GENERATOR CMAKE_TOOLCHAIN_FILE CMAKE_PREFIX_PATH CMAKE_ARGS
          export GIT_LFS_SKIP_SMUDGE=1
          emit 'NDK=30.0.16248370' 'ANDROID_API=24' 'CMAKE=3.31.5' \
            "NDK_NOTICE_SHA256=$(sha256sum "$ndk/NOTICE" | cut -d' ' -f1)" \
            "NDK_TOOLCHAIN_NOTICE_SHA256=$(sha256sum "$ndk/NOTICE.toolchain" | cut -d' ' -f1)" \
            "HOST_PYTHON=$(python3 --version)" "NINJA=$(ninja --version)" "PKG_CONFIG=$(pkg-config --version)"

          phase=sources
          producer="$work/producer"
          dav="$producer/buildscripts/deps/dav1d"
          uav="$producer/buildscripts/deps/uavs3d"
          : > "$work/pins.tsv"
          : > "$work/licenses.tsv"
          fetch_exact() {
            local label=$1 url=$2 commit=$3 tree=$4 dest=$5 rc status
            git init -q "$dest"
            git -C "$dest" remote add origin "$url"
            timeout 60s git -C "$dest" -c credential.helper= fetch --quiet \
              --depth=1 --no-tags --no-recurse-submodules origin "$commit"
            git -C "$dest" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dest" rev-parse HEAD)" = "$commit"
            test "$(git -C "$dest" rev-parse HEAD^{tree})" = "$tree"
            status=$(git -C "$dest" status --porcelain --untracked-files=all)
            test -z "$status"
            # Inspect tracked Git blobs, including actual pointer headers, without fetching LFS.
            if git -C "$dest" grep -I -l -E -e '^version https://git-lfs[.]github[.]com/spec/v1$' HEAD -- > "$work/lfs-check"; then
              echo "Unexpected LFS pointer in $label" >&2
              return 1
            else
              rc=$?
              test "$rc" = 1
            fi
            printf '%s\t%s\t%s\n' "$label" "$commit" "$tree" >> "$work/pins.tsv"
          }
          require_blob() {
            local label=$1 repo=$2 rel=$3 expected=$4
            test -s "$repo/$rel"
            test "$(git -C "$repo" rev-parse "HEAD:$rel")" = "$expected"
            test "$(git hash-object "$repo/$rel")" = "$expected"
            printf '%s/%s\t%s\n' "$label" "$rel" "$(sha256sum "$repo/$rel" | cut -d' ' -f1)" >> "$work/licenses.tsv"
          }
          no_gitlinks() {
            local rows
            rows=$(git -C "$1" ls-tree -r HEAD)
            if grep -q '^160000 ' <<< "$rows"; then
              echo "Unexpected nested gitlink" >&2
              return 1
            fi
          }
          fetch_exact producer https://github.com/FongMi/mpv-android.git \
            1bf892e3271e73d8649f2d209027f1fb17515d15 2c1dba848427d098ba9bf8ab7e86d5308a85e1e7 "$producer"
          no_gitlinks "$producer"
          require_blob producer "$producer" LICENSE 81d2ff31ab3e434d6f67fa5ac1e15e345f175db6
          # Pin the real producer entry and its complete helper chain, not the downloader.
          while read -r path blob; do
            test "$(git -C "$producer" rev-parse "HEAD:$path")" = "$blob"
            test "$(git hash-object "$producer/$path")" = "$blob"
            bash -n "$producer/$path"
          done <<'RECIPE'
          buildscripts/buildall.sh d86e302235e1f1ad8e8e965905bc93b2776d78a1
          buildscripts/include/depinfo.sh 2b9b3e40ccbcc8934f751d596959414306db67c2
          buildscripts/include/path.sh 9420e0aa4b4d1451aa61f4eb758399a269b4e316
          buildscripts/include/cmake-android.sh a14b6e968e1d8e4c96e8fdb78153e7415bd0b476
          buildscripts/scripts/dav1d.sh aef89de752d6962422ece72438703eaceed6b360
          buildscripts/scripts/uavs3d.sh 2050074c4e97728bb0e185b2f8a23d57e9f3316a
          RECIPE
          (
            . "$producer/buildscripts/include/depinfo.sh"
            test "${#dep_dav1d[@]}" = 0
            test "${#dep_uavs3d[@]}" = 0
            test "$v_ndk" = r30
            test "$v_ndk_n" = 30.0.16248370
            test "$v_ci_uavs3d" = e72f7c34be2f4de725c1ae498e8c4f3559e99b5b
          )
          mkdir -p "$producer/buildscripts/deps"
          fetch_exact dav1d https://github.com/videolan/dav1d.git \
            2a0775ca5ea055450bdfbfe81758a3c9e001f58a 18bd962130cde5ee2d1743badad84f04af8b0190 "$dav"
          no_gitlinks "$dav"
          require_blob dav1d "$dav" COPYING 8d4d6418c1ab4adf0a05bddfc11182216d5238a1
          fetch_exact uavs3d https://github.com/uavs3/uavs3d.git \
            e72f7c34be2f4de725c1ae498e8c4f3559e99b5b 6a89b203293ac285a2ad9a827ce07a7a8a999fbd "$uav"
          no_gitlinks "$uav"
          require_blob uavs3d "$uav" COPYING ce30f0fa3022f854345fb04021b1c1fc9882db9c
          # Producer uses a depth-1 detached fetch. uavs3d version.sh derives 1.2.1 from that depth.
          test "$(git -C "$uav" rev-list --count HEAD)" = 1
          emit 'SOURCE_PINS_VERIFIED=PASS' 'SOURCE_REPOSITORIES=3' 'GITLINKS=0' 'LFS_POINTERS=0' \
            'PRODUCER_COMMIT=1bf892e3271e73d8649f2d209027f1fb17515d15' \
            'DAV1D_COMMIT=2a0775ca5ea055450bdfbfe81758a3c9e001f58a' \
            'UAVS3D_COMMIT=e72f7c34be2f4de725c1ae498e8c4f3559e99b5b' \
            "SOURCE_SET_SHA256=$(LC_ALL=C sort "$work/pins.tsv" | sha256sum | cut -d' ' -f1)" \
            "SOURCE_LICENSE_SET_SHA256=$(LC_ALL=C sort "$work/licenses.tsv" | sha256sum | cut -d' ' -f1)"
          while IFS=$'\t' read -r label digest; do emit "LICENSE_SHA256 $label $digest"; done < "$work/licenses.tsv"

          # The producer's successful run used Meson 1.12.1. Runner inventory does not
          # establish Meson availability. Use only this official, hash-pinned wheel.
          phase=meson
          wheel="$work/meson-1.12.1-py3-none-any.whl"
          url=https://files.pythonhosted.org/packages/57/99/36cd25f9598eef70db97577440a70a360af505f6f01c2338a18d1556079c/meson-1.12.1-py3-none-any.whl
          wheelsha=930bc7542cbd9f57009e182fd014eba48cf1a0180a7b9006d2d32d8f168d8b02
          curl -q -fsS --retry 0 --connect-timeout 10 --max-time 60 --proto '=https' "$url" -o "$wheel"
          printf '%s  %s\n' "$wheelsha" "$wheel" | sha256sum -c -
          python3 -I - "$wheel" <<'PY' | tee -a "$summary"
          import email, hashlib, sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as z:
              names=z.namelist()
              assert len(names)==len(set(names)) and z.testzip() is None
              d='meson-1.12.1.dist-info/'
              m=email.message_from_bytes(z.read(d+'METADATA'))
              assert m['Name'].lower()=='meson' and m['Version']=='1.12.1'
              notices=[n for n in names if n.startswith(d) and n.endswith('/COPYING')]
              assert len(notices)==1
              notice=z.read(notices[0])
              assert b'Apache License' in notice
              print('MESON_LICENSE_SHA256='+hashlib.sha256(notice).hexdigest())
          PY
          python3 -m venv "$work/meson-venv"
          "$work/meson-venv/bin/python" -m pip --isolated install --no-index --no-deps \
            --disable-pip-version-check --no-cache-dir "$wheel" > "$work/meson-install.log" 2>&1
          export PATH="$work/meson-venv/bin:$PATH"
          test "$(meson --version)" = 1.12.1
          printf 'MESON=1.12.1\nMESON_WHEEL_SHA256=%s\n' "$wheelsha" | tee -a "$summary"

          # Only these two original producer targets. buildall.sh accepts one target per invocation.
          # Neither target has dependencies. Never invoke a downloader or build the base/FFmpeg/MPV graph.
          cd "$producer/buildscripts"
          mkdir -p sdk
          ln -s "$ndk" sdk/android-ndk-r30
          export cores=2
          export PATH="$cmake_bin:$PATH"
          unset PKG_CONFIG_PATH PKG_CONFIG_SYSTEM_INCLUDE_PATH PKG_CONFIG_SYSTEM_LIBRARY_PATH
          phase=build-dav1d
          : > "$work/build.log"
          timeout --kill-after=10s 5m ./buildall.sh --arch arm64 dav1d > "$work/build.log" 2>&1
          emit 'DAV1D_PRODUCER_BUILD=PASS'
          phase=build-uavs3d
          : > "$work/build.log"
          timeout --kill-after=10s 5m ./buildall.sh --arch arm64 uavs3d > "$work/build.log" 2>&1
          emit 'UAVS3D_PRODUCER_BUILD=PASS'
          prefix="$PWD/prefix/arm64"
          phase=audit
          # Check exact dependency scope and no unrelated prefixes or libraries.
          python3 -I - "$PWD" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          assert {x.name for x in (p/'deps').iterdir()}=={'dav1d','uavs3d'}
          assert {x.name for x in (p/'prefix').iterdir()}=={'arm64'}
          lib=p/'prefix/arm64/lib'
          assert {x.name for x in lib.glob('*.a')}=={'libdav1d.a','libuavs3d.a'}
          assert not list(lib.glob('*.so*'))
          PY
          # The original uavs3d recipe installs COPYING. dav1d does not; copy only its exact
          # source license into this temporary audit prefix, never repack or change either archive.
          install -Dm644 "$dav/COPYING" "$prefix/share/licenses/dav1d/COPYING"
          cmp -s "$dav/COPYING" "$prefix/share/licenses/dav1d/COPYING"
          cmp -s "$uav/COPYING" "$prefix/share/licenses/uavs3d/COPYING"
          test "$(sha256sum "$ndk/NOTICE" "$ndk/NOTICE.toolchain")" = "$notice_before"
          for row in producer dav uav; do
            dir=${!row}
            git -C "$dir" diff --quiet HEAD --
          done
          test "$(git -C "$producer" rev-parse HEAD)" = 1bf892e3271e73d8649f2d209027f1fb17515d15
          test "$(git -C "$dav" rev-parse HEAD)" = 2a0775ca5ea055450bdfbfe81758a3c9e001f58a
          test "$(git -C "$uav" rev-parse HEAD)" = e72f7c34be2f4de725c1ae498e8c4f3559e99b5b
          emit 'SOURCE_TRACKED_UNCHANGED=PASS' 'INSTALLED_LICENSES=PASS' 'NDK_NOTICES_UNCHANGED=PASS'

          # Validate actual generated build settings, not guessed library versions.
          meson introspect --buildoptions "$dav/_build_arm64" > "$work/dav-options.json"
          python3 -I - "$work/dav-options.json" "$uav/_build_arm64/CMakeCache.txt" "$uav/version.h" <<'PY' | tee -a "$summary"
          import json, re, sys
          from pathlib import Path
          opts={r['name']:r['value'] for r in json.loads(Path(sys.argv[1]).read_text())}
          for key,value in {'b_lto':True,'enable_asm':True,'enable_tests':False,'stack_alignment':16,
                            'default_library':'static','wrap_mode':'nodownload','buildtype':'release'}.items():
              assert opts.get(key)==value,(key,opts.get(key))
          assert set(opts['bitdepths'])=={'8','16'}
          c={}
          for line in Path(sys.argv[2]).read_text().splitlines():
              m=re.match(r'^([^#/:][^:]*):[^=]+=(.*)$',line)
              if m: c[m[1]]=m[2]
          for k,v in {'ANDROID_ABI':'arm64-v8a','ANDROID_PLATFORM':'android-24',
                      'COMPILE_10BIT':'ON','BUILD_SHARED_LIBS':'OFF','CMAKE_BUILD_TYPE':'Release',
                      'CMAKE_INSTALL_PREFIX':'/usr/local','CMAKE_POSITION_INDEPENDENT_CODE':'ON'}.items():
              assert c.get(k)==v,(k,c.get(k))
          version=Path(sys.argv[3]).read_text()
          assert re.search(r'^#define\s+VERSION_STR\s+"1\.2\.1"\s*$',version,re.M)
          assert re.search(r'^#define\s+VERSION_SHA1\s+"e72f7c34be2f4de725c1ae498e8c4f3559e99b5b"\s*$',version,re.M)
          print('DAV1D_BUILD_CONTRACT=LTO_STATIC_ASM_8_16')
          print('UAVS3D_BUILD_CONTRACT=ARM64_STATIC_10BIT_1.2.1')
          PY

          # Audit the exact original archives; dav1d's pinned recipe enables LTO. Do NOT
          # disable LTO or describe bitcode as ELF. Parse each ar member by ordinal (duplicate
          # names can occur), materialize LTO members to temporary AArch64 ELF for auditing,
          # and link the untouched original libraries with the actual installed pkg-config flags.
          cat > "$work/audit.py" <<'PY'
          import hashlib, os, re, shlex, struct, subprocess, sys, tempfile
          from pathlib import Path

          BC=(b'BC\xc0\xde', b'\xde\xc0\x17\x0b')

          def need(ok, why):
              if not ok: raise ValueError(why)

          def sha(data): return hashlib.sha256(data).hexdigest()

          def read_ar(data):
              need(data.startswith(b'!<arch>\n'),'not a normal ar archive')
              pos=8; names=None; out=[]
              while pos<len(data):
                  need(pos+60<=len(data),'short ar header')
                  h=data[pos:pos+60]; pos+=60
                  need(h[58:60]==b'`\n','bad ar header trailer')
                  name=h[:16].decode('ascii').rstrip(' ')
                  size=h[48:58].strip()
                  need(size.isdigit(),'bad ar member size')
                  n=int(size); need(pos+n<=len(data),'truncated ar member')
                  payload=data[pos:pos+n]; pos+=n
                  if n%2:
                      need(data[pos:pos+1]==b'\n','bad ar padding'); pos+=1
                  if name in ('/','/SYM64/'):
                      continue
                  if name=='//':
                      need(names is None,'duplicate ar string table'); names=payload; continue
                  if name.startswith('#1/'):
                      nlen=int(name[3:]); need(0<nlen<=len(payload),'bad BSD ar name')
                      name=payload[:nlen].rstrip(b'\0').decode('utf-8'); payload=payload[nlen:]
                      if name in ('__.SYMDEF','__.SYMDEF SORTED','__.SYMDEF_64','__.SYMDEF_64 SORTED'): continue
                  elif name.startswith('/'):
                      need(names is not None and name[1:].isdigit(),'bad GNU ar name reference')
                      start=int(name[1:]); end=names.find(b'/\n',start)
                      need(0<=start<end,'bad GNU ar name')
                      name=names[start:end].decode('utf-8')
                  else:
                      name=name.removesuffix('/')
                  need(bool(name) and b'\0' not in name.encode() and '\n' not in name,'bad member name')
                  out.append((name,payload))
              need(pos==len(data) and out,'empty or malformed archive')
              return out

          def check_elf(data,typ=1):
              need(len(data)>=64 and data[:7]==b'\x7fELF\x02\x01\x01','not little-endian ELF64')
              v=struct.unpack_from('<16sHHIQQQIHHHHHH',data)
              need(v[1:4]==(typ,183,1),'wrong ELF type/machine/version')
              need(v[8]==64 and v[11]==64 and v[12]>0 and v[6]>=64 and v[6]+v[11]*v[12]<=len(data),'invalid ELF section table')
              if typ==3:
                  phoff,phentsize,phnum=v[5],v[9],v[10]
                  need(phentsize==56 and phnum>0 and phoff+phentsize*phnum<=len(data),'bad program table')
                  loads=[struct.unpack_from('<IIQQQQQQ',data,phoff+i*phentsize) for i in range(phnum)]
                  loads=[x for x in loads if x[0]==1]
                  need(loads and all(x[7]>=16384 and x[2]%16384==x[3]%16384 for x in loads),'PT_LOAD not 16KiB-compatible')

          def run(args,env=None,timeout=30):
              return subprocess.check_output([str(a) for a in args],text=True,env=env,timeout=timeout)

          def members(archive,ar,clang,readelf,tmp,allow_lto):
              raw=archive.read_bytes(); entries=read_ar(raw)
              need([name for name,_ in entries]==run([ar,'t',archive]).splitlines(),'ar listing mismatch')
              elf=lto=0; records=[]
              for i,(name,b) in enumerate(entries):
                  f=tmp/'member.input'; f.write_bytes(b)
                  if b.startswith(b'\x7fELF'):
                      check_elf(b); verified=f; elf+=1; kind='ELF'
                  elif b[:4] in BC:
                      need(allow_lto,'unexpected LTO member')
                      # The same pinned Android API24 clang that built the archive must accept
                      # the original module without a target triple override. Cross-target IR fails.
                      ir=tmp/'member.ll'; ir.unlink(missing_ok=True)
                      run([*clang,'-Werror=override-module','-x','ir','-S','-emit-llvm',f,'-o',ir])
                      triple=re.findall(r'^target triple = "([^"]+)"$',ir.read_text(),re.M)
                      need(len(triple)==1 and re.fullmatch(r'aarch64-[^-]+-linux-android24',triple[0]),'wrong LTO target triple')
                      verified=tmp/'member.elf'; verified.unlink(missing_ok=True)
                      run([*clang,'-Werror=override-module','-x','ir','-c',f,'-o',verified])
                      check_elf(verified.read_bytes()); lto+=1; kind='LTO'
                  else: raise ValueError('unknown archive member format: '+name)
                  report=run([readelf,'-h',verified])
                  need(re.search(r'^\s*Machine:\s*AArch64\s*$',report,re.M) and re.search(r'^\s*Type:\s*REL\b',report,re.M),'readelf disagrees')
                  records.append(f'{i}\t{name}\t{kind}\t{sha(b)}')
              need(elf+lto==len(entries),'not all members verified')
              need(sha(archive.read_bytes())==sha(raw),'original archive changed')
              return len(entries),elf,lto,sha('\n'.join(records).encode())

          def pc_flags(prefix,stem,version):
              env=os.environ.copy()
              for k in list(env):
                  if k.startswith('PKG_CONFIG_'): env.pop(k)
              env.update(PKG_CONFIG_LIBDIR=str(prefix/'lib/pkgconfig'),PKG_CONFIG_SYSROOT_DIR=str(prefix))
              def pc(*args): return run(['pkg-config',*args,stem],env=env).strip()
              need(pc('--modversion')==version,'pkg-config version mismatch')
              need(Path(pc('--variable=pcfiledir')).resolve()==(prefix/'lib/pkgconfig').resolve(),'foreign pc')
              cflags=shlex.split(pc('--cflags')); libs=shlex.split(pc('--static','--libs'))
              for flag in cflags:
                  need(flag.startswith('-I') and Path(flag[2:]).resolve()==(prefix/'include').resolve(),'foreign cflags: '+flag)
              need(any(x.startswith('-I') for x in cflags),'missing include flag')
              for flag in libs:
                  if flag.startswith('-L'):
                      need(Path(flag[2:]).resolve()==(prefix/'lib').resolve(),'foreign library path')
                  else:
                      need(flag in ('-l'+stem,'-lm','-ldl','-pthread'),'unexpected link flag: '+flag)
              need('-l'+stem in libs and any(x.startswith('-L') for x in libs),'missing target library flag')
              return cflags,libs

          def symbols(nm,archive,required):
              output=run([nm,'--defined-only','--extern-only','--format=posix',archive])
              actual={r.split()[0] for r in output.splitlines() if len(r.split())>=3 and r.split()[1] in ('T','W')}
              need(required<=actual,'missing symbols: '+','.join(sorted(required-actual)))

          def main(prefix,llvm,dav,uav,work):
              clang=[str(llvm/'aarch64-linux-android24-clang')]
              required={
                  'dav1d':{'dav1d_version','dav1d_version_api','dav1d_default_settings','dav1d_open','dav1d_send_data','dav1d_get_picture','dav1d_flush','dav1d_close','dav1d_data_wrap','dav1d_data_unref','dav1d_picture_unref','dav1d_parse_sequence_header'},
                  'uavs3d':{'uavs3d_create','uavs3d_delete','uavs3d_reset','uavs3d_flush','uavs3d_decode','uavs3d_img_cpy_cvt'},
              }
              dav_names=['common.h','data.h','dav1d.h','headers.h','picture.h','version.h']
              for stem,src,version,headers in [
                  ('dav1d',dav,'1.5.5',[(Path('dav1d')/n,Path('include/dav1d')/n) for n in dav_names]),
                  ('uavs3d',uav,'1.2.1',[(Path('uavs3d.h'),Path('source/decoder/uavs3d.h'))]),
              ]:
                  label=stem.upper(); archive=prefix/'lib'/('lib'+stem+'.a'); pc=prefix/'lib/pkgconfig'/(stem+'.pc')
                  need(archive.is_file() and not archive.is_symlink() and pc.is_file() and not pc.is_symlink(),'missing static library or pc')
                  digest=sha(archive.read_bytes()); receipt=[]
                  for rel,original in headers:
                      f=prefix/'include'/rel
                      need(f.is_file() and not f.is_symlink() and f.read_bytes()==(src/original).read_bytes(),'installed header mismatch: '+str(rel))
                      receipt.append(str(rel)+'\t'+sha(f.read_bytes()))
                  if stem=='dav1d':
                      need({p.name for p in (prefix/'include/dav1d').iterdir()}==set(dav_names),'unexpected dav1d header set')
                      v=(prefix/'include/dav1d/version.h').read_text()
                      for key,val in [('MAJOR','7'),('MINOR','0'),('PATCH','0')]:
                          need(re.search(r'^#define DAV1D_API_VERSION_'+key+r'\s+'+val+r'\s*$',v,re.M),'dav1d API version drift')
                  cflags,libs=pc_flags(prefix,stem,version)
                  if stem=='uavs3d': need('-lpthread' not in pc.read_text(),'Android pc contains -lpthread')
                  with tempfile.TemporaryDirectory(prefix=stem+'-audit-',dir=work) as d:
                      tmp=Path(d)
                      total,elf,lto,manifest=members(archive,llvm/'llvm-ar',clang,llvm/'llvm-readelf',tmp,stem=='dav1d')
                      symbols(llvm/'llvm-nm',archive,required[stem])
                      # Compile a header consumer and whole-archive link the original archive using
                      # the actual installed pc flags. This produces an audit-only ELF, never a payload.
                      probe=tmp/'probe.c'
                      header='dav1d/dav1d.h' if stem=='dav1d' else 'uavs3d.h'
                      funcs=sorted(required[stem])
                      probe.write_text('#include <'+header+'>\n'+''.join('__attribute__((used)) __typeof__(&'+f+') ref_'+f+' = &'+f+';\n' for f in funcs))
                      linked=tmp/'audit.so'
                      run([*clang,'-shared','-fPIC','-Wl,--no-undefined','-Wl,-z,max-page-size=16384',*cflags,probe,
                           '-Wl,--whole-archive',archive,'-Wl,--no-whole-archive',*libs,'-o',linked],timeout=90)
                      check_elf(linked.read_bytes(),3)
                      # A shared output is only a link test; it must not depend on a host/decoder SO.
                      dynamic=run([llvm/'llvm-readelf','-d',linked])
                      needed_rows=[line for line in dynamic.splitlines() if '(NEEDED)' in line]
                      needed=set(re.findall(r'Shared library: \[([^\]]+)\]',dynamic))
                      need(len(needed_rows)==len(needed),'unparsed/duplicate NEEDED entry')
                      need(needed<= {'libc.so','libm.so','libdl.so'},'unexpected NEEDED: '+str(sorted(needed)))
                      need(not re.search(r'\((?:RPATH|RUNPATH)\)',dynamic),'unexpected runtime search path')
                      need(sha(archive.read_bytes())==digest,'archive modified by audit')
                      rows={
                          'VERSION':version,'ARCHIVE_BYTES':archive.stat().st_size,'ARCHIVE_SHA256':digest,
                          'MEMBERS_TOTAL':total,'ORIGINAL_ELF_REL_MEMBERS':elf,'ORIGINAL_LTO_MEMBERS':lto,
                          'LTO_TO_AARCH64_ELF_VERIFIED':lto,'ALL_ORIGINAL_MEMBERS_ELF':'YES' if not lto else 'NO',
                          'MEMBER_MANIFEST_SHA256':manifest,'REQUIRED_SYMBOLS':len(required[stem]),
                          'HEADERS_SHA256':sha('\n'.join(sorted(receipt)).encode()),'PC_SHA256':sha(pc.read_bytes()),
                          'PC_CONSUMER_LINK':'PASS','WHOLE_ARCHIVE_LINK_ELF_16K':'PASS',
                          'AUDIT_LINK_SHA256':sha(linked.read_bytes()),
                      }
                      for k,v in rows.items(): print(f'{label}_{k}={v}',flush=True)

          if __name__=='__main__': main(*map(Path,sys.argv[1:]))
          PY
          timeout --kill-after=10s 6m python3 -I "$work/audit.py" "$prefix" "$llvm" "$dav" "$uav" "$work" | tee -a "$summary"
          phase=complete
