name: Isolated MPV native instrumentation source compile
on:
  push:
    branches: [dev/fongmi-upstream-adaptation]
    paths: [.github/workflows/94-native-consumer-probes-once.yml]
permissions:
  contents: read
jobs:
  mpv-contract:
    if: >-
      github.repository == 'rileyaaa/FingMi-Xray' && github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' && github.event.head_commit.message == 'ci: compile only new native stream Android probe sources'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: fork
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/media
          ref: 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
          path: inputs/media
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/mpv-android
          ref: 1bf892e3271e73d8649f2d209027f1fb17515d15
          path: inputs/mpv
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Install official Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(realpath -e "${ANDROID_HOME:-/usr/local/lib/android/sdk}")"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >>"$GITHUB_ENV"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          yes | "$manager" --sdk_root="$sdk" --licenses >/dev/null 2>&1 || true
          "$manager" --sdk_root="$sdk" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile new native instrumentation source against real Media3
        shell: bash
        run: |
          set -euo pipefail
          base=fork/scripts/upstream-adaptation/mpv-stream/android
          python3 "$base/stage_android_probe.py" inputs/media inputs/mpv
          mod=inputs/media/mpv-stream-probe
          cp "$base/native/MpvNativeRequestGate.java" "$mod/src/main/java/androidx/media3/mpvplayer/media/"
          cp "$base/native/NativeMpvStreamAndroidTest.java" "$mod/src/androidTest/java/org/fingmi/mpvprobe/"
          git -C fork hash-object scripts/upstream-adaptation/mpv-stream/android/native/MpvNativeRequestGate.java scripts/upstream-adaptation/mpv-stream/android/native/NativeMpvStreamAndroidTest.java
          test ! -d "$mod/src/main/jniLibs"
          cd inputs/media
          bash gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4g -PexternalBuildDir="$RUNNER_TEMP/mpv-build" \
            :mpv-stream-probe:compileDebugAndroidTestJavaWithJavac
          echo PASS_NEW_NATIVE_PROBE_JAVA_COMPILE_ONLY
