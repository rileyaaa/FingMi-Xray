name: Temporary upstream release analysis

on:
  workflow_dispatch:
  push:
    branches:
      - sync-upstream-c616c0aa
    paths:
      - '.github/.trigger-upstream-release-analysis'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JADX_VERSION: "1.5.6"
      JADX_SHA256: "545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974"
      V567_V7_SHA256: "1ac50b94e5db5589f33f551c6d7cb0bdd59bd3c9f88c0e5c9f684dff12cccba1"
      V567_V8_SHA256: "b763c1b18681fe3a503a2daca1ae02878c41078675dc7e42ef89c292b1526a4f"
      V568_V7_SHA256: "2859ebef12bf0fa0dfec023d410df478ac5e5a82a72ef2be48f6e4fa09a24761"
      V568_V8_SHA256: "948df594843e304c332476a380163dc1cc74f964be5ea1539ff0465a9dd936eb"

    steps:
      - uses: actions/checkout@v7

      - name: Verify marker-only analysis source
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          parent="$(git rev-parse "$GITHUB_SHA^")"
          changed="$(git diff --name-only "$parent" "$GITHUB_SHA")"
          test "$changed" = ".github/.trigger-upstream-release-analysis"

      - name: Download immutable upstream releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/upstream-release-analysis/apk build/upstream-release-analysis/report
          curl -fL --retry 3 'https://github.com/FongMi/Release/releases/download/5.6.7/leanback-armeabi_v7a.apk' -o build/upstream-release-analysis/apk/567-v7.apk
          curl -fL --retry 3 'https://github.com/FongMi/Release/releases/download/5.6.7/leanback-arm64_v8a.apk' -o build/upstream-release-analysis/apk/567-v8.apk
          curl -fL --retry 3 'https://github.com/FongMi/Release/releases/download/5.6.8/leanback-armeabi_v7a.apk' -o build/upstream-release-analysis/apk/568-v7.apk
          curl -fL --retry 3 'https://github.com/FongMi/Release/releases/download/5.6.8/leanback-arm64_v8a.apk' -o build/upstream-release-analysis/apk/568-v8.apk
          printf '%s  %s\n'             "$V567_V7_SHA256" build/upstream-release-analysis/apk/567-v7.apk             "$V567_V8_SHA256" build/upstream-release-analysis/apk/567-v8.apk             "$V568_V7_SHA256" build/upstream-release-analysis/apk/568-v7.apk             "$V568_V8_SHA256" build/upstream-release-analysis/apk/568-v8.apk             | sha256sum -c -

      - name: Compare DEX and native payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          root = Path("build/upstream-release-analysis")
          apks = {
              "567-v7": root / "apk/567-v7.apk",
              "567-v8": root / "apk/567-v8.apk",
              "568-v7": root / "apk/568-v7.apk",
              "568-v8": root / "apk/568-v8.apk",
          }

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          report = {}
          for name, path in apks.items():
              with zipfile.ZipFile(path) as z:
                  dex = {}
                  libs = {}
                  for info in z.infolist():
                      if info.filename.startswith("classes") and info.filename.endswith(".dex"):
                          data = z.read(info)
                          dex[info.filename] = {"sha256": sha(data), "size": len(data)}
                      if info.filename.startswith("lib/") and info.filename.endswith(".so"):
                          data = z.read(info)
                          libs[info.filename] = {"sha256": sha(data), "size": len(data)}
                  report[name] = {"dex": dex, "libs": libs}

          comparisons = {}
          for abi in ("v7", "v8"):
              left = report[f"567-{abi}"]
              right = report[f"568-{abi}"]
              comparisons[abi] = {
                  "dex_equal": left["dex"] == right["dex"],
                  "dex_567": left["dex"],
                  "dex_568": right["dex"],
                  "changed_libs": {
                      key: {"567": left["libs"].get(key), "568": right["libs"].get(key)}
                      for key in sorted(set(left["libs"]) | set(right["libs"]))
                      if left["libs"].get(key) != right["libs"].get(key)
                  },
              }

          payload = {"releases": report, "comparisons": comparisons}
          out = root / "report/release-payload.json"
          out.write_text(json.dumps(payload, indent=2, sort_keys=True), encoding="utf-8")
          print(json.dumps({
              abi: {
                  "dex_equal": data["dex_equal"],
                  "changed_lib_count": len(data["changed_libs"]),
                  "changed_libs": list(data["changed_libs"]),
              }
              for abi, data in comparisons.items()
          }, indent=2))
          PY

          for pair in "567-v7 568-v7 armeabi-v7a" "567-v8 568-v8 arm64-v8a"; do
            set -- $pair
            old="$1"; new="$2"; abi="$3"
            mkdir -p "build/upstream-release-analysis/elf/$abi"
            unzip -p "build/upstream-release-analysis/apk/$old.apk" "lib/$abi/libmedia3ass.so" > "build/upstream-release-analysis/elf/$abi/567-libmedia3ass.so"
            unzip -p "build/upstream-release-analysis/apk/$new.apk" "lib/$abi/libmedia3ass.so" > "build/upstream-release-analysis/elf/$abi/568-libmedia3ass.so"
            {
              echo "[$abi]"
              sha256sum "build/upstream-release-analysis/elf/$abi/"*.so
              if python3 scripts/build/check-elf-runtime.py                   --reference "build/upstream-release-analysis/elf/$abi/567-libmedia3ass.so"                   --candidate "build/upstream-release-analysis/elf/$abi/568-libmedia3ass.so"                   --label "libmedia3ass $abi 5.6.7->5.6.8"; then
                echo "runtime_equal=true"
              else
                echo "runtime_equal=false"
              fi
              readelf -nW "build/upstream-release-analysis/elf/$abi/567-libmedia3ass.so" || true
              readelf -nW "build/upstream-release-analysis/elf/$abi/568-libmedia3ass.so" || true
            } >> build/upstream-release-analysis/report/libmedia3ass.txt 2>&1
          done

      - name: Decompile 5.6.8 v7 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/upstream-release-analysis/tools
          curl -fL --retry 3 --retry-delay 2             "https://github.com/skylot/jadx/releases/download/v$JADX_VERSION/jadx-$JADX_VERSION.zip"             -o build/upstream-release-analysis/tools/jadx.zip
          echo "$JADX_SHA256  build/upstream-release-analysis/tools/jadx.zip" | sha256sum -c -
          unzip -q build/upstream-release-analysis/tools/jadx.zip -d build/upstream-release-analysis/tools/jadx
          chmod +x build/upstream-release-analysis/tools/jadx/bin/jadx
          set +e
          build/upstream-release-analysis/tools/jadx/bin/jadx             --deobf             --comments-level warn             --no-res             -d build/upstream-release-analysis/jadx-568-v7             build/upstream-release-analysis/apk/568-v7.apk
          status=$?
          set -e
          echo "JADX exit code: $status" > build/upstream-release-analysis/report/jadx-status.txt
          test -d build/upstream-release-analysis/jadx-568-v7/sources
          find build/upstream-release-analysis/jadx-568-v7/sources -type f -name '*.java' | sort             > build/upstream-release-analysis/report/jadx-java-files.txt

      - name: Upload analysis report
        uses: actions/upload-artifact@v7
        with:
          name: upstream-release-5.6.7-5.6.8-analysis
          path: |
            build/upstream-release-analysis/report/
            build/upstream-release-analysis/elf/
          if-no-files-found: error
          retention-days: 2
          compression-level: 6

      - name: Upload 5.6.8 source-only JADX
        uses: actions/upload-artifact@v7
        with:
          name: upstream-5.6.8-v7-jadx-sources
          path: build/upstream-release-analysis/jadx-568-v7/sources/
          if-no-files-found: error
          retention-days: 2
          compression-level: 6
