name: Temporary Dolby 5.6.8 targeted audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/.trigger-dolby-568-audit"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APK_URL: https://github.com/FongMi/Release/releases/download/5.6.8/leanback-armeabi_v7a.apk
      APK_SHA256: 2859ebef12bf0fa0dfec023d410df478ac5e5a82a72ef2be48f6e4fa09a24761
      JADX_VERSION: 1.5.6
      JADX_SHA256: 545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974
      BUILD_SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_SOURCE_SHA }}

      - name: Verify marker-only trigger
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "$BUILD_SOURCE_SHA" = "$GITHUB_SHA"
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          parent="$(git rev-parse "$GITHUB_SHA^")"
          changed="$(git diff --name-only "$parent" "$GITHUB_SHA")"
          test "$changed" = ".github/.trigger-dolby-568-audit"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Download pinned 5.6.8 TV APK and JADX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/tools audit/out
          curl -fL --retry 3 --retry-delay 2 "$APK_URL" -o audit/fongmi-568-v7.apk
          echo "$APK_SHA256  audit/fongmi-568-v7.apk" | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2             "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"             -o audit/tools/jadx.zip
          echo "$JADX_SHA256  audit/tools/jadx.zip" | sha256sum -c -
          unzip -q audit/tools/jadx.zip -d audit/tools/jadx
          chmod +x audit/tools/jadx/bin/jadx

      - name: Decompile release and print Dolby lifecycle evidence
        shell: bash
        run: |
          set -euo pipefail
          set +e
          audit/tools/jadx/bin/jadx --deobf --comments-level warn -d audit/out audit/fongmi-568-v7.apk
          status=$?
          set -e
          echo "JADX exit code: $status"
          test -d audit/out/sources

          echo "===== REFERENCES: P5 RENDERER ====="
          grep -R -n -C 24 --include='*.java' 'FfmpegDolbyVisionP5Renderer' audit/out/sources || true
          echo "===== REFERENCES: P7 CONVERTER ====="
          grep -R -n -C 18 --include='*.java' 'DolbyVisionP7Converter' audit/out/sources || true

          for cls in             FfmpegDolbyVisionP5MappingPolicy             FfmpegDolbyVisionP5Native             FfmpegDolbyVisionP5Renderer             FfmpegDolbyVisionP5VideoSink             FfmpegDolbyVisionP7Converter; do
            file="$(find audit/out/sources -type f -name "$cls.java" -print -quit)"
            echo "===== CLASS: $cls :: $file ====="
            test -n "$file"
            cat "$file"
          done

      - name: Print FFmpeg Dolby RegisterNatives string evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/native
          unzip -p audit/fongmi-568-v7.apk 'lib/armeabi-v7a/libffmpegDoviJNI.so' > audit/native/libffmpegDoviJNI.so
          unzip -p audit/fongmi-568-v7.apk 'lib/armeabi-v7a/libffmpegJNI.so' > audit/native/libffmpegJNI.so
          echo "===== libffmpegDoviJNI strings ====="
          strings -a audit/native/libffmpegDoviJNI.so             | grep -E 'FfmpegDolbyVision|native(Create|Get|Probe|Queue|Redraw|Release|Set|Clear|Convert|Flush)|androidx/media3/decoder/ffmpeg|\([BCDFIJSZL\[]'             | sort -u || true
          echo "===== libffmpegJNI strings ====="
          strings -a audit/native/libffmpegJNI.so             | grep -E 'FfmpegDolbyVision|androidx/media3/decoder/ffmpeg|native(Convert|Create|Flush|Probe|Release)|\([BCDFIJSZL\[]'             | sort -u || true
