name: Purge Actions history

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete all historical Actions artifacts and completed runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          artifacts_file="$RUNNER_TEMP/artifacts.tsv"
          runs_file="$RUNNER_TEMP/runs.tsv"

          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name, .size_in_bytes] | @tsv' > "$artifacts_file"

          artifact_count=0
          artifact_bytes=0
          while IFS=$'\t' read -r id name size; do
            [ -n "${id:-}" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
            artifact_count=$((artifact_count + 1))
            artifact_bytes=$((artifact_bytes + size))
          done < "$artifacts_file"

          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .status, .name] | @tsv' > "$runs_file"

          run_count=0
          while IFS=$'\t' read -r id status name; do
            [ -n "${id:-}" ] || continue
            [ "$id" != "$GITHUB_RUN_ID" ] || continue
            [ "$status" = "completed" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id"
            run_count=$((run_count + 1))
          done < "$runs_file"

          echo "deleted_artifacts=$artifact_count"
          echo "deleted_artifact_bytes=$artifact_bytes"
          echo "deleted_completed_runs=$run_count"

          # Best effort: GitHub may or may not accept deleting the currently
          # executing purge run. If rejected while in_progress, it is the only
          # cleanup run intentionally left behind.
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$GITHUB_RUN_ID" || true
