name: Libass actual font configuration and timed samples batch
on:
  push:
    branches: [dev/fongmi-upstream-adaptation]
    paths: [.github/workflows/102-libass-font-timing-once.yml]
permissions:
  contents: read
jobs:
  libass:
    if: >-
      github.repository == 'rileyaaa/FingMi-Xray' && github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' && github.event.head_commit.message == 'ci: validate configured Libass fonts and timing on host then Android'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: fork
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: libass/libass
          ref: a6613d2554daff9e1b5ddf2dbfb3fc31b61b9448
          path: inputs/libass
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/mpv-android
          ref: 1bf892e3271e73d8649f2d209027f1fb17515d15
          path: inputs/mpv
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: dlgt7/media
          ref: 3382803f11e129af8676a0a775f98293b079797f
          path: inputs/reference
          sparse-checkout: libraries/exoplayer/src/main/java/androidx/media3/exoplayer/libass
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Build pinned libass source and author's actual font-size patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C inputs/libass rev-parse HEAD)" = a6613d2554daff9e1b5ddf2dbfb3fc31b61b9448
          test "$(git -C inputs/mpv rev-parse HEAD)" = 1bf892e3271e73d8649f2d209027f1fb17515d15
          test "$(git -C inputs/libass hash-object libass/ass.h)" = 851ca7cb9614f8d5d3175bbcc2925dfb6521bc27
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config nasm libfreetype6-dev libfontconfig1-dev libfribidi-dev libharfbuzz-dev libunibreak-dev fonts-dejavu-core libguava-java
          patch_file="$GITHUB_WORKSPACE/inputs/mpv/buildscripts/patches/libass-font-size-em.patch"
          echo 'fa6d0d3a00cb7896525a707407daad4d51e807d65d0692d6d33cc565d30ea9fa  '"$patch_file" | sha256sum -c -
          if patch --batch --forward --fuzz=0 --dry-run -d inputs/libass -p1 <"$patch_file"; then
            patch --batch --forward --fuzz=0 -d inputs/libass -p1 <"$patch_file"
          elif ! patch --batch --reverse --fuzz=0 --dry-run -d inputs/libass -p1 <"$patch_file"; then
            exit 1
          fi
          cd inputs/libass
          git diff --stat
          test -s COPYING
          echo 'f7e30699d02798351e7f839e3d3bfeb29ce65e44efa7735c225464c4fd7dfe9c  COPYING' | sha256sum -c -
          autoreconf -fi
          ./configure --prefix="$RUNNER_TEMP/ass-prefix" --with-pic --enable-shared --disable-static --enable-asm --enable-fontconfig --enable-libunibreak
          make -j2
          make install
          echo PASS_PINNED_LIBASS_HOST_BUILD
      - name: Execute new configured font, timing and scale contract
        shell: bash
        run: |
          set -euo pipefail
          base=fork/scripts/upstream-adaptation/libass-library-probe
          export PKG_CONFIG_PATH="$RUNNER_TEMP/ass-prefix/lib/pkgconfig"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/ass-prefix/lib"
          pkg-config --modversion libass
          pkg-config --variable=libdir libass
          test "$(pkg-config --variable=libdir libass)" = "$RUNNER_TEMP/ass-prefix/lib"
          mkdir "$RUNNER_TEMP/ass-probe"
          g++ -DLIBASS_REFERENCE_FONT_PROFILE -std=c++17 -Wall -Wextra -Werror -fPIC -shared -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            "$base/libass_library.cpp" $(pkg-config --cflags --libs libass fontconfig) -o "$RUNNER_TEMP/ass-probe/libasslibraryprobe.so"
          ldd "$RUNNER_TEMP/ass-probe/libasslibraryprobe.so"
          ldd "$RUNNER_TEMP/ass-probe/libasslibraryprobe.so" | grep -F "$RUNNER_TEMP/ass-prefix/lib/libass"
          sha256sum "$RUNNER_TEMP/ass-probe/libasslibraryprobe.so"
          dpkg-query -W libguava-java fonts-dejavu-core
          test -s /usr/share/java/guava.jar
          sha256sum /usr/share/java/guava.jar /usr/share/doc/libguava-java/copyright
          python3 "$base/stage_reference_host.py" inputs/reference "$RUNNER_TEMP/ass-java"
          fontdir="$RUNNER_TEMP/字幕 fonts"
          cachedir="$RUNNER_TEMP/字幕 cache"
          mkdir -p "$fontdir" "$cachedir"
          cp /usr/share/fonts/truetype/dejavu/{DejaVuSans,DejaVuSerif}.ttf "$fontdir/"
          sha256sum "$fontdir/"*.ttf /usr/share/doc/fonts-dejavu-core/copyright /usr/share/doc/libfontconfig1/copyright
          pkg-config --modversion fontconfig
          dpkg-query -W libfontconfig1 libfontconfig1-dev
          python3 - "$fontdir" "$cachedir" "$RUNNER_TEMP/font config.xml" <<'PY'
          import sys,xml.etree.ElementTree as ET
          root=ET.Element("fontconfig")
          ET.SubElement(root,"dir").text=sys.argv[1]
          ET.SubElement(root,"cachedir").text=sys.argv[2]
          ET.ElementTree(root).write(sys.argv[3],encoding="utf-8",xml_declaration=True)
          PY
          javac --release 8 -cp /usr/share/java/guava.jar -d "$RUNNER_TEMP/ass-probe" "$RUNNER_TEMP/ass-java/"*.java "$base/LibassLibraryProbe.java" "$base/LibassFontTimingChecks.java" "$base/LibassFontTimingHostProbe.java"
          timeout 120 java -Xcheck:jni -cp "$RUNNER_TEMP/ass-probe:/usr/share/java/guava.jar" androidx.media3.exoplayer.libass.LibassFontTimingHostProbe "$RUNNER_TEMP/ass-probe/libasslibraryprobe.so" "$RUNNER_TEMP/font config.xml" "$fontdir"
  android:
    needs: libass
    if: >-
      github.repository == 'rileyaaa/FingMi-Xray' && github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' && github.event.head_commit.message == 'ci: validate configured Libass fonts and timing on host then Android'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: fork
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/media
          ref: 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
          path: inputs/media
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/mpv-android
          ref: 1bf892e3271e73d8649f2d209027f1fb17515d15
          path: inputs/producer
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: dlgt7/media
          ref: 3382803f11e129af8676a0a775f98293b079797f
          path: inputs/reference
          sparse-checkout: libraries/exoplayer/src/main/java/androidx/media3/exoplayer/libass
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: freetype/freetype
          ref: 37515cf56ba3349656049edbed89ffc6f6466f2d
          path: inputs/freetype
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: fribidi/fribidi
          ref: b93119f5fdc7ea47672cc304c1455ffa6dfe7536
          path: inputs/fribidi
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: harfbuzz/harfbuzz
          ref: 35f656a1a2bab548ea7f54a6dd3fba2b09680d14
          path: inputs/harfbuzz
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: libass/libass
          ref: a6613d2554daff9e1b5ddf2dbfb3fc31b61b9448
          path: inputs/ass
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: fontconfig/fontconfig
          ref: 0f236723a3c26bd9745e32ba2b3ee21e5f809295
          path: inputs/fontconfig
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: GNOME/libxml2
          ref: 96498992efa48d52b0e8b83058bd88dbdaf153c1
          path: inputs/libxml2
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: adah1972/libunibreak
          ref: 28a2756b864c343f438cd22537d49d394d4666a5
          path: inputs/unibreak
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: mesonbuild/meson
          ref: 6ac66b9cbe36e861a4b10cf62d75ec181dfb291a
          path: inputs/meson
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Stage fixed sources and install official compile SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev/fongmi-upstream-adaptation
          sdk="$(realpath -e "${ANDROID_HOME:-/usr/local/lib/android/sdk}")"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          printf 'ANDROID_SDK=%s\n' "$sdk"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
          yes | "$sdkmanager" --sdk_root="$sdk" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --sdk_root="$sdk" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'ndk;30.0.16248370'
      - name: Build pinned Android fontconfig, libxml2, unibreak and Libass caller
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake autoconf automake libtool pkg-config gperf fonts-dejavu-core
          test "$(git -C inputs/meson rev-parse HEAD)" = 6ac66b9cbe36e861a4b10cf62d75ec181dfb291a
          test "$(git -C inputs/meson hash-object COPYING)" = d645695673349e3947e8e5ae42332d0ac3164cd7
          mkdir "$RUNNER_TEMP/ass-meson-bin"
          printf '#!/bin/sh\nexec python3 "%s" "$@"\n' "$GITHUB_WORKSPACE/inputs/meson/meson.py" > "$RUNNER_TEMP/ass-meson-bin/meson"
          chmod +x "$RUNNER_TEMP/ass-meson-bin/meson"
          export PATH="$RUNNER_TEMP/ass-meson-bin:$PATH"
          meson --version
          gperf --version
          dpkg-query -W gperf ninja-build
          cmake --version
          python3 fork/scripts/upstream-adaptation/libass-library-probe/build_reference_android.py inputs "$ANDROID_HOME/ndk/30.0.16248370" "$RUNNER_TEMP/ass-reference" --font-profile
      - name: Validate SDK executables and create isolated AVD
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(realpath -e "$ANDROID_HOME")"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="$sdk/cmdline-tools/latest/bin/avdmanager"
          adb_bin="$sdk/platform-tools/adb"
          emu="$sdk/emulator/emulator"
          test -x "$sdkmanager"
          test -x "$avdmanager"
          "$sdkmanager" --sdk_root="$sdk" --install emulator 'system-images;android-34;default;x86_64'
          for bin in "$sdkmanager" "$avdmanager" "$adb_bin" "$emu"; do
            test -x "$bin"
            printf 'SDK_EXECUTABLE %s -> %s\n' "$bin" "$(realpath -e "$bin")"
          done
          "$adb_bin" version
          cat /etc/os-release
          qemu="$sdk/emulator/qemu/linux-x86_64/qemu-system-x86_64"
          test -x "$qemu"
          test -s "$sdk/emulator/source.properties"
          cat "$sdk/emulator/source.properties"
          sha256sum "$emu" "$qemu"
          file "$qemu"
          # Use only the official SDK's bundled library directories when inspecting
          # its ELF dependencies; the actual emulator launcher sets its own paths.
          bundled="$sdk/emulator/lib64:$sdk/emulator/lib64/qt/lib:$sdk/emulator/lib64/gles_swiftshader:$sdk/emulator/lib64/vulkan"
          scan_loader() {
            env LD_LIBRARY_PATH="$bundled" ldd "$qemu" | tee "$1"
          }
          scan_loader "$RUNNER_TEMP/mpv-qemu-before.txt"
          # Resolve only observed missing SONAMEs using the official Ubuntu 24.04
          # apt packages. Unknown dependencies fail rather than using a fake library.
          declare -A packages=(
            [libpulse.so.0]=libpulse0 [libasound.so.2]=libasound2t64
            [libGL.so.1]=libgl1 [libEGL.so.1]=libegl1 [libGLX.so.0]=libglx0
            [libOpenGL.so.0]=libopengl0 [libdrm.so.2]=libdrm2 [libgbm.so.1]=libgbm1
            [libX11.so.6]=libx11-6 [libX11-xcb.so.1]=libx11-xcb1
            [libxcb.so.1]=libxcb1 [libxcb-glx.so.0]=libxcb-glx0
            [libxcb-shm.so.0]=libxcb-shm0 [libxcb-xfixes.so.0]=libxcb-xfixes0
            [libXext.so.6]=libxext6 [libXi.so.6]=libxi6 [libXrender.so.1]=libxrender1
            [libXfixes.so.3]=libxfixes3 [libXcursor.so.1]=libxcursor1
            [libXrandr.so.2]=libxrandr2 [libXinerama.so.1]=libxinerama1
            [libxkbcommon.so.0]=libxkbcommon0 [libxkbcommon-x11.so.0]=libxkbcommon-x11-0
            [libnss3.so]=libnss3 [libnspr4.so]=libnspr4 [libfontconfig.so.1]=libfontconfig1
            [libfreetype.so.6]=libfreetype6 [libdbus-1.so.3]=libdbus-1-3
            [libglib-2.0.so.0]=libglib2.0-0t64 [libudev.so.1]=libudev1
          )
          mapfile -t missing < <(awk '$2=="=>" && $3=="not" && $4=="found" {print $1}' "$RUNNER_TEMP/mpv-qemu-before.txt" | sort -u)
          install=()
          for soname in "${missing[@]}"; do
            package="${packages[$soname]:-}"
            if test -z "$package"; then echo "Unmapped loader dependency: $soname" >&2; exit 1; fi
            install+=("$package")
          done
          if (( ${#install[@]} )); then
            sudo apt-get update
            apt-cache policy "${install[@]}"
            sudo apt-get install -y --no-install-recommends "${install[@]}"
            dpkg-query -W -f='${Package} ${Version}\n' "${install[@]}"
          fi
          scan_loader "$RUNNER_TEMP/mpv-qemu-after.txt"
          if grep -F 'not found' "$RUNNER_TEMP/mpv-qemu-after.txt"; then exit 1; fi
          "$emu" -version
          echo PASS_OFFICIAL_QEMU_LOADER
          test -s "$sdk/system-images/android-34/default/x86_64/source.properties"
          cat "$sdk/system-images/android-34/default/x86_64/source.properties"
          export ANDROID_USER_HOME="$RUNNER_TEMP/mpv-probe-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/mpv-probe-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          avd_dir="$ANDROID_AVD_HOME/mpv-probe.avd"
          printf 'ANDROID_USER_HOME=%s\nANDROID_EMULATOR_HOME=%s\nANDROID_AVD_HOME=%s\nMPV_PROBE_ADB=%s\nMPV_PROBE_EMULATOR=%s\n' \
            "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME" "$ANDROID_AVD_HOME" "$adb_bin" "$emu" >> "$GITHUB_ENV"
          printf 'AVD_HOME=%s AVD_PATH=%s\n' "$ANDROID_AVD_HOME" "$avd_dir"
          printf 'no\n' | "$avdmanager" create avd --force --name mpv-probe --package 'system-images;android-34;default;x86_64' --path "$avd_dir" --device pixel_2
          test -s "$ANDROID_AVD_HOME/mpv-probe.ini"
          test -s "$avd_dir/config.ini"
          grep -Fx "path=$avd_dir" "$ANDROID_AVD_HOME/mpv-probe.ini"
          cat "$ANDROID_AVD_HOME/mpv-probe.ini"
          grep -E '^(abi.type|image.sysdir.1|hw.device.name|tag.id)=' "$avd_dir/config.ini"
          "$avdmanager" list avd
          grep -Fx "abi.type=x86_64" "$avd_dir/config.ini"
          "$emu" -list-avds | tee "$RUNNER_TEMP/mpv-avd-list.txt"
          grep -Fx mpv-probe "$RUNNER_TEMP/mpv-avd-list.txt"
          echo PASS_ANDROID_AVD_CREATED_AND_DISCOVERABLE
      - name: Boot official SDK x86_64 emulator
        shell: bash
        run: |
          set -euo pipefail
          test -x "$MPV_PROBE_ADB"
          test -x "$MPV_PROBE_EMULATOR"
          test -s "$ANDROID_AVD_HOME/mpv-probe.ini"
          test -s "$ANDROID_AVD_HOME/mpv-probe.avd/config.ini"
          "$MPV_PROBE_EMULATOR" -list-avds | grep -Fx mpv-probe
          # Never change /dev/kvm permissions or runner groups.
          accel=off
          if test -c /dev/kvm && test -r /dev/kvm && test -w /dev/kvm; then
            if "$MPV_PROBE_EMULATOR" -accel-check; then accel=on; fi
          fi
          if test -e /dev/kvm; then stat -c 'KVM mode=%a owner=%U group=%G' /dev/kvm; fi
          # The official 37.3.10 binary explicitly requests this opt-in
          # for normal TCG when hardware acceleration is unavailable.
          # No host privilege, KVM mode/group, or executable is changed.
          if test "$accel" = off; then
            export ANDROID_I_WANT_MY_TCG=yes
          else
            unset ANDROID_I_WANT_MY_TCG
          fi
          id
          echo "EMULATOR_ACCEL=$accel ANDROID_I_WANT_MY_TCG=${ANDROID_I_WANT_MY_TCG:-unset}"
          "$MPV_PROBE_ADB" start-server
          "$MPV_PROBE_EMULATOR" -avd mpv-probe -port 5554 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -accel "$accel" -memory 2048 -no-metrics >"$RUNNER_TEMP/mpv-emulator.log" 2>&1 &
          pid=$!
          printf '%s\n' "$pid" >"$RUNNER_TEMP/mpv-emulator.pid"
          boot_budget=600
          if test "$accel" = off; then boot_budget=1200; fi
          echo "BOOT_BUDGET_SECONDS=$boot_budget"
          started=$SECONDS
          deadline=$((SECONDS+boot_budget))
          ready=0
          state=unknown
          next_report=$SECONDS
          while (( SECONDS < deadline )); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "emulator exited before boot" >&2
              tail -n 100 "$RUNNER_TEMP/mpv-emulator.log" >&2
              exit 1
            fi
            state="$(timeout 8 "$MPV_PROBE_ADB" -s emulator-5554 get-state 2>/dev/null || true)"
            if test "$state" = device; then
              ready="$(timeout 8 "$MPV_PROBE_ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if test "$ready" = 1; then break; fi
            fi
            if (( SECONDS >= next_report )); then
              echo "BOOT_PROGRESS elapsed=$((SECONDS-started)) state=$state boot_completed=$ready"
              next_report=$((SECONDS+60))
            fi
            sleep 5
          done
          if test "$ready" != 1; then
            echo "BOOT_TIMEOUT elapsed=$((SECONDS-started)) state=$state boot_completed=$ready" >&2
            tail -n 100 "$RUNNER_TEMP/mpv-emulator.log" >&2
            exit 1
          fi
          echo "BOOT_COMPLETED elapsed=$((SECONDS-started))"
          test "$(timeout 10 "$MPV_PROBE_ADB" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
          sdk_api="$(timeout 10 "$MPV_PROBE_ADB" -s emulator-5554 shell getprop ro.build.version.sdk | tr -d '\r')"
          abi="$(timeout 10 "$MPV_PROBE_ADB" -s emulator-5554 shell getprop ro.product.cpu.abi | tr -d '\r')"
          echo "ANDROID_DEVICE sdk=$sdk_api abi=$abi serial=emulator-5554"
          test "$sdk_api" = 34
          test "$abi" = x86_64
          timeout 30 "$MPV_PROBE_ADB" -s emulator-5554 shell wm dismiss-keyguard
          echo PASS_ANDROID_EMULATOR_BOOT
      - name: Compile actual isolated Android module and test APK
        working-directory: inputs/media
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4g -PexternalBuildDir="$RUNNER_TEMP/mpv-build" \
            :libass-reference-probe:assembleDebug :libass-reference-probe:assembleDebugAndroidTest
          find "$RUNNER_TEMP/mpv-build/libass-reference-probe/outputs/apk" -name '*.apk' -exec sha256sum {} +
          dir="$RUNNER_TEMP/mpv-build/libass-reference-probe/outputs/apk"
          appfile="$(find "$dir/debug" -name '*.apk')"
          testfile="$(find "$dir/androidTest/debug" -name '*.apk')"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$appfile"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$testfile"
          python3 - "$appfile" "$GITHUB_WORKSPACE/inputs/media/libass-reference-probe/src/main/jniLibs/x86_64" <<'PY'
          import sys, zipfile, pathlib, hashlib
          with zipfile.ZipFile(sys.argv[1]) as z:
              expected = {"lib/x86_64/"+p.name: p for p in pathlib.Path(sys.argv[2]).glob("*.so")}
              actual = {n for n in z.namelist() if n.startswith("lib/") and n.endswith(".so")}
              assert actual == expected.keys(), (actual,expected.keys())
              for n,p in expected.items():
                  assert z.getinfo(n).compress_type == zipfile.ZIP_STORED, n
                  assert hashlib.sha256(z.read(n)).hexdigest() == hashlib.sha256(p.read_bytes()).hexdigest(), n
          print("PASS_REFERENCE_APK_NATIVE_BYTES_ZIP_16K")
          PY
          echo PASS_REFERENCE_ANDROID_BUILD
      - name: Execute actual Android fontconfig writer, timing and scale caller
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/mpv-build/libass-reference-probe/outputs/apk"
          appfile="$(find "$dir/debug" -name '*.apk')"
          testfile="$(find "$dir/androidTest/debug" -name '*.apk')"
          test -f "$appfile"
          test -f "$testfile"
          "$MPV_PROBE_ADB" -s emulator-5554 install -t "$appfile"
          "$MPV_PROBE_ADB" -s emulator-5554 install -t "$testfile"
          "$MPV_PROBE_ADB" -s emulator-5554 logcat -c
          set +e
          timeout 480 "$MPV_PROBE_ADB" -s emulator-5554 shell am instrument -w -r -e class androidx.media3.exoplayer.libass.LibassFontTimingAndroidTest \
            org.fingmi.assprobe.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/mpv-instrumentation.txt"
          instrument_status=${PIPESTATUS[0]}
          set -e
          "$MPV_PROBE_ADB" -s emulator-5554 logcat -d -s AssFontTimingProbe:I AndroidRuntime:E '*:S' | tee "$RUNNER_TEMP/mpv-runtime.txt"
          test "$instrument_status" -eq 0
          grep -F 'OK (1 test)' "$RUNNER_TEMP/mpv-instrumentation.txt"
          ! grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' "$RUNNER_TEMP/mpv-instrumentation.txt"
          for marker in PASS_REFERENCE_TIMED_CHUNK PASS_REFERENCE_CONFIGURED_FAMILY_CHANGE PASS_REFERENCE_ORDINARY_FONT_SCALE PASS_REFERENCE_TIMED_EXPLICIT_GEOMETRY PASS_REFERENCE_FONT_TIMING_LIFETIME PASS_REFERENCE_FONTCONFIG_WRITER_SYSTEM_AND_EXTERNAL PASS_REFERENCE_ANDROID_FONT_TIMING_ONLY PASS_REFERENCE_FONT_FIXTURE_CLEANED; do
            grep -F "$marker" "$RUNNER_TEMP/mpv-runtime.txt"
          done
          echo PASS_REFERENCE_ANDROID_FONT_BATCH
      - name: Emulator diagnostics and cleanup
        if: always()
        shell: bash
        run: |
          if test -n "${MPV_PROBE_ADB:-}" && test -x "$MPV_PROBE_ADB"; then
            timeout 15 "$MPV_PROBE_ADB" -s emulator-5554 logcat -d -s AssFontTimingProbe:I AndroidRuntime:E '*:S' 2>/dev/null || true
            timeout 15 "$MPV_PROBE_ADB" -s emulator-5554 emu kill || true
          fi
          if test -f "$RUNNER_TEMP/mpv-emulator.log"; then tail -n 100 "$RUNNER_TEMP/mpv-emulator.log"; fi
          if test -f "$RUNNER_TEMP/mpv-emulator.pid"; then kill "$(cat "$RUNNER_TEMP/mpv-emulator.pid")" 2>/dev/null || true; fi
