name: Migrate build input and clean Actions storage

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-actions-storage.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYER_ARTIFACT_ID: "10859533459"
      PLAYER_ZIP_SHA256: "0ed42581af11ac7163ebde148b318807c244e2a318f40c41d33f50b70bf967ee"
      PLAYER_RELEASE_TAG: "build-inputs-5.6.3"
      PLAYER_RELEASE_ASSET: "fongmi-media3-aar-candidate-1.11.0.zip"
      KEEP_DEBUG_ARTIFACT_ID: "10971156322"

    steps:
      - name: Migrate long-lived player input to project Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$PLAYER_ARTIFACT_ID")"
          jq -e --arg sha "sha256:$PLAYER_ZIP_SHA256" '
            .id == 10859533459 and
            .name == "fongmi-media3-aar-candidate-1.11.0" and
            .expired == false and
            .size_in_bytes == 44336768 and
            .digest == $sha
          ' <<< "$meta" >/dev/null

          curl -fL --retry 3             -H "Authorization: Bearer ${GH_TOKEN}"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$PLAYER_ARTIFACT_ID/zip"             -o "$PLAYER_RELEASE_ASSET"
          echo "$PLAYER_ZIP_SHA256  $PLAYER_RELEASE_ASSET" | sha256sum -c -

          if ! gh release view "$PLAYER_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$PLAYER_RELEASE_TAG"               --repo "$GITHUB_REPOSITORY"               --prerelease               --title "FingMi-Xray 5.6.3 build inputs"               --notes "Pinned long-lived build inputs for reproducible current-main Android TV builds."
          fi

          gh release upload "$PLAYER_RELEASE_TAG" "$PLAYER_RELEASE_ASSET"             --repo "$GITHUB_REPOSITORY"             --clobber

          mkdir -p verify-release
          gh release download "$PLAYER_RELEASE_TAG"             --repo "$GITHUB_REPOSITORY"             --pattern "$PLAYER_RELEASE_ASSET"             --dir verify-release
          echo "$PLAYER_ZIP_SHA256  verify-release/$PLAYER_RELEASE_ASSET" | sha256sum -c -

      - name: Remove obsolete Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          deleted=0
          reclaimed=0
          while IFS=$'\t' read -r id name size; do
            [ -n "$id" ] || continue
            if [ "$id" = "$KEEP_DEBUG_ARTIFACT_ID" ]; then
              echo "KEEP $id $name $size"
              continue
            fi
            case "$name" in
              fingmi-xray-5.6.3-current-main-debug|fingmi-xray-5.6.3-build-failure-reports)
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
                echo "DELETE $id $name $size"
                deleted=$((deleted + 1))
                reclaimed=$((reclaimed + size))
                ;;
            esac
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"               --jq '.artifacts[] | [.id, .name, .size_in_bytes] | @tsv'
          )

          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$PLAYER_ARTIFACT_ID"
          echo "DELETE long-lived Actions copy $PLAYER_ARTIFACT_ID after Release verification"
          echo "deleted_ephemeral=$deleted"
          echo "reported_reclaimed_bytes=$reclaimed"
