name: F2 - pinned ARM64 shaderc and libplacebo base only

on:
  push:
    branches: [dev/fongmi-upstream-adaptation]
    paths: [.github/workflows/108-arm64-renderer-base-once.yml]

permissions:
  contents: read

concurrency:
  group: f2-arm64-renderer-base-108
  cancel-in-progress: false

jobs:
  renderer-base:
    if: >-
      github.repository == 'rileyaaa/FingMi-Xray' &&
      github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' &&
      github.event_name == 'push' &&
      github.event.before == '8e010e3b9ef9b5a7ef5c7bc1c9e1399d586ecbd7' &&
      github.run_attempt == '1' &&
      !github.event.deleted &&
      !github.event.forced &&
      github.event.head_commit.message == 'ci: verify pinned arm64 renderer base once'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Read exact event commit and direct parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          fetch-tags: false
          lfs: false
          submodules: false
          path: f2-event
          sparse-checkout: |
            /.github/workflows/108-arm64-renderer-base-once.yml
          sparse-checkout-cone-mode: false
      - name: Build and audit ARM64 renderer base only
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          unset GH_TOKEN GITHUB_TOKEN
          work=$(mktemp -d "$RUNNER_TEMP/f2-108-XXXXXX")
          summary="$GITHUB_STEP_SUMMARY"
          phase=trigger
          finish() {
            rc=$?
            trap - EXIT
            if [ "$rc" != 0 ] && [ "$phase" = build ] && [ -f "$work/build.log" ]; then
              tail -n 12 "$work/build.log" | cut -c1-240 | tee -a "$summary"
            fi
            rm -rf -- "$work" || rc=1
            if [ "$rc" = 0 ] && [ "$phase" = complete ]; then
              echo 'RESULT=PASS_ARM64_LIBPLACEBO_SHADERC' | tee -a "$summary"
            else
              printf 'FAILED_PHASE=%s\nRESULT=FAIL_OR_INCOMPLETE\n' "$phase" | tee -a "$summary"
              rc=1
            fi
            exit "$rc"
          }
          trap finish EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf 'SCOPE=ARM64_LIBPLACEBO_SHADERC_ONLY\nAV3A=NOT_FETCHED\nUNIFIED_FFMPEG=NOT_BUILT\nMOTION_RECEIPT=NOT_BUILT\nFULL_RENDERER_SDK=NOT_BUILT\nARMV7=NOT_RUN\nMEDIA3_JNI=NOT_RUN\nPRODUCT_INTEGRATION=NOT_RUN\n' >> "$summary"

          export F2_EXPECTED_PARENT=8e010e3b9ef9b5a7ef5c7bc1c9e1399d586ecbd7
          export F2_WORKFLOW_PATH=.github/workflows/108-arm64-renderer-base-once.yml
          export F2_COMMIT_MESSAGE='ci: verify pinned arm64 renderer base once'
          export F2_EVENT_REPO="$GITHUB_WORKSPACE/f2-event"
          GIT_NO_LAZY_FETCH=1 python3 -I - <<'PY' >> "$summary"
          import json, os, re, subprocess
          from pathlib import Path

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def git(repo, *args):
              return subprocess.check_output(
                  ["git", "-C", str(repo), *args], timeout=20)

          def verify(e, env, repo, parent, path, message):
              require(env["GITHUB_EVENT_NAME"] == "push", "event")
              require(env["GITHUB_REPOSITORY"] ==
                      "rileyaaa/FingMi-Xray", "repository")
              require(env["GITHUB_REF"] == e["ref"] ==
                      "refs/heads/dev/fongmi-upstream-adaptation", "ref")
              require(env["GITHUB_RUN_ATTEMPT"] == "1", "attempt")
              require(e["forced"] is False and e["deleted"] is False,
                      "force/delete")

              before, after = e["before"], e["after"]
              require(
                  before == parent
                  and bool(re.fullmatch(r"[0-9a-f]{40}", after))
                  and after == env["GITHUB_SHA"],
                  "event SHAs")

              h = e["head_commit"]
              require(h["id"] == after and h["message"] == message,
                      "head event")
              require(len(e["commits"]) == 1
                      and e["commits"][0]["id"] == after,
                      "event commit count")
              require(git(repo, "rev-parse", "HEAD").decode().strip() == after,
                      "checked-out commit")

              raw = git(repo, "cat-file", "commit", after)
              header, body = raw.split(b"\n\n", 1)
              require(
                  [l[7:].decode() for l in header.splitlines()
                   if l.startswith(b"parent ")] == [before],
                  "actual direct parent")
              require(body.rstrip(b"\n") == message.encode(),
                      "actual commit message")
              require(git(repo, "cat-file", "-t", before) == b"commit\n",
                      "parent available")

              diff = git(
                  repo, "diff-tree", "--no-commit-id",
                  "--name-status", "-z", "-r", "--no-renames",
                  "--ignore-submodules=none", before, after)
              require(diff == b"A\0" + path.encode() + b"\0",
                      "actual diff")

              tree = git(repo, "ls-tree", "-z", after, "--", path)
              require(bool(re.fullmatch(
                  rb"100644 blob [0-9a-f]{40}\t"
                  + re.escape(path.encode()) + rb"\0", tree)),
                  "ordinary workflow blob")

          verify(
              json.load(open(os.environ["GITHUB_EVENT_PATH"])),
              os.environ,
              Path(os.environ["F2_EVENT_REPO"]),
              os.environ["F2_EXPECTED_PARENT"],
              os.environ["F2_WORKFLOW_PATH"],
              os.environ["F2_COMMIT_MESSAGE"])

          print("TRIGGER_GIT_DIFF=PASS")
          PY

          # Only the runner's pinned preinstalled NDK; no SDK installs or license acceptance.
          phase=ndk
          sdk="${ANDROID_HOME:?ANDROID_HOME missing}"
          ndk="$sdk/ndk/30.0.16248370"
          shaderc="$ndk/sources/third_party/shaderc"
          llvm="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          wrapper=libshaderc_util/src/spirv_tools_wrapper.cc
          original=f6478d8d386226589f7bfb68f624681835dd4c1ce33fbce2654bb5c3a2bde5e2
          patched=1dd414a1b1696d76916db8aaf1d8c781c8e7e6238d27d7442a30fda789c1b034
          for tool in git python3 curl sha256sum ninja pkg-config patch make sed install find sort xargs timeout cmp; do
            command -v "$tool" >/dev/null
          done
          for tool in aarch64-linux-android24-clang aarch64-linux-android24-clang++ llvm-ar llvm-ranlib llvm-readelf llvm-nm; do
            test -x "$llvm/$tool"
          done
          test -x "$ndk/ndk-build"
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*30\.0\.16248370$' "$ndk/source.properties"
          test -s "$ndk/NOTICE"
          test -s "$ndk/NOTICE.toolchain"
          printf '%s  %s\n' "$original" "$shaderc/$wrapper" | sha256sum -c -
          for f in Android.mk CHANGES; do test -s "$shaderc/$f"; done
          for d in libshaderc libshaderc_util third_party utils; do test -d "$shaderc/$d"; done
          ndk_source_sha() (
            cd "$shaderc"
            test -z "$(find Android.mk CHANGES libshaderc libshaderc_util third_party utils -type l -print -quit)"
            find Android.mk CHANGES libshaderc libshaderc_util third_party utils -type f -print0 \
              | LC_ALL=C sort -z | xargs -0 -r sha256sum --binary | sed 's/ \*/  /' \
              | sha256sum | cut -d ' ' -f 1
          )
          ndk_before=$(ndk_source_sha)
          notice_before=$(sha256sum "$ndk/NOTICE" "$ndk/NOTICE.toolchain")
          printf 'NDK=30.0.16248370\nANDROID_API=24\nNDK_SHADERC_SOURCE_MANIFEST_SHA256=%s\nNDK_NOTICE_SHA256=%s\nNDK_TOOLCHAIN_NOTICE_SHA256=%s\n' \
            "$ndk_before" "$(sha256sum "$ndk/NOTICE" | cut -d' ' -f1)" "$(sha256sum "$ndk/NOTICE.toolchain" | cut -d' ' -f1)" >> "$summary"
          printf 'HOST_PYTHON=%s\nNINJA=%s\nPKG_CONFIG=%s\n' "$(python3 --version)" "$(ninja --version)" "$(pkg-config --version)" >> "$summary"

          phase=sources
          producer="$work/producer"
          lp="$producer/buildscripts/deps/libplacebo"
          export GIT_LFS_SKIP_SMUDGE=1
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          : > "$work/pins.tsv"
          : > "$work/licenses.tsv"
          fetch_exact() {
            local label=$1 url=$2 commit=$3 tree=$4 dest=$5 rc
            git init -q "$dest"
            git -C "$dest" remote add origin "$url"
            timeout 60s git -C "$dest" -c credential.helper= fetch --quiet \
              --depth=1 --no-tags --no-recurse-submodules origin "$commit"
            git -C "$dest" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dest" rev-parse HEAD)" = "$commit"
            test "$(git -C "$dest" rev-parse HEAD^{tree})" = "$tree"
            test -z "$(git -C "$dest" status --porcelain --untracked-files=all)"
            # Inspect tracked Git blobs, including actual pointer headers, without fetching LFS.
            if git -C "$dest" grep -I -l -x -F 'version https://git-lfs.github.com/spec/v1' HEAD -- > "$work/lfs-check"; then
              echo "Unexpected LFS pointer in $label" >&2
              return 1
            else
              rc=$?
              test "$rc" = 1
            fi
            printf '%s\t%s\t%s\n' "$label" "$commit" "$tree" >> "$work/pins.tsv"
          }
          require_blob() {
            local label=$1 repo=$2 rel=$3 expected=$4
            test -s "$repo/$rel"
            test "$(git -C "$repo" rev-parse "HEAD:$rel")" = "$expected"
            test "$(git hash-object "$repo/$rel")" = "$expected"
            printf '%s/%s\t%s\n' "$label" "$rel" "$(sha256sum "$repo/$rel" | cut -d' ' -f1)" >> "$work/licenses.tsv"
          }
          no_gitlinks() {
            local rows
            rows=$(git -C "$1" ls-tree -r HEAD)
            if grep -q '^160000 ' <<< "$rows"; then
              echo "Unexpected nested gitlink" >&2
              return 1
            fi
          }
          fetch_exact producer https://github.com/FongMi/mpv-android.git \
            1bf892e3271e73d8649f2d209027f1fb17515d15 2c1dba848427d098ba9bf8ab7e86d5308a85e1e7 "$producer"
          no_gitlinks "$producer"
          require_blob producer "$producer" LICENSE 81d2ff31ab3e434d6f67fa5ac1e15e345f175db6
          patchfile="$producer/buildscripts/patches/shaderc-r30-validator-friendly-names.patch"
          test "$(git hash-object "$patchfile")" = cdadcec79a53f9f17269e5a24dacb42bea9f1056
          mkdir -p "$producer/buildscripts/deps"
          fetch_exact libplacebo https://github.com/FongMi/libplacebo.git \
            dc98e2fceb82233b3bb75e9c6249e581c57f3f2d 9062af39bd52427409f04418ead256aaa6bfae03 "$lp"
          require_blob libplacebo "$lp" LICENSE 20fb9c7da21cb5a29e10f614a03661a935181652
          test "$(git hash-object "$lp/.gitmodules")" = 3245c2120aa6339799e1eb5cabdd2885ecbbbf1c
          # Exact gitlink set checked before any submodule fetch. No floating branches.
          cat > "$work/submodules.tsv" <<'PINS'
          3rdparty/Vulkan-Headers https://github.com/KhronosGroup/Vulkan-Headers.git 74d8a6cb930c68ef617b202c3ff3c59d919e086b 2601bf086adb8bcecd6b2a254338d1062027d526
          3rdparty/fast_float https://github.com/fastfloat/fast_float.git 97b54ca9e75f5303507699d27c6b4f4efe4641a1 ddba8c52570b3fb36fbf13fe8864f46f128567af
          3rdparty/glad https://github.com/Dav1dde/glad.git 73db193f853e2ee079bf3ca8a64aa2eaf6459043 ee6498929fd8531f2943c18abd274dc76b0f8857
          3rdparty/jinja https://github.com/pallets/jinja.git 15206881c006c79667fe5154fe80c01c65410679 e200557b4756d9367d7a08930480efe5ad867bc5
          3rdparty/markupsafe https://github.com/pallets/markupsafe.git 297fc8e356e6836a62087949245d09a28e9f1b13 f6cc9d32027d928d7306c3d15e4f9e1653d6de62
          demos/3rdparty/nuklear https://github.com/Immediate-Mode-UI/Nuklear.git 242f35efa067a46c595645eeda7b1771ea1f83b1 3dd571d1374c261646ac15926669491b7f73b379
          PINS
          python3 -I - "$lp" "$work/submodules.tsv" <<'PY'
          import subprocess, sys
          from pathlib import Path
          repo, pins = sys.argv[1:]
          rows = [line.split() for line in Path(pins).read_text().splitlines()]
          assert len(rows) == 6
          expected = {path: commit for path, url, commit, tree in rows}
          actual = {}
          for entry in subprocess.check_output(['git','-C',repo,'ls-tree','-r','-z','HEAD']).split(b'\0'):
              if not entry:
                  continue
              meta, path = entry.split(b'\t',1)
              mode, typ, sha = meta.split()
              if mode == b'160000':
                  assert typ == b'commit'
                  actual[path.decode()] = sha.decode()
          assert actual == expected, 'gitlink set drift'
          PY
          git -C "$lp" submodule init > /dev/null
          while read -r path url commit tree; do
            fetch_exact "$path" "$url" "$commit" "$tree" "$lp/$path"
            no_gitlinks "$lp/$path"
          done < "$work/submodules.tsv"
          # Each child is independently checked out at the exact gitlink. Normalize the
          # isolated repositories using Git's standard submodule metadata operation.
          git -C "$lp" submodule absorbgitdirs
          status=$(git -C "$lp" submodule status --recursive)
          test "$(printf '%s\n' "$status" | wc -l)" -eq 6
          if grep -Eq '^[-+U]' <<< "$status"; then exit 1; fi
          test -z "$(git -C "$lp" status --porcelain --untracked-files=all --ignore-submodules=none)"
          require_blob Vulkan-Headers "$lp/3rdparty/Vulkan-Headers" LICENSE.md d6a0648b652ade1defb1eb481643d2f8d14828b5
          require_blob Vulkan-Headers "$lp/3rdparty/Vulkan-Headers" LICENSES/Apache-2.0.txt d645695673349e3947e8e5ae42332d0ac3164cd7
          require_blob Vulkan-Headers "$lp/3rdparty/Vulkan-Headers" LICENSES/MIT.txt 8495fe9e901b430947d54980af7c77c0bb8a6221
          require_blob fast_float "$lp/3rdparty/fast_float" LICENSE-APACHE 26f4398f24999c3908a11653e3b5ba6f9d681123
          require_blob fast_float "$lp/3rdparty/fast_float" LICENSE-BOOST 127a5bc39ba030c7cb99cc0aedc4f280ffe27310
          require_blob fast_float "$lp/3rdparty/fast_float" LICENSE-MIT 2fb2a37ad7fda521092c8b7b16911176c3f8a81b
          require_blob glad "$lp/3rdparty/glad" LICENSE 4965a6bffc963db608b12cbb91906d029abc3fc6
          require_blob jinja "$lp/3rdparty/jinja" LICENSE.txt c37cae49ec77ad6ebb25568c1605f1fee5313cfb
          require_blob markupsafe "$lp/3rdparty/markupsafe" LICENSE.txt 9d227a0cc43c3268d15722b763bd94ad298645a1
          require_blob nuklear "$lp/demos/3rdparty/nuklear" LICENSE 0ffdc185518955fa7e40d5c56cd3dfe72e7401ac
          printf 'SOURCE_PINS_VERIFIED=PASS\nPRODUCER_COMMIT=1bf892e3271e73d8649f2d209027f1fb17515d15\nLIBPLACEBO_COMMIT=dc98e2fceb82233b3bb75e9c6249e581c57f3f2d\nSOURCE_SET_SHA256=%s\nSOURCE_LICENSE_FILES=%s\nSOURCE_LICENSE_SET_SHA256=%s\nLFS_POINTERS=0\nGITLINKS_VERIFIED=6\n' \
            "$(LC_ALL=C sort "$work/pins.tsv" | sha256sum | cut -d' ' -f1)" \
            "$(wc -l < "$work/licenses.tsv")" \
            "$(LC_ALL=C sort "$work/licenses.tsv" | sha256sum | cut -d' ' -f1)" >> "$summary"

          # The producer's successful run used Meson 1.12.1. Runner inventory does not
          # establish Meson availability. Use only this official, hash-pinned wheel.
          phase=meson
          wheel="$work/meson-1.12.1-py3-none-any.whl"
          url=https://files.pythonhosted.org/packages/57/99/36cd25f9598eef70db97577440a70a360af505f6f01c2338a18d1556079c/meson-1.12.1-py3-none-any.whl
          wheelsha=930bc7542cbd9f57009e182fd014eba48cf1a0180a7b9006d2d32d8f168d8b02
          curl -q -fsS --retry 0 --connect-timeout 10 --max-time 60 --proto '=https' "$url" -o "$wheel"
          printf '%s  %s\n' "$wheelsha" "$wheel" | sha256sum -c -
          python3 -I - "$wheel" <<'PY' >> "$summary"
          import email, hashlib, sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as z:
              names=z.namelist()
              assert len(names)==len(set(names)) and z.testzip() is None
              d='meson-1.12.1.dist-info/'
              m=email.message_from_bytes(z.read(d+'METADATA'))
              assert m['Name'].lower()=='meson' and m['Version']=='1.12.1'
              notices=[n for n in names if n.startswith(d) and n.endswith('/COPYING')]
              assert len(notices)==1
              notice=z.read(notices[0])
              assert b'Apache License' in notice
              print('MESON_LICENSE_SHA256='+hashlib.sha256(notice).hexdigest())
          PY
          python3 -m venv "$work/meson-venv"
          "$work/meson-venv/bin/python" -m pip --isolated install --no-index --no-deps \
            --disable-pip-version-check --no-cache-dir "$wheel" > "$work/meson-install.log" 2>&1
          export PATH="$work/meson-venv/bin:$PATH"
          test "$(meson --version)" = 1.12.1
          printf 'MESON=1.12.1\nMESON_WHEEL_SHA256=%s\n' "$wheelsha" >> "$summary"

          # No download.sh, download-sdk.sh, download-deps.sh base, FFmpeg or MPV.
          phase=build
          cd "$producer/buildscripts"
          mkdir -p sdk deps/shaderc
          ln -s "$ndk" sdk/android-ndk-r30
          export cores=2
          # buildall.sh selects the original arm64 API24 compiler, 16KiB flags,
          # static prefix and Meson wrap_mode=nodownload. libplacebo's own GLAD
          # command uses --reproducible with the pinned local submodules.
          timeout --kill-after=15s 18m ./buildall.sh --arch arm64 libplacebo > "$work/build.log" 2>&1
          prefix="$PWD/prefix/arm64"
          test ! -e prefix/armv7l
          test ! -e deps/ffmpeg
          test ! -e deps/mpv
          test ! -e "$prefix/lib/libffmpeg.so"
          test ! -e "$prefix/lib/libmpv-motion.a"

          phase=audit
          # Confirm the pinned NDK source was not changed and private patch is real.
          test "$(ndk_source_sha)" = "$ndk_before"
          test "$(sha256sum "$ndk/NOTICE" "$ndk/NOTICE.toolchain")" = "$notice_before"
          printf '%s  %s\n' "$patched" "$PWD/deps/shaderc/_source_arm64-v8a/$wrapper" | sha256sum -c -
          patch --batch --reverse --fuzz=0 --dry-run \
            -d "$PWD/deps/shaderc/_source_arm64-v8a" -p1 < "$patchfile" >/dev/null
          cmp -s "$lp/LICENSE" "$prefix/share/licenses/libplacebo/LICENSE"
          # Ensure tracked source files (including submodules) remain unchanged.
          test "$(git -C "$producer" rev-parse HEAD)" = 1bf892e3271e73d8649f2d209027f1fb17515d15
          test "$(git -C "$lp" rev-parse HEAD)" = dc98e2fceb82233b3bb75e9c6249e581c57f3f2d
          git -C "$producer" diff --quiet HEAD --
          git -C "$lp" diff --quiet --ignore-submodules=untracked HEAD --
          while read -r path url commit tree; do
            test "$(git -C "$lp/$path" rev-parse HEAD)" = "$commit"
            git -C "$lp/$path" diff --quiet HEAD --
          done < "$work/submodules.tsv"
          config="$prefix/include/libplacebo/config.h"
          grep -Eq '^#define PL_API_VER 399([[:space:]]|$)' "$config"
          for macro in OPENGL VULKAN SHADERC; do
            grep -Eq "^#define PL_HAVE_${macro} 1([[:space:]]|$)" "$config"
          done
          for macro in CUSTOM_FRAME_MIXER SOURCE_PEAK_TIMELINE SOURCE_PEAK_IMAGE SOURCE_HOOK_PARAMETERS FRAME_SHADER_MIXER; do
            grep -Eq "^#define PL_HAVE_${macro} 1([[:space:]]|$)" "$prefix/include/libplacebo/renderer.h"
          done
          grep -Eq '^#define PL_HAVE_HDR_LINEAR 1([[:space:]]|$)' "$prefix/include/libplacebo/colorspace.h"
          grep -Eq '^#define PL_HAVE_DISPATCH_PREPARED 1([[:space:]]|$)' "$prefix/include/libplacebo/dispatch.h"
          grep -Fq 'bool external_yuv;' "$prefix/include/libplacebo/opengl.h"
          for decl in 'bool disable_storage;' 'struct pl_vulkan_ycbcr_params {' 'const struct pl_vulkan_ycbcr_params *ycbcr;'; do
            grep -Fq "$decl" "$prefix/include/libplacebo/vulkan.h"
          done
          grep -Fq 'pl_map_avframe_dovi_metadata(' "$prefix/include/libplacebo/utils/libav.h"
          printf 'LIBPLACEBO_API=399\nOPENGL=1\nVULKAN=1\nSHADERC=1\nRENDERER_HEADER_CAPABILITIES=PASS\nNDK_SOURCE_UNCHANGED=PASS\nSHADERC_PRIVATE_PATCH_SHA256=%s\n' "$patched" >> "$summary"
          header_sha() (
            cd "$prefix/include"
            find "$1" -type f -print0 | LC_ALL=C sort -z \
              | xargs -0 -r sha256sum --binary | sed 's/ \*/  /' | sha256sum | cut -d' ' -f1
          )
          test -s "$prefix/include/shaderc/shaderc.h"
          test -s "$prefix/include/libplacebo/renderer.h"
          printf 'LIBPLACEBO_HEADERS_SHA256=%s\nSHADERC_HEADERS_SHA256=%s\n' \
            "$(header_sha libplacebo)" "$(header_sha shaderc)" >> "$summary"

          python3 -I - "$prefix" "$llvm" <<'PY' >> "$summary"
          import hashlib, re, subprocess, sys
          from pathlib import Path
          p, llvm=map(Path,sys.argv[1:])
          def run(tool,*args):
              return subprocess.check_output([str(llvm/tool),*map(str,args)],text=True,timeout=60)
          for stem,required in [
              ('shaderc',{'shaderc_compiler_initialize','shaderc_compile_into_spv','shaderc_compiler_release'}),
              ('placebo',{'pl_log_create_399','pl_opengl_create','pl_vulkan_create','pl_renderer_create'}),
          ]:
              a=p/'lib'/('lib'+stem+'.a')
              data=a.read_bytes()
              assert data.startswith(b'!<arch>\n'), 'not a normal archive'
              members=run('llvm-ar','t',a).splitlines()
              assert members, 'empty archive'
              elf=run('llvm-readelf','-h',a)
              classes=re.findall(r'^\s*Class:\s*(\S+)',elf,re.M)
              machines=re.findall(r'^\s*Machine:\s*(.+?)\s*$',elf,re.M)
              types=re.findall(r'^\s*Type:\s*(\S+)',elf,re.M)
              assert len(classes)==len(members)==len(machines)==len(types), 'not every member audited'
              assert set(classes)=={'ELF64'} and set(machines)=={'AArch64'} and set(types)=={'REL'}, 'non-AArch64 ELF relocatable member'
              symbols=run('llvm-nm','--defined-only','--extern-only','--format=posix',a)
              actual={line.split()[0] for line in symbols.splitlines() if len(line.split())>=3 and line.split()[1] in ('T','W')}
              assert required <= actual, (stem,sorted(required-actual))
              label='LIB'+stem.upper()
              print(f'{label}_BYTES={len(data)}')
              print(f'{label}_SHA256={hashlib.sha256(data).hexdigest()}')
              print(f'{label}_AARCH64_REL_MEMBERS={len(members)}')
              print(f'{label}_REQUIRED_SYMBOLS=PASS')
          PY
          phase=complete
