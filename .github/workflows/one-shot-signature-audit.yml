name: One-shot APK signature audit

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Download golden and test APKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit
          gh release download v5.6.0-xray.5 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir audit/golden
          gh release download v5.6.3-xray.test.5 --repo "$GITHUB_REPOSITORY" --pattern '*armeabi-v7a.apk' --dir audit/test
      - name: Print signer certificates
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          for apk in audit/golden/*.apk audit/test/*.apk; do
            echo "===== $apk ====="
            "$apksigner" verify --print-certs "$apk" | grep -E 'Signer #1 certificate (DN|SHA-256 digest|SHA-1 digest|MD5 digest)'
          done
