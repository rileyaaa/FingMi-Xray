name: Retire exact frozen branch after accepted unsigned handoff
on:
  push:
    branches: [dev/fongmi-upstream-adaptation]
    paths: ['.github/workflows/90-retire-frozen-validation.yml']
permissions: {}
concurrency:
  group: fingmi-exact-archive-maintenance
  cancel-in-progress: false
jobs:
  retire:
    if: github.repository == 'rileyaaa/FingMi-Xray' && github.ref == 'refs/heads/dev/fongmi-upstream-adaptation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact archive and unsigned artifact, then delete only frozen branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, tempfile
          repo = 'rileyaaa/FingMi-Xray'
          root = 'repos/' + repo
          main = '4a52de1daa465d81df7ac06e886a1f184053253c'
          frozen = '97a23d8fc2163c2c2b277e6c0e86a595a4638fa2'
          tree = '9a166475155cb5a897627fef6838f965e74afd5f'
          handoff = '4b3fa6fc481c8bf84b02026276abeb9f627813ff'
          artifact_id = 15001953802
          current = os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/dev/fongmi-upstream-adaptation'
          def api(path, *args):
              return json.loads(subprocess.check_output(['gh','api',root+path,*args],text=True))
          def ref(name):
              return api('/git/ref/'+name)['object']['sha']
          assert ref('heads/main') == main
          assert ref('heads/dev/fongmi-upstream-adaptation') == current
          assert ref('heads/dev/frozen-public-validation') == frozen
          change = api('/commits/'+current)
          assert [p['sha'] for p in change['parents']] == ['bc4471aa60abc88df8f1ac6515e913dd90c56e5a']
          expected = {'.github/workflows/01-当前源码编译与APK验证.yml','.github/workflows/04-frozen-signing-handoff.yml','.github/workflows/90-retire-frozen-validation.yml','docs/DEVELOPMENT.md','docs/AI_COLLABORATION.md','docs/PROJECT.md','docs/FROZEN_SIGNING_HANDOFF.md'}
          assert {f['filename'] for f in change['files']} == expected
          assert ref('tags/archive/frozen-public-validation-97a23d8') == frozen
          assert ref('tags/archive/fongmi-upstream-adaptation-e3fec17') == 'e3fec1778a2eb652fa276b6b147a4d133ce2e5db'
          assert ref('tags/archive/xray-core-stable-eb03202') == 'eb0320218901a5829e87e7085a9e312212766a0b'
          assert api('/git/commits/'+frozen)['tree']['sha'] == tree
          for run_id,head in [(45547887003,frozen),(45570721364,handoff)]:
              run=api('/actions/runs/'+str(run_id))
              assert (run['head_sha'],run['status'],run['conclusion']) == (head,'completed','success')
          a=api('/actions/artifacts/'+str(artifact_id))
          assert (a['id'],a['name'],a['expired'],a['size_in_bytes'],a['digest']) == (artifact_id,'unsigned-frozen-563002-45570721364',False,126799059,'sha256:35fbda2824f2770a5b63bba6134be62f7a95e15ded2e868c5e504c728a5a41d0')
          assert a['workflow_run']['id']==45570721364 and a['workflow_run']['head_sha']==handoff
          tag='tags/archive/frozen-signing-handoff-4b3fa6f'
          probe=subprocess.run(['gh','api',root+'/git/ref/'+tag],capture_output=True,text=True)
          if probe.returncode == 0:
              assert json.loads(probe.stdout)['object']['sha']==handoff
          else:
              assert 'HTTP 404' in probe.stderr
              assert api('/git/refs','--method','POST','-f','ref=refs/'+tag,'-f','sha='+handoff)['object']['sha']==handoff
          assert ref(tag)==handoff
          print('PASS exact source archive, successful handoff workflow archive, and live unsigned artifact',artifact_id,a['digest'])
          assert ref('heads/main')==main
          assert ref('heads/dev/fongmi-upstream-adaptation')==current
          assert ref('heads/dev/frozen-public-validation')==frozen
          with tempfile.TemporaryDirectory() as tmp:
              subprocess.run(['git','init','-q',tmp],check=True)
              subprocess.run(['git','-C',tmp,'config','credential.helper','!gh auth git-credential'],check=True)
              subprocess.run(['git','-C',tmp,'push','--force-with-lease=refs/heads/dev/frozen-public-validation:'+frozen,'https://github.com/'+repo+'.git',':refs/heads/dev/frozen-public-validation'],check=True)
          missing=subprocess.run(['gh','api',root+'/git/ref/heads/dev/frozen-public-validation'],capture_output=True,text=True)
          assert missing.returncode != 0 and 'HTTP 404' in missing.stderr
          assert ref('heads/main')==main
          assert ref('heads/dev/fongmi-upstream-adaptation')==current
          assert ref('tags/archive/frozen-public-validation-97a23d8')==frozen
          assert ref(tag)==handoff
          assert not api('/actions/artifacts/'+str(artifact_id))['expired']
          assert sorted(x['name'] for x in api('/branches?per_page=100'))==['dev/fongmi-upstream-adaptation','main']
          print('PASS exactly two branches; unsigned artifact retained; no build, signing or release')
          PY
