name: Candidate source boundary regression (one time)

on:
  push:
    branches: [dev/fongmi-upstream-adaptation]
    paths: [.github/workflows/113-candidate-source-boundary-once.yml]

permissions:
  contents: read

concurrency:
  group: fingmi-candidate-source-boundary-113
  cancel-in-progress: false

jobs:
  source-boundary:
    if: >-
      github.repository == 'rileyaaa/FingMi-Xray' &&
      github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' &&
      github.event_name == 'push' &&
      github.event.before == 'f8e1fcc7d89069e4f629f82d47767f9ee0ff0cfe' &&
      github.run_attempt == '1' &&
      !github.event.deleted && !github.event.forced &&
      github.event.head_commit.message == 'fix: stage candidate from tracked git objects'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          fetch-tags: false
          lfs: false
          submodules: false
          path: event
      - name: Verify exact event scope and audited bytes
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          base=f8e1fcc7d89069e4f629f82d47767f9ee0ff0cfe
          script=scripts/upstream-adaptation/prepare_candidate.py
          probe=scripts/upstream-adaptation/tests/test_candidate_source_boundary.py
          workflow=.github/workflows/113-candidate-source-boundary-once.yml
          test "$(git -C event rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C event rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $base"
          test "$(git -C event rev-parse "$base^{tree}")" = edb97fb227a0f45febf783cd7464d4b549cc53f3
          actual=$(git -C event diff-tree --no-commit-id --name-status --no-renames -r "$base" HEAD | LC_ALL=C sort)
          expected=$(printf 'A\t%s\nA\t%s\nM\t%s\n' "$workflow" "$probe" "$script" | LC_ALL=C sort)
          test "$actual" = "$expected"
          printf '%s\n' "$actual"
          test "$(git -C event rev-parse "$base:$script")" = 2b234019c352e7ce5ed0f2eda42b76fafbd1e50a
          test "$(git -C event rev-parse "HEAD:$script")" = 3d5b90296ef1fe40aa2e93f7418a4553cc8610a0
          test "$(git -C event rev-parse HEAD:.github/workflows/112-arm64-libxml2-ttml-once.yml)" = 2f92407cf14eb5a2092c20a0a4db2025cc32947f
          printf '%s  %s\n' \
            e8d70d2a10db053f91c2528b29ecee819dcd70f4ac5d25ce6ab57a84be58de37 "event/$script" \
            58ae83abf8e1184add9c3741b06646349bf4200aa6249557ea658cb7d03ab9d4 "event/$probe" | sha256sum -c -
          test ! -e event/signing
          git -C event worktree add --detach "$RUNNER_TEMP/fingmi-dev-base" "$base"
          test "$(git -C "$RUNNER_TEMP/fingmi-dev-base" rev-parse --is-shallow-repository)" = true
          git --version
          python3 --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FongMi/TV
          ref: c616c0aa3613e87529791587a9f71b78c278c991
          path: inputs/old-tv
          fetch-depth: 1
          persist-credentials: false
          fetch-tags: false
          lfs: false
          submodules: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FongMi/TV
          ref: d3a0b84b24cf6628d72a4dbc2be453875b005536
          path: inputs/tv
          fetch-depth: 1
          persist-credentials: false
          fetch-tags: false
          lfs: false
          submodules: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FongMi/media
          ref: 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
          path: inputs/media
          fetch-depth: 1
          persist-credentials: false
          fetch-tags: false
          lfs: false
          submodules: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FongMi/media
          ref: 2bc207851df311340767e913931ca7b28cab1794
          path: inputs/media-default
          fetch-depth: 1
          persist-credentials: false
          fetch-tags: false
          lfs: false
          submodules: false
      - name: Run exact source boundary comparison
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          python3 -I -B event/scripts/upstream-adaptation/tests/test_candidate_source_boundary.py \
            --dev "$RUNNER_TEMP/fingmi-dev-base" \
            --old-tv inputs/old-tv --tv inputs/tv \
            --media inputs/media --media-default inputs/media-default \
            --candidate event/scripts/upstream-adaptation/prepare_candidate.py
