name: Real Libass data and geometry subset
on:
  push:
    branches: [dev/fongmi-upstream-adaptation]
    paths: [.github/workflows/98-libass-data-once.yml]
permissions:
  contents: read
jobs:
  libass:
    if: >-
      github.repository == 'rileyaaa/FingMi-Xray' && github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' && github.event.head_commit.message == 'ci: validate real Libass data and geometry consumption'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: fork
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: libass/libass
          ref: a6613d2554daff9e1b5ddf2dbfb3fc31b61b9448
          path: inputs/libass
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/mpv-android
          ref: 1bf892e3271e73d8649f2d209027f1fb17515d15
          path: inputs/mpv
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Build pinned libass source and author's actual font-size patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C inputs/libass rev-parse HEAD)" = a6613d2554daff9e1b5ddf2dbfb3fc31b61b9448
          test "$(git -C inputs/mpv rev-parse HEAD)" = 1bf892e3271e73d8649f2d209027f1fb17515d15
          test "$(git -C inputs/libass hash-object libass/ass.h)" = 851ca7cb9614f8d5d3175bbcc2925dfb6521bc27
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config nasm libfreetype6-dev libfontconfig1-dev libfribidi-dev libharfbuzz-dev libunibreak-dev fonts-dejavu-core
          patch_file="$GITHUB_WORKSPACE/inputs/mpv/buildscripts/patches/libass-font-size-em.patch"
          echo 'fa6d0d3a00cb7896525a707407daad4d51e807d65d0692d6d33cc565d30ea9fa  '"$patch_file" | sha256sum -c -
          if patch --batch --forward --fuzz=0 --dry-run -d inputs/libass -p1 <"$patch_file"; then
            patch --batch --forward --fuzz=0 -d inputs/libass -p1 <"$patch_file"
          elif ! patch --batch --reverse --fuzz=0 --dry-run -d inputs/libass -p1 <"$patch_file"; then
            exit 1
          fi
          cd inputs/libass
          git diff --stat
          test -s COPYING
          echo 'f7e30699d02798351e7f839e3d3bfeb29ce65e44efa7735c225464c4fd7dfe9c  COPYING' | sha256sum -c -
          autoreconf -fi
          ./configure --prefix="$RUNNER_TEMP/ass-prefix" --with-pic --enable-shared --disable-static --enable-asm --enable-fontconfig --enable-libunibreak
          make -j2
          make install
          echo PASS_PINNED_LIBASS_HOST_BUILD
      - name: Execute NEW full-data, geometry and cache JNI methods
        shell: bash
        run: |
          set -euo pipefail
          base=fork/scripts/upstream-adaptation/libass-library-probe
          export PKG_CONFIG_PATH="$RUNNER_TEMP/ass-prefix/lib/pkgconfig"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/ass-prefix/lib"
          pkg-config --modversion libass
          pkg-config --variable=libdir libass
          test "$(pkg-config --variable=libdir libass)" = "$RUNNER_TEMP/ass-prefix/lib"
          mkdir "$RUNNER_TEMP/ass-probe"
          g++ -std=c++17 -Wall -Wextra -Werror -fPIC -shared -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            "$base/libass_library.cpp" $(pkg-config --cflags --libs libass) -o "$RUNNER_TEMP/ass-probe/libasslibraryprobe.so"
          ldd "$RUNNER_TEMP/ass-probe/libasslibraryprobe.so"
          ldd "$RUNNER_TEMP/ass-probe/libasslibraryprobe.so" | grep -F "$RUNNER_TEMP/ass-prefix/lib/libass"
          sha256sum "$RUNNER_TEMP/ass-probe/libasslibraryprobe.so"
          javac --release 8 -d "$RUNNER_TEMP/ass-probe" "$base/LibassNative.java" "$base/LibassLibraryProbe.java" "$base/LibassTrackProbe.java" "$base/LibassDataGeometryProbe.java"
          javap -s -classpath "$RUNNER_TEMP/ass-probe" androidx.media3.exoplayer.libass.LibassNative
          java -Xcheck:jni -cp "$RUNNER_TEMP/ass-probe" androidx.media3.exoplayer.libass.LibassDataGeometryProbe "$RUNNER_TEMP/ass-probe/libasslibraryprobe.so" /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          echo PASS_NEW_LIBASS_DATA_GEOMETRY_HOST_ONLY
