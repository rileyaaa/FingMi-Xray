name: Recovery APK analysis

on:
  push:
    paths:
      - ".github/workflows/recovery-apk-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      V7_APK_URL: https://github.com/rileyaaa/FingMi-Xray/releases/download/v5.6.0-xray.5/FongMi-Xray-TV-v5.6.0-xray.5-armeabi-v7a.apk
      V7_APK_SHA256: cacc7a90ce082adf955fc80a444b54f8cc86d5b5c3ac7acb13d1392b59928bda
      V8_APK_URL: https://github.com/rileyaaa/FingMi-Xray/releases/download/v5.6.0-xray.5/FongMi-Xray-TV-v5.6.0-xray.5-arm64-v8a.apk
      V8_APK_SHA256: b5ac05193c1e19809fc7ffb3048f7d75aaa2124eace9953d669f4a81a477c21d
      JADX_VERSION: 1.5.6
      JADX_SHA256: 545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974
      BAKSMALI_VERSION: 2.5.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download and verify published APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/work/apk
          curl -fL --retry 3 --retry-delay 2 "$V7_APK_URL" -o recovery/work/apk/fingmi-v7.apk
          curl -fL --retry 3 --retry-delay 2 "$V8_APK_URL" -o recovery/work/apk/fingmi-v8.apk
          echo "$V7_APK_SHA256  recovery/work/apk/fingmi-v7.apk" | sha256sum -c -
          echo "$V8_APK_SHA256  recovery/work/apk/fingmi-v8.apk" | sha256sum -c -

      - name: Download analysis tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/work/tools
          curl -fL --retry 3 --retry-delay 2             "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"             -o recovery/work/tools/jadx.zip
          echo "$JADX_SHA256  recovery/work/tools/jadx.zip" | sha256sum -c -
          unzip -q recovery/work/tools/jadx.zip -d recovery/work/tools/jadx
          chmod +x recovery/work/tools/jadx/bin/jadx

          curl -fL --retry 3 --retry-delay 2             "https://github.com/JesusFreke/smali/releases/download/v${BAKSMALI_VERSION}/baksmali-${BAKSMALI_VERSION}.jar"             -o recovery/work/tools/baksmali.jar

      - name: Compare APK and DEX contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/evidence/v7-dex recovery/evidence/v8-dex recovery/evidence/reports
          unzip -j recovery/work/apk/fingmi-v7.apk 'classes*.dex' -d recovery/evidence/v7-dex
          unzip -j recovery/work/apk/fingmi-v8.apk 'classes*.dex' -d recovery/evidence/v8-dex

          {
            echo "# v7 DEX SHA-256"
            sha256sum recovery/evidence/v7-dex/classes*.dex
            echo
            echo "# v8 DEX SHA-256"
            sha256sum recovery/evidence/v8-dex/classes*.dex
          } > recovery/evidence/reports/dex-sha256.txt

          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          root = Path("recovery/work/apk")
          apks = {"v7": root / "fingmi-v7.apk", "v8": root / "fingmi-v8.apk"}

          def inventory(path):
              result = {}
              with zipfile.ZipFile(path) as zf:
                  for info in zf.infolist():
                      if info.is_dir():
                          continue
                      with zf.open(info) as fp:
                          h = hashlib.sha256()
                          while True:
                              chunk = fp.read(1024 * 1024)
                              if not chunk:
                                  break
                              h.update(chunk)
                      result[info.filename] = {
                          "size": info.file_size,
                          "sha256": h.hexdigest(),
                      }
              return result

          inv = {name: inventory(path) for name, path in apks.items()}
          names = sorted(set(inv["v7"]) | set(inv["v8"]))
          diffs = []
          for name in names:
              a, b = inv["v7"].get(name), inv["v8"].get(name)
              if a != b:
                  if name.startswith("lib/"):
                      category = "native"
                  elif name.startswith("META-INF/"):
                      category = "signing"
                  elif name.startswith("classes") and name.endswith(".dex"):
                      category = "dex"
                  else:
                      category = "other"
                  diffs.append({"path": name, "category": category, "v7": a, "v8": b})

          summary = {
              "v7_entry_count": len(inv["v7"]),
              "v8_entry_count": len(inv["v8"]),
              "difference_count": len(diffs),
              "difference_categories": {
                  c: sum(1 for x in diffs if x["category"] == c)
                  for c in ("dex", "native", "signing", "other")
              },
              "differences": diffs,
          }
          out = Path("recovery/evidence/reports")
          (out / "apk-diff.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          with (out / "apk-diff.txt").open("w", encoding="utf-8") as fp:
              fp.write(json.dumps({k: v for k, v in summary.items() if k != "differences"}, indent=2))
              fp.write("\n\n")
              for item in diffs:
                  fp.write(f"[{item['category']}] {item['path']}\n")
          PY

      - name: Fully decompile v7 with JADX
        shell: bash
        run: |
          set -euo pipefail
          rm -rf recovery/evidence/jadx-v7
          set +e
          recovery/work/tools/jadx/bin/jadx             --deobf             --comments-level warn             -d recovery/evidence/jadx-v7             recovery/work/apk/fingmi-v7.apk
          status=$?
          set -e
          echo "JADX v7 exit code: $status" | tee recovery/evidence/reports/jadx-v7-status.txt
          test -d recovery/evidence/jadx-v7/sources

      - name: Extract targeted smali from v7 and v8
        shell: bash
        run: |
          set -euo pipefail
          targets='Lp000/a04; Lp000/th2; Lp000/nq0; Lp000/pz3; Lp000/or2; Lp000/yz3; Lp000/hz3; Lp000/lu2; Lp000/kz3; Lp000/j81; Lp000/x82; Lcom/fongmi/android/tv/xray/XrayService;'
          for abi in v7 v8; do
            mkdir -p "recovery/evidence/smali-${abi}"
            : > "recovery/evidence/reports/${abi}-class-location.txt"
            for dex in recovery/evidence/${abi}-dex/classes*.dex; do
              list="${dex}.classes"
              java -jar recovery/work/tools/baksmali.jar list classes "$dex" > "$list"
              match=0
              for target in $targets; do
                if grep -Fxq "$target" "$list"; then
                  echo "$target -> $(basename "$dex")" >> "recovery/evidence/reports/${abi}-class-location.txt"
                  match=1
                fi
              done
              if [ "$match" -eq 0 ]; then
                continue
              fi
              tmp="recovery/work/smali-${abi}-$(basename "$dex" .dex)"
              rm -rf "$tmp"
              java -jar recovery/work/tools/baksmali.jar disassemble "$dex" -o "$tmp"
              for rel in                 p000/a04.smali                 p000/th2.smali                 p000/nq0.smali                 p000/pz3.smali                 p000/or2.smali                 p000/yz3.smali                 p000/hz3.smali                 p000/lu2.smali                 p000/kz3.smali                 p000/j81.smali                 p000/x82.smali                 com/fongmi/android/tv/xray/XrayService.smali
              do
                if [ -f "$tmp/$rel" ]; then
                  mkdir -p "recovery/evidence/smali-${abi}/$(dirname "$rel")"
                  cp "$tmp/$rel" "recovery/evidence/smali-${abi}/$rel"
                fi
              done
              rm -rf "$tmp" "$list"
            done
          done

      - name: Upload v7 full JADX evidence
        uses: actions/upload-artifact@v4
        with:
          name: fingmi-v7-jadx-v5.6.0-xray.5
          path: recovery/evidence/jadx-v7
          retention-days: 3
          compression-level: 6

      - name: Upload dual-ABI DEX and smali evidence
        uses: actions/upload-artifact@v4
        with:
          name: fingmi-v7-v8-dex-smali-v5.6.0-xray.5
          path: |
            recovery/evidence/v7-dex
            recovery/evidence/v8-dex
            recovery/evidence/smali-v7
            recovery/evidence/smali-v8
            recovery/evidence/reports
          retention-days: 3
          compression-level: 6
