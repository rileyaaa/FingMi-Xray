name: Publish complete source backup ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/.trigger-source-backup-release

permissions:
  contents: write

jobs:
  source-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BACKUP_SOURCE_SHA: "3ca6dc2a8c4d0aed0cbe959be1737151ef0fea57"
      BACKUP_TAG: "source-backup-2026-10-02-main-3ca6dc2a"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3

      - name: Verify marker-only trigger and clean backup source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" != "$BACKUP_SOURCE_SHA"
          parent="$(git rev-parse "$GITHUB_SHA^")"
          source="$(git rev-parse "$GITHUB_SHA^^")"
          test "$source" = "$BACKUP_SOURCE_SHA"

          changed="$(git diff --name-only "$parent" "$GITHUB_SHA")"
          test "$changed" = ".github/.trigger-source-backup-release"

          armed="$(git diff --name-only "$source" "$parent")"
          test "$armed" = ".github/workflows/source-backup-release.yml"

      - name: Create complete tracked-project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          zip_name="FingMi-Xray-${BACKUP_TAG}.zip"
          prefix="FingMi-Xray-${BACKUP_TAG}/"

          git archive             --format=zip             --prefix="$prefix"             --output="release/$zip_name"             "$BACKUP_SOURCE_SHA"

          source_count="$(git ls-tree -r --name-only "$BACKUP_SOURCE_SHA" | wc -l)"
          archive_count="$(unzip -Z1 "release/$zip_name" | grep -v '/$' | wc -l)"
          test "$source_count" -eq "$archive_count"
          test -s "release/$zip_name"

          zip_sha256="$(sha256sum "release/$zip_name" | awk '{print $1}')"
          echo "SOURCE_ZIP_NAME=$zip_name" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP_SHA256=$zip_sha256" >> "$GITHUB_ENV"
          echo "SOURCE_FILE_COUNT=$source_count" >> "$GITHUB_ENV"

      - name: Publish source-backup Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          notes="$RUNNER_TEMP/source-backup-notes.md"
          {
            echo "## FingMi-Xray complete source backup"
            echo
            printf -- "- Source commit: \`%s\`\n" "$BACKUP_SOURCE_SHA"
            printf -- "- Tracked files in ZIP: \`%s\`\n" "$SOURCE_FILE_COUNT"
            printf -- "- ZIP SHA-256: \`%s\`\n" "$SOURCE_ZIP_SHA256"
            echo "- This is a source backup only. No APK build was triggered for this backup."
          } > "$notes"

          if gh release view "$BACKUP_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$BACKUP_TAG"               --repo "$GITHUB_REPOSITORY"               --cleanup-tag               --yes
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$BACKUP_TAG" >/dev/null 2>&1; then
            gh api               --method DELETE               "repos/$GITHUB_REPOSITORY/git/refs/tags/$BACKUP_TAG"
          fi

          # Create from the marker-only trigger commit so the Actions token can
          # publish from its own trusted workflow tree, then retarget the
          # lightweight tag to the exact clean source commit archived above.
          gh release create "$BACKUP_TAG"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "$BACKUP_TAG"             --notes-file "$notes"             --prerelease             "release/$SOURCE_ZIP_NAME"

          gh api             --method PATCH             "repos/$GITHUB_REPOSITORY/git/refs/tags/$BACKUP_TAG"             -f sha="$BACKUP_SOURCE_SHA"             -F force=true >/dev/null

          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$BACKUP_TAG")"
          jq -e --arg sha "$BACKUP_SOURCE_SHA" '
            .object.type == "commit" and .object.sha == $sha
          ' <<< "$tag_json" >/dev/null

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$BACKUP_TAG")"
          jq -e             --arg name "$SOURCE_ZIP_NAME"             --arg digest "sha256:$SOURCE_ZIP_SHA256" '
              .prerelease == true and
              .draft == false and
              (.assets | length) == 1 and
              any(.assets[]; .name == $name and .digest == $digest)
            ' <<< "$release_json" >/dev/null

          echo "Published complete source backup $BACKUP_TAG"
