name: Release 563002 notes only (one time)
on:
  push:
    branches:
      - dev/fongmi-upstream-adaptation
    paths:
      - .github/workflows/99-release-notes-563002-once.yml
permissions:
  contents: write
concurrency:
  group: fingmi-formal-release
  cancel-in-progress: false
jobs:
  notes:
    if: >-
      github.repository == 'rileyaaa/FingMi-Xray' &&
      github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' &&
      github.event.head_commit.message == 'docs: update published 563002 release notes only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update only the existing release description and verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          CONFIG = json.loads("{\"repo\":\"rileyaaa/FingMi-Xray\",\"release_id\":458382979,\"main\":\"b4de568a614db061602e60821b1827405844c81b\",\"expected\":[{\"id\":378882577,\"tag_name\":\"v5.6.0-xray.5\",\"target_commitish\":\"main\",\"name\":\"v5.6.0-xray.5\",\"draft\":false,\"prerelease\":false,\"immutable\":false,\"published_at\":\"2026-08-29T05:13:05Z\",\"assets\":[{\"id\":534791583,\"name\":\"FongMi-Xray-TV-v5.6.0-xray.5-arm64-v8a.apk\",\"size\":145354377,\"digest\":\"sha256:b5ac05193c1e19809fc7ffb3048f7d75aaa2124eace9953d669f4a81a477c21d\",\"state\":\"uploaded\"},{\"id\":534791937,\"name\":\"FongMi-Xray-TV-v5.6.0-xray.5-armeabi-v7a.apk\",\"size\":129871795,\"digest\":\"sha256:cacc7a90ce082adf955fc80a444b54f8cc86d5b5c3ac7acb13d1392b59928bda\",\"state\":\"uploaded\"}]},{\"id\":423776816,\"tag_name\":\"v5.6.3-xray.1\",\"target_commitish\":\"4bea3a54ece68fbb439374e7d7944ec94fe28683\",\"name\":\"v5.6.3-xray.1\",\"draft\":false,\"prerelease\":false,\"immutable\":false,\"published_at\":\"2026-10-26T02:13:56Z\",\"assets\":[{\"id\":676638524,\"name\":\"FongMi-Xray-TV-v5.6.3-xray.1-arm64-v8a.apk\",\"size\":133283631,\"digest\":\"sha256:004cd5e003a644a7e421a859cd7a7187e98e729bea94af157127dd3d20609bd5\",\"state\":\"uploaded\"},{\"id\":676638525,\"name\":\"FongMi-Xray-TV-v5.6.3-xray.1-armeabi-v7a.apk\",\"size\":117801063,\"digest\":\"sha256:64fdc38928f96185e924444e9c4ca33c582021e732df4b7e041daa4321615424\",\"state\":\"uploaded\"}]},{\"id\":458382979,\"tag_name\":\"v5.6.3-xray.2\",\"target_commitish\":\"b4de568a614db061602e60821b1827405844c81b\",\"name\":\"v5.6.3-xray.2\",\"draft\":false,\"prerelease\":false,\"immutable\":false,\"published_at\":\"2026-11-25T16:52:30Z\",\"assets\":[{\"id\":792339964,\"name\":\"FongMi-Xray-TV-v5.6.3-xray.2-arm64-v8a.apk\",\"size\":133304111,\"digest\":\"sha256:132499ac2abc137345db19c8afd6a5c3ecc1edc7b73e1f2d57d97accb8d5140f\",\"state\":\"uploaded\"},{\"id\":792339971,\"name\":\"FongMi-Xray-TV-v5.6.3-xray.2-armeabi-v7a.apk\",\"size\":117821543,\"digest\":\"sha256:e8879fcdcde7102776a23c7e5e3637c10d5060783575d9f8730977cb49af117a\",\"state\":\"uploaded\"}]}],\"refs\":{\"v5.6.3-xray.2\":{\"type\":\"commit\",\"sha\":\"b4de568a614db061602e60821b1827405844c81b\"},\"v5.6.3-xray.1\":{\"type\":\"commit\",\"sha\":\"4bea3a54ece68fbb439374e7d7944ec94fe28683\"},\"v5.6.0-xray.5\":{\"type\":\"commit\",\"sha\":\"f9db9a86e4373c78b3ed8e6aa13b598e826df5e1\"}},\"other_bodies\":{\"378882577\":\"\",\"423776816\":\"v5.6.3-xray.1 正式版\\n\\nAPK 构建源码：`4bea3a54ece68fbb439374e7d7944ec94fe28683`\\nActions run：40252299406 / attempt 1\\n\\n应用显示名称改为 FongMi-Xray，包名与固定签名保持不变，本次包含当前已合入的 Xray 错误去敏和 TV 网络恢复修复。Xray 设置在 UDP 下增加默认关闭的 TLS 分片开关，预设 tlshello / 80–120 字节 / 5–10 毫秒；测试连接与实际播放均传递对应设置，Hysteria2、KCP、QUIC、无 TLS 与 XHTTP 仅 H3 等不适用配置自动跳过。该选项用于部分网络的握手兼容，不保证普遍提速，也不能修正节点域名 DNS 污染。保留此前退出清理、主机名崩溃与 decoder 依赖修复；不升级 Xray 核心或公开 FongMi 基线。源码、单元、双 ABI native、Release 编译与签名校验已执行；电视真机行为尚未验收。\\n\\nFongMi-Xray-TV-v5.6.3-xray.1-armeabi-v7a.apk: `sha256:64fdc38928f96185e924444e9c4ca33c582021e732df4b7e041daa4321615424` (117801063 bytes)\\nFongMi-Xray-TV-v5.6.3-xray.1-arm64-v8a.apk: `sha256:004cd5e003a644a7e421a859cd7a7187e98e729bea94af157127dd3d20609bd5` (133283631 bytes)\\n\\n安装说明：本次按用户要求重置为 v5.6.3-xray.1 / versionCode 563001。已安装 .2/.3/.4 的设备通常不能直接降级覆盖；请先备份配置，再按设备支持的安装方式处理。APK 来自原 Actions 完整构建 40252299406，本次仅完成产物复验与发布续传。\\n\"},\"old_body\":\"v5.6.3-xray.2 正式版\\n\\nAPK 构建源码：`b4de568a614db061602e60821b1827405844c81b`\\nActions run：45654771289 / attempt 1\\n\\n应用显示名称改为 FongMi-Xray，包名与固定签名保持不变，可从此前同签名版本覆盖升级。Xray 设置在 UDP 下增加默认关闭的 TLS 分片开关，预设 tlshello / 80–120 字节 / 5–10 毫秒；测试连接与实际播放均传递对应设置，Hysteria2、KCP、QUIC、无 TLS 与 XHTTP 仅 H3 等不适用配置自动跳过。该选项用于部分网络的握手兼容，不保证普遍提速，也不能修正节点域名 DNS 污染。本版采用公开 FongMi/TV 5.6.3 源码基线；Xray 核心保持既有固定版本。源码、单元、双 ABI native、Release 编译与签名校验已执行；电视真机行为尚未验收。\\n\\nFongMi-Xray-TV-v5.6.3-xray.2-armeabi-v7a.apk: `sha256:e8879fcdcde7102776a23c7e5e3637c10d5060783575d9f8730977cb49af117a` (117821543 bytes)\\nFongMi-Xray-TV-v5.6.3-xray.2-arm64-v8a.apk: `sha256:132499ac2abc137345db19c8afd6a5c3ecc1edc7b73e1f2d57d97accb8d5140f` (133304111 bytes)\",\"notes\":\"## v5.6.3-xray.2 正式版\\n\\n### 本次更新\\n\\n- 新增电视直播 Xray 自动开启规则：在 Xray 节点设置页填写分组或频道名称，支持 `*` 通配符、中英文逗号及换行分隔，例如分组 `港台,海外`、频道 `翡翠台,东森幼幼台,东森*`。也可通过原扫码页面在手机上填写，回到电视设置页保存生效。\\n- 连续切换命中规则的直播频道时，复用已建立的 Xray 代理连接，避免反复启停；切台仍独立处理播放身份和旧请求。规则留空时保持原手动模式，未命中规则、点播及回看保持既有行为。\\n- 修复 Xray 播放切换、启停重入、旧请求回调及远程台标、节目表、字幕、弹幕清理等边界问题；完善公网 IPv6、DNS 根点及 RTSP 代理地址检查。\\n- 完善电视待机、长后台后的网络恢复，避免恢复清理重叠和过期回调影响当前页面。\\n\\n继续基于公开 FongMi/TV 5.6.3 稳定源码，保留既有 TLS 分片功能；Xray Core 与固定播放器依赖不升级。\\n\\n### 下载与升级\\n\\n- `arm64-v8a`：适用于支持 64 位 ARM 应用的 Android TV 设备。\\n- `armeabi-v7a`：适用于仅支持 32 位 ARM 应用的 Android TV 设备。\\n- 本版包名仍为 `com.fongmi.android.tv`，versionCode 为 `563002`，与 `.1` 使用相同正式签名。已安装 `.1` 的设备可选择对应 ABI 直接覆盖升级，无需卸载；不支持以此版本降级覆盖更高 versionCode 的安装包。\\n\\n### 构建与校验\\n\\n- 构建源码：`b4de568a614db061602e60821b1827405844c81b`\\n- [Actions #45654771289](https://github.com/rileyaaa/FingMi-Xray/actions/runs/45654771289)\\n- 源码回归、单元测试、双 ABI 原生库及 DEX/Manifest 检查、Release 正式签名和 16 KB 对齐均已通过。电视真机覆盖安装、实际播放与待机恢复尚未实测。\\n\\n| APK | SHA-256 |\\n| --- | --- |\\n| FongMi-Xray-TV-v5.6.3-xray.2-arm64-v8a.apk | `132499ac2abc137345db19c8afd6a5c3ecc1edc7b73e1f2d57d97accb8d5140f` |\\n| FongMi-Xray-TV-v5.6.3-xray.2-armeabi-v7a.apk | `e8879fcdcde7102776a23c7e5e3637c10d5060783575d9f8730977cb49af117a` |\\n\"}")
          repo = CONFIG['repo']
          assert os.environ['GITHUB_REPOSITORY'] == repo
          def api(path, method='GET', data=None):
              cmd = ['gh', 'api', '--method', method, 'repos/' + repo + '/' + path]
              if data is not None:
                  cmd += ['--input', '-']
              result = subprocess.run(cmd, input=json.dumps(data) if data is not None else None,
                                      text=True, capture_output=True, check=True)
              return json.loads(result.stdout)
          def fingerprint(r):
              keys = ('id', 'tag_name', 'target_commitish', 'name', 'draft', 'prerelease', 'immutable', 'published_at')
              result = {k: r[k] for k in keys}
              result['assets'] = sorted([{k: a[k] for k in ('id', 'name', 'size', 'digest', 'state')} for a in r['assets']], key=lambda a: a['id'])
              return result
          def verify():
              rows = api('releases?per_page=30')
              assert sorted(map(fingerprint, rows), key=lambda r: r['id']) == CONFIG['expected'], 'Release metadata or assets changed'
              for r in rows:
                  if str(r['id']) in CONFIG['other_bodies']:
                      assert r['body'] == CONFIG['other_bodies'][str(r['id'])], 'Other release body changed'
              assert api('releases/latest')['id'] == CONFIG['release_id'], 'Latest release changed'
              for tag, expected in CONFIG['refs'].items():
                  ref = api('git/ref/tags/' + tag)['object']
                  assert {k: ref[k] for k in ('type', 'sha')} == expected, 'Tag changed: ' + tag
              assert api('branches/main')['commit']['sha'] == CONFIG['main'], 'Main changed'
          verify()
          path = 'releases/' + str(CONFIG['release_id'])
          old = api(path)
          assert old['body'] in (CONFIG['old_body'], CONFIG['notes']), 'Release body changed unexpectedly'
          if old['body'] != CONFIG['notes']:
              try:
                  patched = api(path, 'PATCH', {'body': CONFIG['notes']})
              except subprocess.CalledProcessError as e:
                  print('STOP: Release body PATCH failed:', e.stderr.strip(), flush=True)
                  raise SystemExit(1)
              assert patched['body'] == CONFIG['notes'], 'PATCH response body differs'
          else:
              print('Release body already matches', flush=True)
          assert api(path)['body'] == CONFIG['notes'], 'Release body readback differs'
          verify()
          print('PASS body updated and read back for Release 458382979; all three releases, asset IDs/digests, tags, Latest and main unchanged', flush=True)
          PY
