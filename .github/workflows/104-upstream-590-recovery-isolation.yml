name: "5.9.0 isolated Android recovery integration (no APK)"
on:
  push:
    branches: [dev/fongmi-upstream-adaptation]
    paths: ['.github/workflows/104-upstream-590-recovery-isolation.yml']
permissions:
  contents: read
jobs:
  recovery-integration:
    if: >-
      github.repository == 'rileyaaa/FingMi-Xray' && github.ref == 'refs/heads/dev/fongmi-upstream-adaptation' && github.event.head_commit.message == 'ci: isolate recovery test application lifetimes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: fork
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/TV
          ref: c616c0aa3613e87529791587a9f71b78c278c991
          path: inputs/old-tv
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FongMi/TV
          ref: d3a0b84b24cf6628d72a4dbc2be453875b005536
          path: inputs/tv
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Prepare pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test ! -e fork/signing
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Compile actual Android modules and run integration tests
        run: python3 fork/scripts/upstream-adaptation/verify_android_recovery_integration.py --old-tv inputs/old-tv --tv inputs/tv
