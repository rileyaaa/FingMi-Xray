name: Archive - prepare v5.6.0 native evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V7_SHA256: cacc7a90ce082adf955fc80a444b54f8cc86d5b5c3ac7acb13d1392b59928bda
      V8_SHA256: b5ac05193c1e19809fc7ffb3048f7d75aaa2124eace9953d669f4a81a477c21d
      CANDIDATE_SHA256: 0ed42581af11ac7163ebde148b318807c244e2a318f40c41d33f50b70bf967ee
    steps:
      - uses: actions/checkout@v7

      - name: Download and verify pinned inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_info="$(gh api repos/rileyaaa/FingMi-Xray/actions/artifacts/10859533459)"
          if ! jq -e --arg sha "sha256:$CANDIDATE_SHA256" \
            '.name == "fongmi-media3-aar-candidate-1.11.0" and .expired == false and .size_in_bytes == 44336768 and .digest == $sha' \
            <<< "$artifact_info" >/dev/null; then
            echo 'Pinned player candidate artifact is missing, expired, or differs from the verified input.' >&2
            exit 1
          fi
          release_info="$(gh api repos/rileyaaa/FingMi-Xray/releases/tags/v5.6.0-xray.5)"
          if ! jq -e --arg v7 "sha256:$V7_SHA256" --arg v8 "sha256:$V8_SHA256" '
            ([.assets[] | select(.name == "FongMi-Xray-TV-v5.6.0-xray.5-armeabi-v7a.apk" and .size == 129871795 and .digest == $v7)] | length) == 1 and
            ([.assets[] | select(.name == "FongMi-Xray-TV-v5.6.0-xray.5-arm64-v8a.apk" and .size == 145354377 and .digest == $v8)] | length) == 1
          ' <<< "$release_info" >/dev/null; then
            echo 'Pinned release APK assets have changed or are missing.' >&2
            exit 1
          fi
          mkdir -p recovery/work/verified recovery/work/restored
          gh release download v5.6.0-xray.5 \
            --repo rileyaaa/FingMi-Xray \
            --pattern 'FongMi-Xray-TV-v5.6.0-xray.5-armeabi-v7a.apk' \
            --pattern 'FongMi-Xray-TV-v5.6.0-xray.5-arm64-v8a.apk' \
            --dir recovery/work/verified
          mv recovery/work/verified/FongMi-Xray-TV-v5.6.0-xray.5-armeabi-v7a.apk \
            recovery/work/verified/v7.apk
          mv recovery/work/verified/FongMi-Xray-TV-v5.6.0-xray.5-arm64-v8a.apk \
            recovery/work/verified/v8.apk
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            'https://api.github.com/repos/rileyaaa/FingMi-Xray/actions/artifacts/10859533459/zip' \
            -o recovery/work/verified/candidate.zip
          printf '%s  %s\n' "$V7_SHA256" recovery/work/verified/v7.apk \
            "$V8_SHA256" recovery/work/verified/v8.apk \
            "$CANDIDATE_SHA256" recovery/work/verified/candidate.zip \
            | sha256sum -c -
          python3 scripts/recovery/inspect-published-libxray-native.py \
            --v7-apk recovery/work/verified/v7.apk \
            --v8-apk recovery/work/verified/v8.apk

      - name: Restore exactly two published JNI binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/recovery/restore-published-ffmpegjni.py \
            --candidate recovery/work/verified/candidate.zip \
            --v7-apk recovery/work/verified/v7.apk \
            --v8-apk recovery/work/verified/v8.apk \
            --to recovery/work/restored/lib-decoder-ffmpeg-release.aar
          python3 scripts/recovery/check-player-ffmpegjni-against-published.py \
            --aar-dir recovery/work/restored
          {
            echo 'Source: published v5.6.0-xray.5 APKs (SHA-256 checked before extraction)'
            echo 'Player candidate: FongMi/media@3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d'
            echo 'Replacement: only jni/{armeabi-v7a,arm64-v8a}/libffmpegJNI.so'
            sha256sum recovery/work/restored/lib-decoder-ffmpeg-release.aar
          } > recovery/work/restored/RESTORE_MANIFEST.txt

      - name: Fetch pinned official libXray AAR and restore published Go JNI
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/recovery/fetch-libxray.sh
          test -s libxray/libs/libXray.aar
          python3 - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from runpy import run_path
          from zipfile import ZipFile

          methods = run_path('scripts/recovery/check-player-java-api.py')['class_methods']
          with ZipFile(Path('libxray/libs/libXray.aar')) as aar:
              with ZipFile(BytesIO(aar.read('classes.jar'))) as jar:
                  actual = methods(jar.read('libXray/LibXray.class'))
              expected = ('invoke', '(Ljava/lang/String;)Ljava/lang/String;')
              if expected not in actual:
                  raise SystemExit('official libXray AAR lacks invoke(String): String')
              for abi in ('armeabi-v7a', 'arm64-v8a'):
                  if f'jni/{abi}/libgojni.so' not in aar.namelist():
                      raise SystemExit(f'official libXray AAR lacks libgojni.so for {abi}')
          print('libXray Java entry and both native ABIs present')
          PY
          python3 scripts/recovery/restore-published-libxrayjni.py \
            --official-aar libxray/libs/libXray.aar \
            --v7-apk recovery/work/verified/v7.apk \
            --v8-apk recovery/work/verified/v8.apk \
            --to recovery/work/restored/libXray.aar \
            | tee recovery/work/restored/LIBXRAY_JNI_SHA256.txt
          sha256sum libxray/libs/libXray.aar \
            >> recovery/work/restored/RESTORE_MANIFEST.txt
          sha256sum recovery/work/restored/libXray.aar \
            >> recovery/work/restored/RESTORE_MANIFEST.txt

      - name: Upload checked AAR dependencies only
        uses: actions/upload-artifact@v7
        with:
          name: fingmi-faithful-native-dependencies
          path: |
            recovery/work/restored/
          retention-days: 7
          if-no-files-found: error
