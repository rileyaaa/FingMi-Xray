name: Restore published FFmpeg JNI

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V7_SHA256: cacc7a90ce082adf955fc80a444b54f8cc86d5b5c3ac7acb13d1392b59928bda
      V8_SHA256: b5ac05193c1e19809fc7ffb3048f7d75aaa2124eace9953d669f4a81a477c21d
      CANDIDATE_SHA256: 0ed42581af11ac7163ebde148b318807c244e2a318f40c41d33f50b70bf967ee
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify pinned inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p recovery/work/verified recovery/work/restored
          base="https://github.com/rileyaaa/FingMi-Xray/releases/download/v5.6.0-xray.5"
          curl -fL --retry 3 --retry-delay 2 \
            "$base/FongMi-Xray-TV-v5.6.0-xray.5-armeabi-v7a.apk" \
            -o recovery/work/verified/v7.apk
          curl -fL --retry 3 --retry-delay 2 \
            "$base/FongMi-Xray-TV-v5.6.0-xray.5-arm64-v8a.apk" \
            -o recovery/work/verified/v8.apk
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            'https://api.github.com/repos/rileyaaa/FingMi-Xray/actions/artifacts/10859533459/zip' \
            -o recovery/work/verified/candidate.zip
          printf '%s  %s\n' "$V7_SHA256" recovery/work/verified/v7.apk \
            "$V8_SHA256" recovery/work/verified/v8.apk \
            "$CANDIDATE_SHA256" recovery/work/verified/candidate.zip \
            | sha256sum -c -

      - name: Restore exactly two published JNI binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/restore-published-ffmpegjni.py \
            --candidate recovery/work/verified/candidate.zip \
            --v7-apk recovery/work/verified/v7.apk \
            --v8-apk recovery/work/verified/v8.apk \
            --to recovery/work/restored/lib-decoder-ffmpeg-release.aar
          python3 scripts/check-player-ffmpegjni-against-published.py \
            --aar-dir recovery/work/restored
          {
            echo 'Source: published v5.6.0-xray.5 APKs (SHA-256 checked before extraction)'
            echo 'Player candidate: FongMi/media@3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d'
            echo 'Replacement: only jni/{armeabi-v7a,arm64-v8a}/libffmpegJNI.so'
            sha256sum recovery/work/restored/lib-decoder-ffmpeg-release.aar
          } > recovery/work/restored/RESTORE_MANIFEST.txt

      - name: Upload checked decoder AAR only
        uses: actions/upload-artifact@v4
        with:
          name: fingmi-published-ffmpegjni-restored
          path: recovery/work/restored/
          retention-days: 7
          if-no-files-found: error
