# Original continuation preserved but disabled on this branch.
name: "03｜发布恢复：已验证 APK 续传"

on:
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: "APK 已编译验证成功、但发布阶段失败的原始 Actions Run ID"
        type: string
        required: true
      replace_existing:
        description: "明确授权时替换同版本的正式 Release（默认不替换）"
        type: boolean
        default: false
      rollback_tag:
        description: "预先创建的旧版回退标签；如运行 Token 无法创建标签则必填"
        type: string
        default: ""
      prune_superseded:
        description: "成功切换发布后，仅保留黄金版和新正式版 Release（默认不清理）"
        type: boolean
        default: false

concurrency:
  group: fingmi-formal-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  resume:
    name: "原产物验证与发布续传"
    if: ${{ false }} # Public validation only: production publication disabled
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: "21"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: 运行发布续传安全检查
        run: |
          python3 tests/test-release-publication.py
          python3 tests/test-resume-verified-release.py
          python3 tests/test-media3-dex-linkage.py

      - name: 只准备 APK 校验工具
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --channel=3 --install 'build-tools;37.0.0'

      - name: 重新验证原始 Actions APK 并续传发布
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
          ALLOW_REPLACEMENT: ${{ inputs.replace_existing }}
          PRUNE_SUPERSEDED: ${{ inputs.prune_superseded }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          args=(--verified-run-id "$VERIFIED_RUN_ID" --sdk "$sdk_root" --rollback-tag "$ROLLBACK_TAG")
          if [ "$ALLOW_REPLACEMENT" = true ]; then
            args+=(--replace-existing)
          fi
          if [ "$PRUNE_SUPERSEDED" = true ]; then
            args+=(--prune-superseded)
          fi
          python3 scripts/build/resume-verified-release.py "${args[@]}"

      - name: 记录原始构建及发布标识
        if: always()
        shell: bash
        run: |
          if [ -f release/resume-verification.json ]; then
            {
              echo 'APKs retain the original verified build commit; current checkout supplies publication tooling only.'
              echo '```json'
              cat release/resume-verification.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 续传失败时上传报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fingmi-xray-release-resume-failure-reports
          path: |
            release/publication-*.json
            release/resume-verification.json
          if-no-files-found: ignore
          retention-days: 1
