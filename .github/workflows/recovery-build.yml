name: Recovery faithful TV build

on:
  workflow_dispatch:

jobs:
  faithful:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare and compile faithful recovered TV source
        shell: bash
        run: |
          chmod +x scripts/fetch-libxray.sh
          chmod +x scripts/prepare-legacy-faithful.sh
          chmod +x scripts/build-legacy-faithful.sh
          scripts/build-legacy-faithful.sh

      - name: Upload recovered debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fingmi-faithful-leanback-arm64-debug
          path: recovery/work/fingmi-faithful-5.6.0/app/build/outputs/apk/leanback/arm64_v8a/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
