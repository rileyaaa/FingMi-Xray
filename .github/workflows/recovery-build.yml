name: Recovery module build

on:
  push:
    branches:
      - main
    paths:
      - "xray/**"
      - "libxray/**"
      - "scripts/fetch-libxray.sh"
      - "settings.gradle"
      - "gradle/wrapper/**"
      - ".github/workflows/recovery-build.yml"
  workflow_dispatch:

concurrency:
  group: xray-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xray:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure local properties
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          storeFile=/tmp/fingmi-recovery-placeholder.jks
          keyAlias=placeholder
          storePassword=placeholder
          EOF

      - name: Fetch libXray
        shell: bash
        run: |
          chmod +x scripts/fetch-libxray.sh
          scripts/fetch-libxray.sh

      - name: Compile Xray module
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :xray:assembleDebug --stacktrace
